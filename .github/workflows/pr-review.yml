name: PR Review (agents)

# Independent multi-agent review of a PR diff, IN CI.
#
# WHY
#   The four reviewer mandates (.claude/agents/sv-*.md) already existed, but they
#   only ran inside a live Claude Code session via the `review-fanout` saved
#   workflow. That coupled every merge to a human having a session open: measured
#   2026-08-01, the five most recently merged PRs (#2947 → #2930) carried ZERO
#   review recorded on GitHub, because the review happened somewhere GitHub
#   cannot see. This workflow moves the same fan-out onto the PR itself, so an
#   agent-authored PR is reviewable — and mergeable — without a session.
#
# WHAT IT IS NOT
#   Not an auto-merger. It reviews and grades; a human or the issue-batch
#   orchestrator still merges. A confirmed breaking public-API change is the
#   maintainer gate and is reported as such, never auto-fixed.
#
# THE REVIEWERS CANNOT WRITE
#   CI spawns the `sv-ci-*` agent types, not the canonical `sv-*` ones: same
#   mandates, wrapped in a toolset of `Read, Glob, Grep` and no shell. That is
#   what makes a reviewer structurally incapable of editing the checkout it is
#   judging (#3016) — the process-wide grant in `claude_args` cannot be scoped
#   per agent, so it never could have done this job. The canonical agents keep
#   their shell for live sessions, where they review uncommitted work.
#
# GENERATOR != EVALUATOR
#   The agents FIND (write `review-verdict.json`); `grade-pr-review.sh` DECIDES.
#   The merge verdict is computed by a self-tested bash/python script
#   (`test-grade-pr-review.sh`, wired into ci.yml → repo-hygiene), not by the
#   model grading its own output. It fails CLOSED: a crashed fan-out, a missing
#   file, or a dropped reviewer is REVIEW_INCOMPLETE, never a pass.
#
# AUTH / COST
#   Reuses CLAUDE_CODE_OAUTH_TOKEN (Thomas's Claude Max quota — no per-call API
#   spend), same secret as claude.yml and doc-audit.yml. ⚠️ This is the most
#   expensive consumer of that quota in the repo: each run spawns 4 reviewers
#   plus one adversarial verifier per ERROR finding. Measured 2026-08-01, this
#   repo peaks at 30 PRs in a day — 120+ agent runs if every one is reviewed.
#   Three things bound it: `concurrency` (a push burst on one PR costs one
#   review), the bot-author exclusion, and MAX_REVIEWS_PER_DAY. If quota still
#   tightens, narrow the trigger to `opened, ready_for_review` and rely on
#   workflow_dispatch for re-reviews.
#
# FORK PRs
#   A `pull_request` from a fork gets NO secrets and a read-only GITHUB_TOKEN —
#   structurally, not by choice. Such a run cannot review and does not pretend
#   to: it emits a loud step-summary + `::warning::` telling the maintainer to
#   re-run it via workflow_dispatch. It never reports a silent green review.
#   `pull_request_target` would give secrets to fork-authored code — deliberately
#   NOT used.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

# One review per PR. A new push supersedes the in-flight review of an older
# commit — the verdict that matters is the one for the head being merged.
# NOTE: unlike a paths-filtered workflow, a cancelled run here leaves the PR
# with the *previous* commit's check, which GitHub shows as stale rather than
# green — see #2925 for why "green run, skipped job" is the failure mode to
# avoid. There is deliberately no `paths:` filter on this workflow.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write     # post/update the single review comment
  id-token: write          # OIDC for claude-code-action (matches claude.yml)

jobs:
  review:
    name: Agent review
    # Drafts are work-in-progress — reviewing every draft push burns quota for
    # a diff the author is still writing. `ready_for_review` re-triggers it.
    #
    # Bot-authored PRs are excluded. Measured 2026-08-01 over the last 100 PRs:
    # 7 from Dependabot, 3 from github-actions. A dependency bump does not need
    # four Opus reviewers arguing about KDoc — `renovate`/`dependabot` diffs are
    # mechanical and already gated by the compile + test checks. claude.yml
    # applies the same exclusion for the same reason.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAX_REVIEWS_PER_DAY: '25'
    steps:
      - name: Resolve PR under review
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NUM="${INPUT_PR//[^0-9]/}"
            [ -n "$NUM" ] || { echo "::error::inputs.pr is not a number"; exit 1; }
            IS_FORK=false   # a maintainer dispatch always runs with repo secrets
          else
            NUM="$EVENT_PR"
            if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then IS_FORK=false; else IS_FORK=true; fi
          fi
          echo "number=$NUM"   >> "$GITHUB_OUTPUT"
          echo "is_fork=$IS_FORK" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$NUM (fork=$IS_FORK)"

      # ⚠️ THE REAL CEILING ON THIS WORKFLOW'S COST.
      #   Measured 2026-08-01: this repo peaks at 30 PRs in a single day (21 on
      #   several others). Every non-draft PR *push* spawns 4 reviewers plus one
      #   adversarial verifier per error finding, so an active day is 120+ agent
      #   runs on the maintainer's Claude Max quota. `concurrency` collapses a
      #   push burst on ONE PR into a single review, but does nothing across
      #   distinct PRs — which is exactly where the volume is.
      #
      #   Over budget the review is skipped LOUDLY, never silently: the whole
      #   point of this workflow is that an unreviewed PR must not look like a
      #   reviewed one.
      - name: Check daily review budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          # `skipped` runs never reached the reviewers, so they cost nothing —
          # the same correction claude.yml's budget needed (a raw run count
          # there would have capped the bot on a day with zero real spend).
          USED="$(gh run list --workflow=pr-review.yml --created ">=$TODAY" \
                    --limit 100 --json conclusion \
                    --jq 'map(select(.conclusion != "skipped")) | length' 2>/dev/null || echo 0)"
          echo "Agent reviews today: $USED / $MAX_REVIEWS_PER_DAY"
          if [ "$USED" -gt "$MAX_REVIEWS_PER_DAY" ]; then
            echo "within_budget=false" >> "$GITHUB_OUTPUT"
            {
              echo '## ⚠️ NOT REVIEWED — daily review budget reached'
              echo
              echo "This repository has already run **$USED** agent reviews today"
              echo "(cap \`$MAX_REVIEWS_PER_DAY\`). Reviewing this PR too would spend"
              echo 'Claude Max quota that later PRs today may need more.'
              echo
              echo '**No reviewer ran — do not read this check as a clean review.**'
              echo 'Review by hand, or force one once the day rolls over:'
              echo
              echo '```bash'
              echo "gh workflow run pr-review.yml -f pr=${{ steps.pr.outputs.number }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Review budget reached::$USED reviews today (cap $MAX_REVIEWS_PER_DAY) — this PR was NOT reviewed."
          else
            echo "within_budget=true" >> "$GITHUB_OUTPUT"
          fi

      # ⛔ TWO CHECKOUTS, ON PURPOSE — a dispatch must NOT check out `main`.
      #   `actions/checkout` defaults to `github.ref`, which on a
      #   `workflow_dispatch` is whatever `--ref` said (i.e. `main`), NOT the PR
      #   named in `inputs.pr`. The reviewers would then diff `main...HEAD` —
      #   empty — and report a clean PASS on a PR they never read. That is a
      #   FALSE GREEN, and it lands on the one path that exists precisely to
      #   rescue reviews that cannot run automatically (fork PRs, per this
      #   workflow's own header and CLAUDE.md).
      #   The `pull_request` path is left exactly as it was: it already resolves
      #   the right ref, and rewriting a working path to share one step would
      #   silently switch the review from the merge ref to the head ref.
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          # Full history: the reviewers diff against origin/main and read git log
          # for context. A shallow clone makes `main...HEAD` unresolvable.
          fetch-depth: 0

      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          # `refs/pull/N/head` exists on the BASE repo even for fork PRs, which
          # is what makes the manual re-review of a fork PR possible at all.
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      # Secrets are absent on fork PRs. Decide it from a real env read rather
      # than a `secrets.*` expression in an `if:`, so the outcome is explicit
      # and visible in the log instead of a silently skipped step.
      - name: Check reviewer credentials
        id: creds
        if: steps.budget.outputs.within_budget == 'true'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      # Positive cue, not an absence: say out loud that no review happened and
      # exactly how to get one. A quiet pass here would read as "reviewed, clean".
      # The budget guard is NOT redundant with the credentials check. Over
      # budget, `Check reviewer credentials` never runs, so `has_token` is the
      # empty string — which satisfies `!= 'true'` and would make this step
      # announce "no reviewer credentials" for a PR whose real problem is the
      # daily cap. Same class of wrong-cause message as the self-modification
      # case: the run was already correctly blocked, it just named the wrong
      # reason. The budget step writes its own summary.
      - name: Report unreviewable run
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token != 'true'
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
        run: |
          set -euo pipefail
          {
            echo '## ⚠️ NOT REVIEWED — agent review did not run'
            echo
            if [ "$IS_FORK" = "true" ]; then
              echo "This PR comes from a **fork**, so \`CLAUDE_CODE_OAUTH_TOKEN\` is not available"
              echo "to the run (GitHub withholds secrets from fork \`pull_request\` workflows)."
            else
              echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is missing or expired on this repository."
              echo "Rotate it with \`claude setup-token\` then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`."
            fi
            echo
            echo '**This is not a passing review — no reviewer ran.** A maintainer must review it:'
            echo
            echo '```bash'
            echo "gh workflow run pr-review.yml -f pr=$PR_NUM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=PR not reviewed::No reviewer credentials in this run — see the job summary. Do not read this check as a clean review."

      # claude-code-action refuses to run when the workflow file differs from
      # the copy on the default branch — an anti-exfiltration guard, since a PR
      # that can edit the workflow could otherwise redirect the token. Measured
      # on this workflow's own introducing PR (#2952, run 30714065868): the
      # action logs "Workflow validation failed", then ends the step with
      # `outcome=success` while having done nothing. A silent success that
      # produces no verdict is exactly the shape the grader must never read as
      # a pass — it doesn't, but the resulting REVIEW_INCOMPLETE names the
      # wrong cause ("the agents produced no verdict file"). Detect the real
      # cause up front and say it.
      #
      # This stays a FAILING check rather than an honest skip: a PR that edits
      # the review workflow is precisely the PR a human must read, and a green
      # check here would be the faked-coverage failure mode. It goes green
      # again on any PR that leaves this file alone.
      - name: Detect self-modification of this workflow
        id: selfmod
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A dispatch is not a self-modification, and treating it as one breaks
          # the rescue path. What `claude-code-action` validates is the workflow
          # file it is RUNNING — which on a dispatch comes from `--ref` (normally
          # the default branch), not from the checkout. Since the dispatch path
          # now checks out `refs/pull/N/head`, comparing the checkout would flag
          # every older PR whose copy of this file has simply been superseded,
          # and would refuse to review it. If a dispatch is ever launched from a
          # branch that does edit this file, the action self-skips and the
          # grader still blocks with REVIEW_INCOMPLETE — as everywhere else in
          # this step, the detection improves the message and is never the gate.
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "Dispatch — the running workflow comes from the dispatched ref, not the checkout; skipping the self-modification comparison."
            echo "self_modified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${GITHUB_BASE_REF:-main}"
          # actions/checkout only sets up the remote-tracking ref for the branch
          # it checked out, so `origin/main` is NOT guaranteed to resolve even at
          # fetch-depth 0. Fetch it explicitly, and treat "cannot resolve" as its
          # own case — folding it into the diff comparison would make an
          # unresolvable base look like a modified workflow and turn EVERY PR
          # red. This detection only improves the error message; the grader's
          # fail-closed REVIEW_INCOMPLETE remains the actual gate either way, so
          # degrading to "assume unmodified" here cannot open a green path.
          git fetch origin "$BASE" --depth=1 --quiet 2>/dev/null || true
          if ! git rev-parse --verify --quiet "origin/$BASE" >/dev/null 2>&1; then
            echo "::warning title=Base ref unresolved::Could not resolve origin/$BASE to compare this workflow against; proceeding. If the action self-skips, the grader will still block with REVIEW_INCOMPLETE."
            echo "self_modified=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE" -- .github/workflows/pr-review.yml; then
            echo "self_modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "self_modified=true" >> "$GITHUB_OUTPUT"
            # shellcheck disable=SC2016  # the backticks below are Markdown code spans written into the job summary, not command substitution — single quotes are exactly right here.
            {
              echo '## ⛔ NOT REVIEWED — this PR modifies the review workflow'
              echo
              echo 'This PR changes `.github/workflows/pr-review.yml`, so `claude-code-action`'
              echo 'refuses to run: it requires the workflow file to be byte-identical to the'
              echo "copy on the default branch. That is an anti-exfiltration guard — a PR able"
              echo 'to edit the workflow could otherwise redirect the credential — and it is not'
              echo 'something this repository can or should switch off.'
              echo
              echo '**No reviewer ran. This check is red on purpose.** A change to the review'
              echo 'gate is exactly the change that needs human eyes. Review the diff by hand;'
              echo 'automated review resumes on the next PR that leaves this file untouched.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Review workflow self-modified::claude-code-action cannot run on a PR that edits pr-review.yml. Review this diff manually — see the job summary."
            # Stop here. Continuing would run the action only to have it skip
            # itself in silence, and the grader would then report the wrong
            # cause. The remaining steps also carry the `self_modified` guard as
            # defence in depth, so removing this exit degrades the message
            # rather than opening a green path.
            exit 1
          fi

      # ⛔ THE READ-ONLY CONTRACT IS ENFORCED FROM HERE, NOT FROM THE AGENT FILES.
      #   The reviewers are read-only because their `tools:` frontmatter grants
      #   `Read, Glob, Grep` and nothing else — that is a toolset, not a request,
      #   and it is the only thing in this workflow that makes contamination
      #   impossible rather than merely forbidden (#3016).
      #
      #   But those files live in the PR's own checkout, so a PR could widen them
      #   and be reviewed by the reviewers it just re-armed. This step is the
      #   pin: it lives in `pr-review.yml`, which the self-modification guard
      #   above already freezes against the default branch, so the assertion
      #   cannot be edited by the PR it is judging. Same reasoning as the grader
      #   being read from `origin/$DEFAULT_BRANCH` rather than from the checkout.
      #
      #   Exact-match on purpose. `tools: Read, Glob, Grep, Bash` would read as a
      #   modest widening and would give the whole hole back: measured locally,
      #   a subagent with `Bash` overwrote a tracked file with one `echo`, while
      #   `Write` was absent from the process grant and every git write verb was
      #   in the deny list. `Bash` is a write door exactly as wide as `Write`.
      - name: Assert the CI reviewers cannot write
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        run: |
          set -uo pipefail
          EXPECTED='tools: Read, Glob, Grep'
          RC=0
          for AGENT in sv-ci-code-reviewer sv-ci-security-reviewer \
                       sv-ci-impact-reviewer sv-ci-doc-freshness \
                       sv-ci-finding-verifier; do
            FILE=".claude/agents/${AGENT}.md"
            if [ ! -f "$FILE" ]; then
              echo "::error title=CI reviewer missing::${FILE} does not exist in this checkout, so the fan-out would fall back to an agent that can write. Refusing to review."
              RC=1
              continue
            fi
            # Frontmatter only: stop at the closing `---`, so a `tools:` line in
            # the prose below cannot satisfy the check.
            #
            # ⛔ COUNT the key, never take the FIRST one. The original version
            # ended in `{print; exit}`, which stopped at the first `tools:` line
            # and was exact-matched — so a file carrying the key TWICE
            #     tools: Read, Glob, Grep
            #     tools: Read, Glob, Grep, Bash
            # passed this gate on the benign line while a YAML loader resolving
            # duplicate keys last-wins would hand the reviewer a shell. Caught by
            # the agent review on #3025; the six mutants that step shipped with
            # did not include a duplicate key, which is exactly the shape a
            # hostile edit takes. Duplicates now fail rather than resolve: this
            # gate does not get to guess which line the loader honours.
            FOUND="$(awk '
              NR==1 && $0!="---" { exit }
              NR>1 && /^---[[:space:]]*$/ { exit }
              /^tools:/ { n++; last=$0 }
              END {
                if (n == 1) print last
                else if (n > 1) printf "<%d duplicate tools: keys>", n
              }' "$FILE")"
            if [ "$FOUND" != "$EXPECTED" ]; then
              echo "::error title=CI reviewer is not read-only::${FILE} declares '${FOUND:-<no tools: line>}' — expected '${EXPECTED}'. A reviewer with any other toolset can modify the checkout it is judging (#3016). Refusing to review."
              RC=1
            fi
          done
          # Not `[ "$RC" -eq 0 ] && echo …`: GitHub invokes `run:` as `bash -e`,
          # so a false test on the last line is itself a non-zero exit, and the
          # step would then fail with no message of its own.
          if [ "$RC" -ne 0 ]; then
            exit 1
          fi
          echo "All five CI reviewer types declare a read-only toolset."

      # The reviewers have no shell, so they cannot run `git diff` themselves.
      # The diff is computed here instead — deterministically, once, from the
      # committed merge ref — and handed to them as a file OUTSIDE the
      # repository. Two things follow from that, both wanted:
      #   * every reviewer reads the same bytes, instead of four models each
      #     re-deriving a diff and possibly disagreeing about what the PR is;
      #   * nothing the fan-out needs to read or write lives in the checkout,
      #     which is what lets the assertion below demand a pristine tree with
      #     no exclusions at all.
      - name: Materialise the diff the reviewers read
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          BASE="${GITHUB_BASE_REF:-${DEFAULT_BRANCH:-main}}"
          git fetch origin "$BASE" --quiet 2>/dev/null || true
          if ! git rev-parse --verify --quiet "origin/$BASE" >/dev/null 2>&1; then
            echo "::error title=Base ref unresolved::Could not resolve origin/${BASE}, so the PR diff cannot be computed. No review is possible — this is a CI problem, not a finding about the PR."
            exit 1
          fi
          # Three-dot is what "the PR changed" means. It needs a merge base, and
          # the fetches in this job are depth-limited, so fall back to the
          # two-dot form rather than handing the reviewers a truncated file.
          if ! git diff "origin/$BASE...HEAD" > "$RUNNER_TEMP/pr.diff" 2>/dev/null; then
            echo "::warning title=No merge base::origin/${BASE}...HEAD did not resolve; falling back to a two-dot diff, which also shows anything the base gained since."
            git diff "origin/$BASE" HEAD > "$RUNNER_TEMP/pr.diff"
          fi
          # An empty diff is the FALSE GREEN this workflow's header warns about:
          # four reviewers read nothing, find nothing, and the PR collects a
          # clean verdict it never earned. Refuse loudly instead.
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "::error title=Nothing to review::The diff against origin/${BASE} is empty, and a review of an empty diff would report a PASS the PR never earned. If this is a dispatch on an already-merged PR, that is expected — read the merge commit instead."
            exit 1
          fi
          echo "Diff for the reviewers: $(wc -l < "$RUNNER_TEMP/pr.diff") lines, $(wc -c < "$RUNNER_TEMP/pr.diff") bytes."

      - name: Run the four reviewers
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `Task` and `Bash` are NOT in the action's default tool set — that set is
          # file operations plus comment/GitHub operations, and the docs say so
          # explicitly. This orchestrator is the one caller in the repo that needs
          # both: `Task` to spawn the four reviewers and every adversarial verifier,
          # and a shell to compute the diff its first instruction depends on. That
          # is why `doc-audit`/`maintenance`/`issue-intake` are fine on a bare
          # `--model` arg — they reach GitHub through MCP tools and spawn nobody.
          #
          # ⚠️ `Bash` IS BARE ON PURPOSE, and the narrower form was measured to
          # fail. Two fixes for this landed within minutes of each other: #2952
          # allowlisted five git subcommands, #2964 allowlisted `Bash`. The merge
          # was textually clean and kept the FIRST — so the broader grant, which
          # was the one under test, was silently reverted before it ever ran
          # (#2927's lesson, on this very workflow). What the narrow form actually
          # produced, on run 30719795972 with the allowlist echoed back resolved in
          # the SDK options: 26 turns, 10 denials, no `review-verdict.json`. A
          # reviewer reads a diff with more than five git subcommands — `ls`,
          # `cat`, `rg`, a build file — and every one of those was a denial.
          #
          # #2431 is preserved where it belongs: as a DENY list, not by starving
          # the shell. Reviewers share ONE working tree, so a `git checkout`,
          # `switch`, `reset` or `stash` corrupts it under the others. The prompt
          # already forbids it; these make it structural.
          #
          # `restore`, `apply` and `clean` were added after #3016: the original
          # four stop a reviewer from moving the BRANCH but not from reverting a
          # FILE, and the narrower verbs are the ones a reviewer actually reaches
          # for ("let me see what main said here"). Measured cost of the gap:
          # three false blocking verdicts across #3009 and #3015, each one a
          # reviewer's own edit read back as a defect and then confirmed by an
          # adversarial verifier looking at the same poisoned tree.
          #
          # Both paragraphs above now bind the ORCHESTRATOR, not the reviewers:
          # the reviewers have no shell at all, so no deny list reaches them.
          # Keep the list anyway — the orchestrator holds `Bash` because it needs
          # git, and these seven verbs are the ones that corrupt a checkout the
          # rest of the job is about to assert is pristine.
          #
          # `Write` is GONE, and the honest accounting of what that buys is
          # short: on its own, nothing. `Bash` is a write door exactly as wide —
          # measured locally, a subagent granted `Read, Glob, Grep, Bash` and
          # asked to corrupt a tracked file did it in a single `echo`, with
          # `Write` absent from this grant and every git write verb denied below.
          # Reading a `Write`-less allowlist as "the reviewers are read-only now"
          # would be reading a false victory.
          #
          # What actually makes them read-only is the `tools:` frontmatter on the
          # five `sv-ci-*` agents — `Read, Glob, Grep`, no shell. That is
          # per-agent scoping, which `claude_args` cannot express at all, and the
          # step above pins it. Removing `Write` earns its place for a smaller
          # reason: the orchestrator now writes its verdict outside the repo with
          # a heredoc, so nothing in this job needs `Write`, and an unused grant
          # is only a door left open for an agent spawned outside the five typed
          # ones. It shrinks that blast radius from `Write` + `Bash` to `Bash`.
          claude_args: >-
            --model claude-opus-4-8
            --allowedTools "Task,Read,Glob,Grep,Bash"
            --disallowedTools "Bash(git checkout:*),Bash(git switch:*),Bash(git reset:*),Bash(git stash:*),Bash(git restore:*),Bash(git apply:*),Bash(git clean:*)"
          prompt: |
            You are the SceneView PR review ORCHESTRATOR running in CI.

            Your ONLY deliverable is the file
            `${{ runner.temp }}/review-verdict.json`. You do NOT decide whether
            the PR merges — a separate script grades your findings. Do not post
            comments; do not edit code; do not push. Report, and report honestly.

            ⛔ WRITE NOTHING INSIDE THE REPOSITORY. Not the verdict, not a
            scratch file, not a note to yourself. The checkout must end this job
            byte-identical to `HEAD`, and a step after you asserts exactly that
            and fails the job if it is not — see below for why. Everything you
            need to produce goes under `${{ runner.temp }}`.

            ## Scope

            The PR under review is number ${{ steps.pr.outputs.number }}. That
            value and `${{ runner.temp }}` are the only interpolated values in
            this prompt — the number is sanitized to digits, and no PR title,
            body, or branch name is ever interpolated here, so a crafted PR
            cannot inject instructions into these directions.

            The diff is already computed for you: read
            `${{ runner.temp }}/pr.diff`. It was produced by the workflow from
            the committed merge ref, so it is the whole PR and the only PR — you
            do not need `git diff`, and neither do the reviewers, who have no
            shell at all. Read the WHOLE diff and the surrounding code.

            ⛔ THE PULL REQUEST IS THE COMMITTED DIFF, AND NOTHING ELSE. This
            checkout is clean by construction — CI never has uncommitted work.
            So anything `git status` or a bare `git diff` reports is damage this
            job did to the tree during THIS run, never a defect in the PR.
            Reporting it as a finding is how this workflow produced three false
            `DO_NOT_MERGE` verdicts across #3009 and #3015: the finding names an
            "uncommitted revert" and prescribes `git restore <file>` —
            discarding a change nobody made. If you observe an uncommitted
            change, that is a bug in this review, so re-read the file at `HEAD`
            (`git show HEAD:<path>`) and judge THAT.

            ## Step 1 — four independent reviewers, in parallel

            Spawn all four in ONE message so they run concurrently, each with its
            dedicated subagent type:

            - `sv-ci-code-reviewer`     — correctness, threading (Filament JNI is
                                          main-thread only), resource hygiene, minimality
            - `sv-ci-security-reviewer` — secrets, deserialization, permission scope,
                                          supply chain, shell injection
            - `sv-ci-impact-reviewer`   — breaking public API, cross-platform divergence
            - `sv-ci-doc-freshness`     — llms.txt / KDoc / docs / recipes / skills /
                                          changelog fragment

            ⛔ USE THOSE FIVE TYPES AND NO OTHERS — the four above plus
            `sv-ci-finding-verifier` in step 2. They are the `sv-*` mandates
            wrapped in a toolset that CANNOT write: `Read`, `Glob`, `Grep`, no
            shell. That is what makes this review incapable of contaminating the
            tree it judges (#3016), and it is a property of those types alone. A
            general agent, or any other type, would come back with a shell and
            hand the hole straight back — so there is NO fallback here. If a type
            is not registered, that reviewer simply does not run: OMIT it from
            `perReviewer` and lower `reviewersRan`. A missing reviewer grades as
            REVIEW_INCOMPLETE, which is the correct, safe outcome. Under-reporting
            is safe; over-reporting is not.

            Give every reviewer the diff path `${{ runner.temp }}/pr.diff` in its
            prompt — it has no shell and cannot compute the diff itself. Its own
            definition already tells it the rest.

            ⛔ EVERY `Task` CALL MUST BE SYNCHRONOUS — pass
            `run_in_background: false` on all four, and on every verifier in
            step 2. Subagents default to the background, which works in an
            interactive session because a notification wakes the parent later.
            THIS RUN HAS NO LATER: it is headless, and the session ends the
            moment you end your turn. A backgrounded reviewer is simply killed,
            unread. Do not end your turn while any reviewer is outstanding, and
            never end it "waiting" for one — measured on run 30801646272, whose
            closing words were "Now waiting for the four reviewers to report":
            0 denials, 11 turns, no `review-verdict.json`, REVIEW_INCOMPLETE.
            Write the file yourself, from the reports, before you stop.

            ## Step 2 — adversarially verify every ERROR

            For each finding a reviewer marked as an error, spawn a SEPARATE
            `sv-ci-finding-verifier` — one per finding, never one for several —
            whose instruction is to REFUTE it: read the code at that location and
            establish that the finding is wrong. Give it the finding verbatim and
            the same diff path. Default to "not real" if it cannot be
            independently confirmed. Only errors that survive verification go
            into `confirmedErrors`. Warnings are not verified.

            ## Step 3 — write the verdict file

            You have no `Write` tool. Write the file with a shell heredoc, and
            quote the delimiter so nothing in it is expanded:

            ```bash
            cat > "${{ runner.temp }}/review-verdict.json" <<'JSON'
            { ... }
            JSON
            ```

            Then read it back once (`cat`) to confirm it is there and is valid
            JSON. If it is not, fix it and check again — a malformed or missing
            file grades as REVIEW_INCOMPLETE and blocks the PR.

            The content must be EXACTLY this shape:

            ```json
            {
              "reviewersExpected": 4,
              "reviewersRan": <how many actually reported>,
              "perReviewer": [
                {"reviewer": "code|security|impact|doc",
                 "verdict": "PASS|PASS_WITH_WARNINGS|FAIL",
                 "errorCount": <int>}
              ],
              "confirmedErrors": [
                {"reviewer": "code", "file": "path", "line": "42",
                 "problem": "...", "fix": "..."}
              ],
              "warnings": [
                {"reviewer": "doc", "file": "path", "line": "7", "problem": "...", "fix": "..."}
              ],
              "propagation": ["other platforms/docs this change must also reach"]
            }
            ```

            `reviewer` MUST be one of `code`, `security`, `impact`, `doc` — the
            grader keys the maintainer gate off `impact`, and the `sv-ci-` prefix
            on the agent types does not appear here. A clean PASS is a valid and
            expected outcome: do NOT invent findings to look thorough. Write the
            file even if everything passed.

            Your final message: one short paragraph stating what you found. The
            file is the deliverable.

      # ⛔ The reviewers must not have touched the tree. This is the backstop for
      # #3016, and it is deliberately an ASSERTION rather than a repair: silently
      # restoring the files would hide a reviewer that mutates the checkout, and
      # the mutation is the bug worth seeing.
      #
      # It has NO exclusions any more. It used to exempt `review-verdict.json`,
      # which the orchestrator wrote at the repo root; that file now lives under
      # RUNNER_TEMP with the diff, so nothing this job produces belongs in the
      # checkout and the invariant is the strongest one available: byte-identical
      # to HEAD, no carve-outs. An exempted path is a path a reviewer can hide in.
      #
      # The net stays even though the reviewers are now structurally incapable of
      # writing (no shell, no write tool — see the toolset assertion above). It
      # covers what that guarantee does not: the orchestrator, which still holds
      # `Bash` because it needs git, and any future widening of the toolsets. A
      # net is not removed because the hole it was strung under looks plugged.
      #
      # The failure mode this catches is specific and was measured three times
      # (#3009, #3015): a reviewer edits or reverts a file, the orchestrator
      # reads the dirty tree, and the edit is reported as a confirmed error
      # against the PR. A false blocker costs a re-run; worse, it teaches us to
      # dismiss this reviewer, which is exactly how a REAL finding gets waved
      # through — on #3009 one of the three findings was genuine (a wrong
      # VERSION_NAME that would have published an immutable bad Maven
      # coordinate) and nearly drowned in the two false ones.
      #
      # `if: always()` so a fan-out that died mid-way still reports what it left
      # behind. It runs BEFORE the grader, so a poisoned tree fails the job on
      # its own terms instead of being laundered into a verdict.
      - name: Assert the reviewers left the tree clean
        if: always() && steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        run: |
          set -uo pipefail
          # A FAILED `git status` is not a clean tree. Assigning it straight into
          # DIRT made this step fail-OPEN: a non-zero exit leaves the variable
          # empty and the assertion then announces a pristine checkout it never
          # managed to look at. Reproduced outside a repository: git printed
          # "fatal: not a git repository" and the step still said "Working tree
          # clean". Same class as "absent is not zero", which this workflow
          # already learned the hard way for `permission_denials_count` below.
          if ! DIRT="$(git status --porcelain)"; then
            echo "::error title=Clean-tree assertion could not run::git status failed in ${PWD}, so this run proves nothing about the checkout. Absent is not clean — treating it as contaminated."
            exit 1
          fi
          if [ -z "$DIRT" ]; then
            echo "Working tree clean — the review did not mutate the checkout."
            exit 0
          fi
          echo "$DIRT"
          echo "::error title=Review contaminated its own checkout::This job modified the working tree during the run (see the paths above). CI checks out a clean tree and the review writes everything under RUNNER_TEMP, so every one of those changes was made here — any finding derived from them is false. This is #3016. Re-run the review; do not act on its verdict."
          exit 1

      # A blocking verdict must name its own cause. On run 30719225423 the PR
      # got a red check reading "REVIEW_INCOMPLETE" and nothing else — correct,
      # and useless: the actual reason (30 refused tool calls) was buried in the
      # action's JSON log, and the obvious reading, "a reviewer crashed", was
      # wrong. This step reads the run record the action leaves behind and says
      # what happened, BEFORE the grader turns it into a one-word verdict.
      # `if: always()` so it also speaks when the fan-out itself failed.
      - name: Diagnose a missing verdict file
        id: diag
        if: always() && steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        run: |
          set -uo pipefail
          VERDICT_FILE="${RUNNER_TEMP}/review-verdict.json"
          # An output rather than `hashFiles()` downstream: the verdict lives
          # outside the workspace now, and `hashFiles()` only ever globs inside
          # it — it would have returned "absent" for every run, uploading the run
          # record on healthy reviews too.
          if [ -s "$VERDICT_FILE" ]; then
            echo "verdict_present=true" >> "$GITHUB_OUTPUT"
            echo "review-verdict.json written ($(wc -c < "$VERDICT_FILE") bytes)."
            exit 0
          fi
          echo "verdict_present=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=No review-verdict.json::The reviewers produced no verdict file at ${VERDICT_FILE}. Diagnosing before the grader reports REVIEW_INCOMPLETE."
          LOG="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Fan-out left no run record::${LOG} is absent — the action did not get far enough to write one. Check the step above for a startup failure (bad model id, expired token, action version)."
            exit 0
          fi
          # ⛔ ABSENT IS NOT ZERO. The previous version ended in
          # `| max // 0`, so a scan that found the field NOWHERE returned the
          # same `0` as a run with genuinely no denials — and printed the
          # reassuring branch. Measured on run 30800040485: the step announced
          # "0 denials" while the action's own summary said 13. This step exists
          # to prevent exactly that, and it produced it. Absence now reports
          # `unknown` and says so out loud.
          #
          # `grep` rather than a jq path, because the record's shape is not a
          # promise: it has already been observed as a list of messages and as a
          # single object, and the jq scan that was supposed to cover both still
          # missed the field. A regex over the raw bytes does not care.
          DENIALS="$(grep -o '"permission_denials_count"[[:space:]]*:[[:space:]]*[0-9]\+' "$LOG" 2>/dev/null \
                      | grep -o '[0-9]\+$' | sort -rn | head -1)"
          [ -n "$DENIALS" ] || DENIALS=unknown
          echo "Permission denials reported by the fan-out: $DENIALS"
          # The COUNT alone is what made this workflow's first diagnosis wrong:
          # it went 7 → 10 across a "fix" and said nothing about WHICH tool was
          # refused, so the next guess was as blind as the last. Name them.
          # Denial messages only — bounded to 20 × 300 chars, no diff and no
          # transcript, so a public log never becomes an exfiltration surface.
          python3 - "$LOG" <<'PY' || true
          import json, re, sys
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as exc:
              print(f"(could not parse the run record: {exc})")
              sys.exit(0)
          pat = re.compile(r"haven't granted|requested permissions|not allowed|permission denied", re.I)
          hits, seen = [], set()
          def walk(node):
              if isinstance(node, dict):
                  for v in node.values(): walk(v)
              elif isinstance(node, list):
                  for v in node: walk(v)
              elif isinstance(node, str) and pat.search(node):
                  s = node.strip()[:300]
                  if s not in seen:
                      seen.add(s); hits.append(s)
          walk(data)
          if not hits:
              print("No denial message matched in the run record.")
          for h in hits[:20]:
              print(f"  denied: {h}")
          if len(hits) > 20:
              print(f"  … +{len(hits) - 20} more (truncated)")

          # Zero denials and no file is the OTHER failure, and it needs its own
          # evidence: on run 30800617868 the fan-out reported 0 denials, ran 11
          # turns in 60s — far too few for four reviewers — and wrote nothing.
          # The count cannot explain that; the orchestrator's own closing words
          # can. Print the final assistant text, which the prompt requires to be
          # one short paragraph about what it found, so a run that gave up says
          # why instead of leaving the next reader to guess again.
          finals = []
          def texts(node):
              if isinstance(node, dict):
                  if node.get("type") == "assistant":
                      for blk in (node.get("message") or {}).get("content") or []:
                          if isinstance(blk, dict) and blk.get("type") == "text":
                              finals.append(blk.get("text") or "")
                  for v in node.values(): texts(v)
              elif isinstance(node, list):
                  for v in node: texts(v)
          texts(data)
          finals = [t.strip() for t in finals if t.strip()]
          print()
          if finals:
              print("Orchestrator's closing message:")
              print("  " + finals[-1][:1500].replace("\n", "\n  "))
          else:
              print("The run record carries no assistant text — the orchestrator never spoke.")
          PY

          # THREE branches, not two. `unknown` must never fall through to the
          # "they ran fine" message — that fall-through is what printed
          # "0 denials" on run 30800040485 while the action reported 13.
          if [ "$DENIALS" = "unknown" ]; then
            echo "::error title=Denial count unreadable::No permission_denials_count found in ${LOG}. NOT the same as zero — the run record's shape changed, or the action wrote no summary. Read the denial messages above before concluding anything about the reviewers."
          elif [ "$DENIALS" -gt 0 ]; then
            echo "::error title=Reviewers were denied their tools::${DENIALS} tool call(s) refused, so the fan-out could not run and no verdict file exists. This is a CONFIGURATION failure, not a finding about the PR — the denied tools are named above."
          else
            echo "::error title=Reviewers ran but wrote nothing::Zero denials and still no verdict file — the orchestrator ended its turn without writing it. Read the fan-out step's log; this is not an allowlist problem."
          fi

      # #2971's description promised this upload; its diff did not contain it,
      # and the claim reached the merge commit. Implementing it is the honest
      # way to settle that, and the argument it was merged on holds: the run
      # record is the only place the refused tool NAMES and the full turn
      # sequence live, the step above can only ever print a bounded excerpt of
      # it, and the file dies with the runner. Four of this workflow's five
      # debugging rounds turned on a fact visible only inside it.
      #
      # Uploaded ONLY when no verdict file was produced — a healthy review has
      # nothing to explain, and the record carries the whole reviewer
      # conversation, so it is not something to publish by default.
      - name: Upload the run record when the review produced nothing
        if: always() && steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false' && steps.diag.outputs.verdict_present == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: claude-run-record-pr${{ steps.pr.outputs.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 7
          if-no-files-found: warn

      - name: Grade the review
        id: grade
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # `set +e` is REQUIRED and not redundant: GitHub invokes run: steps as
          # `/usr/bin/bash -e {0}`, so errexit is on before the first line and a
          # `set -uo pipefail` does NOT clear it. Measured on run 30714065868 —
          # the grader returned 1 on a blocking verdict and the step died right
          # there, so the outputs were never written, the comment was never
          # posted, and the PR showed a red check with no explanation on it.
          # A blocking verdict is an expected non-zero we must capture, render,
          # and only then fail on (in the `Enforce the verdict` step).
          set +e
          set -uo pipefail
          # ⛔ THE JUDGE MUST NOT COME FROM THE CODE BEING JUDGED.
          #   `$GRADER` is fetched from the default branch, never read out of the
          #   checkout. Two distinct reasons, and the second is the serious one:
          #   1. The checkout is the PR's tree. A PR branched before this script
          #      existed simply does not contain it — measured on run
          #      30764492028, a dispatch on #2962: `No such file or directory`,
          #      and the whole review died at the last step after the reviewers
          #      had already been paid for.
          #   2. A PR that EDITS `grade-pr-review.sh` would otherwise have its
          #      own verdict computed by its own version of the grader. That is
          #      the `pull_request_target` footgun wearing different clothes:
          #      the generator≠evaluator split is worth nothing if the generator
          #      can rewrite the evaluator. Pinning to the default branch means
          #      a PR improving the grader is graded by the CURRENT grader —
          #      which is the correct semantics anyway.
          #   The self-modification guard covers pr-review.yml only, so it does
          #   NOT cover this file; this pin is what closes that gap.
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          GRADER="$RUNNER_TEMP/grade-pr-review.sh"
          git fetch origin "$DEFAULT_BRANCH" --depth=1 --quiet 2>/dev/null
          if ! git show "origin/$DEFAULT_BRANCH:.claude/scripts/grade-pr-review.sh" > "$GRADER" 2>/dev/null; then
            echo "::error title=Grader unavailable::Could not read .claude/scripts/grade-pr-review.sh from origin/$DEFAULT_BRANCH. Refusing to grade with whatever copy the PR happens to carry."
            echo "gate_rc=1" >> "$GITHUB_OUTPUT"
            echo "verdict=REVIEW_INCOMPLETE" >> "$GITHUB_OUTPUT"
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            # The downstream steps read this file unconditionally; write the
            # explanation rather than letting them fail on a missing path and
            # leave the PR with an unexplained red check again.
            {
              echo '<!-- sceneview-agent-review -->'
              echo '## ⛔ Agent review incomplete — the grader could not be loaded'
              echo
              echo "The merge verdict is computed by \`.claude/scripts/grade-pr-review.sh\`"
              echo "read from \`$DEFAULT_BRANCH\`, never from this PR's tree — a PR must not"
              echo 'be able to supply the script that grades it. That read failed here, so'
              echo 'no verdict was computed and none is implied.'
              echo
              echo '**This is a CI configuration problem, not a finding about this PR.**'
            } > review-comment.md
            exit 0
          fi
          # The verdict is read from RUNNER_TEMP, never from the checkout: the
          # tree must stay byte-identical to HEAD for the contamination
          # assertion above to mean anything (#3016). `review-comment.md` and
          # `grade.out` are still written here — this step runs after that
          # assertion, and they are the grader's output, not the agents'.
          bash "$GRADER" "$RUNNER_TEMP/review-verdict.json" \
            --comment-out review-comment.md --pr "$PR_NUM" > grade.out
          echo "gate_rc=$?" >> "$GITHUB_OUTPUT"
          cat grade.out >> "$GITHUB_OUTPUT"
          {
            echo '## Agent review verdict'
            echo
            cat review-comment.md
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, updated in place — a marker in the body keys the
      # lookup, so a 20-commit PR does not accumulate 20 review comments.
      - name: Post or update the review comment
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- sceneview-agent-review -->'
          EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUM/comments" --paginate \
            --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty" 2>/dev/null || echo "")"
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" \
              -F body=@review-comment.md >/dev/null
            echo "::notice::Updated agent-review comment $EXISTING on PR #$PR_NUM"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUM/comments" \
              -F body=@review-comment.md >/dev/null
            echo "::notice::Posted agent-review comment on PR #$PR_NUM"
          fi

      - name: Enforce the verdict
        if: steps.budget.outputs.within_budget == 'true' && steps.creds.outputs.has_token == 'true' && steps.selfmod.outputs.self_modified == 'false'
        env:
          VERDICT: ${{ steps.grade.outputs.verdict }}
          BLOCKING: ${{ steps.grade.outputs.blocking }}
          BREAKING: ${{ steps.grade.outputs.breaking_api }}
        run: |
          set -euo pipefail
          echo "Verdict: ${VERDICT:-<none>} (blocking=${BLOCKING:-<none>})"
          if [ "${BREAKING:-false}" = "true" ]; then
            echo "::error title=Breaking public-API change::The impact reviewer's finding survived adversarial verification. This is the maintainer gate — convert to draft and stop."
          fi
          if [ "${BLOCKING:-true}" != "false" ]; then
            echo "::error title=Agent review blocked this PR::${VERDICT:-REVIEW_INCOMPLETE} — see the review comment on the PR."
            exit 1
          fi
