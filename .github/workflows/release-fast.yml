# release-fast.yml — one-click release checkpoint (M7c, follow-up of #2596/M7b).
#
# Replaces the local-machine release recipe with a dispatchable pipeline:
#
#   dispatch(version) ─▶ web device-QA gate (BLOCKING) ─▶ bump via the now-complete
#   sync-versions.sh --fix (M7b, 0 residuals) ─▶ changelog collate ─▶ release PR
#   with auto-merge ─▶ explicit `gh workflow run ci.yml --ref release/vX.Y.Z` to
#   start that PR's required checks ─▶ this workflow's own `tag` job waits for the
#   PR to merge, tags the merge commit and dispatches release.yml on the tag ref.
#
# WHY PR-then-tag and not a direct push: main is protected by required status
# checks (ci.yml job names) with no push restrictions but no GITHUB_TOKEN
# bypass — a workflow cannot push the bump commit directly (only human admins
# can, which is exactly what the manual recipe did). The PR path keeps the
# required checks honest AND gives the bump diff a reviewable surface for free.
#
# WHY THIS WORKFLOW DRIVES EVERY STEP ITSELF (#3358, #3664): GitHub emits NO
# workflow events for anything done with the default `GITHUB_TOKEN`. That bites
# THREE times on this pipeline, in pipeline order:
#
#   * the release BRANCH PUSH and the PR opened on it are GITHUB_TOKEN work.
#     #3664 read that as "no `pull_request` event". The run history says
#     otherwise (#3750): every release PR since at least 4.37.0 DID get its ten
#     `pull_request` runs, but born `action_required` — awaiting an "Approve
#     and run" — with zero check runs, so the PR looks check-less. The
#     repository's fork-PR approval policy is `all_external_contributors`
#     (GET repos/sceneview/sceneview/actions/permissions/fork-pr-contributor-approval),
#     and `github-actions[bot]` is not a collaborator. While those suites wait,
#     the dispatched CI below does NOT unblock the merge: on 4.38.0 it was green
#     at 23:46 and the PR stayed BLOCKED until its runs were approved at 02:34.
#     4.38.0 through 4.43.0 all needed a human (an approval, or an empty commit
#     pushed with personal credentials). The `tag` job now approves the runs of
#     its own bump commit, and fails in minutes, with the unblock commands, when
#     it cannot;
#   * the auto-MERGE of the release PR is performed with GITHUB_TOKEN, so the
#     resulting push to main fires no `push` event — a companion workflow keyed
#     on `on: push: branches: [main]` never runs. This is exactly how v4.33.0
#     shipped a bumped-but-untagged main with nothing red anywhere (#3358);
#   * the TAG this pipeline pushes is likewise GITHUB_TOKEN-made, so release.yml's
#     `on: push: tags:` trigger would not fire either.
#
# The fixes: approve the release PR's own gated runs (first bullet, `tag` job),
# and stop depending on the event chain for the other two by asking for the run
# explicitly, because `workflow_dispatch` through the API is the one trigger
# GITHUB_TOKEN CAN start. The `gh workflow run ci.yml --ref release/vX.Y.Z` in
# the checkpoint job stays as an early red signal only. The `tag` job below, which
# belongs to THIS run, waits for the PR it just opened to merge, and tags the
# merge commit directly — if the merge never happens, that job fails red instead
# of the release evaporating in silence. The tag push is covered by `gh workflow
# run release.yml --ref v$V` (release.yml already accepts workflow_dispatch,
# which is equivalent to the tag-push path).
#
# RECOVERY when the `tag` job went red but the release PR is still open: unblock
# the PR (approve its runs or push an empty commit with your own credentials),
# then `gh run rerun <this run id> --failed` — only the `tag` job re-runs, with
# the checkpoint's outputs, and resumes the wait. When the PR has ALREADY merged:
# `gh workflow run tag-release.yml -f commit=<merge commit sha>` (the auto-merge
# is GITHUB_TOKEN work, so tag-release.yml's own `push` trigger never fires).
#
# A PAT/App token for the merge was the other candidate. Rejected: it makes the
# release depend on a credential that expires silently and fails back into the
# exact same invisible half-release, and it widens the blast radius of the one
# job allowed to write to main. Owning the tag in-run needs no secret at all.
#
# tag-release.yml survives as a safety net for the human-merge path (a human
# merge IS a real push event) and as a manual `workflow_dispatch` recovery
# handle. Both callers share `.claude/scripts/tag-release.sh`, which is
# idempotent — whoever tags first wins, the other exits 0.
name: Release fast

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z — major 4 is frozen, minor bumps only)"
        required: true
      skip_web_qa:
        description: "Skip the BLOCKING web device-QA leg (emergencies only)"
        type: boolean
        default: false

# One release pipeline at a time — same guard family as release.yml.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  checkpoint:
    name: QA gate + bump PR (${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level permissions REPLACE the workflow-level block, so restate the two
    # it already had. `actions: write` is the new one: the step below dispatches
    # ci.yml on the release branch to start the PR's required checks (#3664).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      branch: ${{ steps.open_pr.outputs.branch }}
      # The bump commit this job pushed — the ONLY head whose approval-gated
      # runs the `tag` job is allowed to approve (#3750).
      sha: ${{ steps.open_pr.outputs.sha }}
    # Shell-injection hardening: the version input reaches shell ONLY via this
    # env var (never ${{ }} inside run: bodies) — env interpolation is inert,
    # and the regex validation below rejects anything but 4.x.y anyway.
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version input
        run: |
          V="$RELEASE_VERSION"
          echo "$V" | grep -qE '^4\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be 4.x.y (major 4 frozen, no pre-releases here)"; exit 1; }
          git rev-parse "v$V" >/dev/null 2>&1 \
            && { echo "::error::tag v$V already exists"; exit 1; }
          CURRENT=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          [ "$CURRENT" = "$V" ] && { echo "::error::VERSION_NAME already $V"; exit 1; }
          echo "Releasing $CURRENT -> $V"

      # A patch tag must not carry a breaking change (#3037). `collate-changelog.sh`
      # runs this same guard and cannot be bypassed, but it runs 40 minutes from
      # now — after the web QA leg and the bump commit. Failing here instead costs
      # seconds and points at the fragment, not at a half-built release branch.
      - name: Breaking-change / patch-bump guard
        run: bash .claude/scripts/check-breaking-change-bump.sh "$RELEASE_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web device-QA gate (BLOCKING)
        if: ${{ !inputs.skip_web_qa }}
        run: |
          bash .claude/scripts/device-qa.sh --platform=web
          VERDICT=$(python3 -c "import json; print(json.load(open('device-qa-report.json'))['releaseGate']['verdict'])")
          echo "releaseGate.verdict = $VERDICT"
          [ "$VERDICT" = "blocked" ] && { echo "::error::web leg BLOCKED — a demo breaks for real users, not tagging"; exit 1; }
          # Keep the working tree clean for the bump commit.
          git checkout -- . || true
          git clean -fd device-qa-artifacts 2>/dev/null || true

      - name: Bump + verify 0 mismatch
        run: |
          V="$RELEASE_VERSION"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$V/" gradle.properties
          # `|| true` is load-bearing: sync-versions.sh --fix EXITS 1 by contract
          # whenever it had mismatches to fix ("1 = mismatches found (or fixed if
          # --fix)"), because $ERRORS is the pre-fix count and is never recomputed
          # after fixing. This step's shell is `bash -e`, so an unguarded --fix
          # aborted the whole step the instant it returned 1 — BEFORE the verify
          # pass below ever ran (issue #2619). The writes did persist; only the
          # premature set -e exit made CI look like a coverage regression.
          bash .claude/scripts/sync-versions.sh --fix || true
          # M7b made --fix complete; the verify pass below is the real gate.
          OUT=$(bash .claude/scripts/sync-versions.sh || true)
          echo "$OUT" | tail -5
          echo "$OUT" | grep -q "Errors (MISMATCH): 0" \
            || { echo "::error::residual version mismatches — sync-versions coverage regressed"; exit 1; }

      - name: Collate changelog
        run: bash .claude/scripts/collate-changelog.sh "$RELEASE_VERSION"

      - name: Open release PR (auto-merge)
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$RELEASE_VERSION"
          BRANCH="release/v$V"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Version/changelog surfaces only — never QA artifacts. Stage everything, then
          # unstage the artifacts: an exclude pathspec makes `git add` treat a gitignored
          # match as explicitly named and EXIT 1 ("paths are ignored by .gitignore"). Only
          # device-qa-report.json is gitignored today (.gitignore:317) — one is enough, and
          # under `bash -e` it killed the whole release right after the changelog collate.
          git add -A
          git reset -q -- device-qa-report.json device-qa-artifacts ar-qa-summary.json web-qa-summary.json
          git commit -m "release: $V — version bump + changelog collate" \
            -m "Automated by release-fast.yml (web QA verdict gated, sync-versions 0 mismatch). Merging this PR tags v$V from the same release-fast run, which dispatches release.yml on the tag."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin "$BRANCH"
          gh pr create --title "release: $V — version bump + changelog collate" \
            --body "One-click release pipeline (release-fast.yml). Web device-QA gate passed (or explicitly skipped: \`${{ inputs.skip_web_qa }}\`); sync-versions 0 mismatch; changelog collated. **Merging this PR tags \`v$V\`** (the \`tag\` job of this same release-fast run) and launches release.yml." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --auto

      # ── Early CI signal on the release branch (#3664, corrected by #3750) ──
      # #3664 added this dispatch believing the release PR got no
      # `pull_request` runs and that a green dispatched CI on the head SHA
      # would satisfy branch protection. Neither held: the PR's `pull_request`
      # runs exist but are born `action_required`, and while they wait the
      # dispatched suite does not unblock the merge (4.38.0: dispatch green at
      # 23:46, PR BLOCKED until the runs were approved at 02:34). What merges
      # the PR is the `tag` job approving those runs. This dispatch is kept
      # because it reds a broken bump within ~10 minutes of the PR opening,
      # independently of the approval gate (4.43.0: "Unit tests" failed here
      # while the PR's own runs were still awaiting approval).
      - name: Start CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.open_pr.outputs.branch }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH" -f force-all=true

          # Confirm the run actually exists. A dispatch that silently no-ops
          # would reproduce #3664 exactly — a PR with no checks, discovered
          # 170 minutes later by the `tag` job's timeout. Fail here instead,
          # while the branch and the PR are the only things that exist yet.
          for _ in $(seq 1 12); do
            sleep 10
            COUNT=$(gh run list --workflow=ci.yml --branch "$BRANCH" \
              --event workflow_dispatch --json databaseId -q 'length' || echo 0)
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "CI started on $BRANCH ($COUNT run(s))."
              exit 0
            fi
          done
          echo "::error::'gh workflow run ci.yml --ref $BRANCH' produced no run after 2 min — the release branch has no early CI signal. Start CI on that branch by hand: gh workflow run ci.yml --ref $BRANCH -f force-all=true"
          exit 1

  # The release is NOT done when the PR is open — it is done when the tag exists.
  # This job owns that gap end to end (#3358): it waits for its own PR to merge
  # and tags the merge commit, instead of handing off to a `push`-triggered
  # workflow that a GITHUB_TOKEN auto-merge never wakes up.
  tag:
    name: Await merge + tag v${{ inputs.version }}
    needs: checkpoint
    runs-on: ubuntu-latest
    # Long by design: this spans the release PR's full required-check suite.
    # Timing out is the POINT of the job — a release PR that never merges must
    # end in a red run, which is precisely what #3358 lacked.
    timeout-minutes: 180
    # Job-level permissions REPLACE the workflow-level block, so restate what is
    # needed: `contents` to push the tag, `actions` to dispatch release.yml and
    # to approve the release PR's approval-gated runs (#3750).
    permissions:
      contents: write
      actions: write
      pull-requests: read
    env:
      RELEASE_BRANCH: ${{ needs.checkpoint.outputs.branch }}
      BOT_SHA: ${{ needs.checkpoint.outputs.sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # ── The approval gate (#3750) ─────────────────────────────────────────
      # The release PR's `pull_request` runs are born `action_required` (the
      # repo's fork-PR approval policy treats github-actions[bot] as an external
      # contributor), and that state never resolves by itself: 4.38.0 to 4.43.0
      # each sat BLOCKED until a human approved the runs or pushed an empty
      # commit. So, on every poll, list the PR head's runs awaiting approval:
      #   * head == the bump commit the checkpoint job pushed → approve them
      #     (POST actions/runs/{id}/approve, `actions: write`). Never any other
      #     head: a commit this run did not write is not this run's to approve;
      #   * the approval call is refused, or runs are still waiting ~5 min after
      #     it → fail NOW with the unblock commands, instead of timing out 170
      #     minutes later with no reason.
      - name: Wait for the release PR to merge
        id: wait
        run: |
          REPO="$GITHUB_REPOSITORY"
          RUN_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"

          # Named failure for a PR stuck behind "Approve and run": the error
          # annotation plus the exact commands, echoed to the log and the run
          # summary so whoever opens the red run can unblock it in one paste.
          stuck() {
            echo "::error::release PR $RELEASE_BRANCH is stuck: its pull_request runs on ${HEAD:0:9} await 'Approve and run' (action_required, #3750) — $1. Unblock commands in the run summary: $RUN_URL"
            {
              echo "### Release PR $RELEASE_BRANCH is waiting for a run approval (#3750)"
              echo
              echo "Reason: $1"
              echo
              echo '1. Unblock the PR — approve its runs:'
              echo '```'
              for id in $PENDING; do echo "gh api -X POST repos/$REPO/actions/runs/$id/approve"; done
              echo '```'
              echo "   or push an empty commit to \`$RELEASE_BRANCH\` with your own credentials."
              echo "2. Resume the tag (this job only, the checkpoint is not redone):"
              echo '```'
              echo "gh run rerun $GITHUB_RUN_ID --failed -R $REPO"
              echo '```'
              echo "3. If the PR has already merged by then, tag it instead:"
              echo '```'
              echo "gh workflow run tag-release.yml -R $REPO -f commit=<merge commit sha>"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          APPROVED=" "
          GATED_POLLS=0
          # 340 × 30 s ≈ 170 min, inside the 180-min job timeout so the wait
          # ends with a named error rather than an opaque cancellation.
          for _ in $(seq 1 340); do
            # A transient API blip must cost one poll, not the whole release:
            # `|| true` keeps `bash -e` from killing the wait, and an empty
            # answer simply falls through to the next iteration.
            STATUS=$(gh pr view "$RELEASE_BRANCH" --json state,mergeCommit,headRefOid \
              -q '[.state, (.mergeCommit.oid // "-"), .headRefOid] | join(" ")' || true)
            read -r STATE OID HEAD <<< "$STATUS" || true
            [ "$OID" = "-" ] && OID=""

            PENDING=""
            if [ "$STATE" = "OPEN" ] && [ -n "$HEAD" ]; then
              PENDING=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD&event=pull_request&per_page=100" \
                -q '[.workflow_runs[] | select(.conclusion == "action_required") | .id] | join(" ")' || true)
            fi
            if [ -n "$PENDING" ]; then
              [ "$HEAD" = "$BOT_SHA" ] \
                || stuck "the head is not the bump commit this run pushed (${BOT_SHA:0:9}), so this run will not approve it"
              for id in $PENDING; do
                case "$APPROVED" in *" $id "*) continue ;; esac
                if gh api -X POST "repos/$REPO/actions/runs/$id/approve" >/dev/null \
                  || { sleep 5; gh api -X POST "repos/$REPO/actions/runs/$id/approve" >/dev/null; }; then
                  echo "Approved pull_request run $id on the bump commit."
                  APPROVED="$APPROVED$id "
                else
                  stuck "GITHUB_TOKEN could not approve run $id (see the API error above)"
                fi
              done
              GATED_POLLS=$((GATED_POLLS + 1))
              [ "$GATED_POLLS" -lt 10 ] \
                || stuck "runs are still awaiting approval ~5 min after this job approved them"
            else
              GATED_POLLS=0
            fi

            case "$STATE" in
              MERGED)
                # Never fall back to "HEAD" on a blank oid: HEAD here is still
                # the PRE-merge main this job checked out, and tagging that
                # would tag the wrong commit.
                [ -n "$OID" ] || { echo "::error::PR reports MERGED with no merge commit oid"; exit 1; }
                echo "PR merged as $OID."
                echo "oid=$OID" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              CLOSED)
                echo "::error::release PR $RELEASE_BRANCH was closed without merging — no tag, no release"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::release PR $RELEASE_BRANCH still not merged after ~170 min — check its required checks. While it is open: fix them, then gh run rerun $GITHUB_RUN_ID --failed. Once it has merged: gh workflow run tag-release.yml -f commit=<merge commit sha>"
          exit 1

      # Same hardening rule as the checkpoint job: the commit id reaches the
      # shell through an env var only, never `${{ }}` inside a `run:` body.
      - name: Tag the merge commit and dispatch release.yml
        env:
          MERGE_OID: ${{ steps.wait.outputs.oid }}
        run: |
          git fetch --tags origin main
          bash .claude/scripts/tag-release.sh "$MERGE_OID"
