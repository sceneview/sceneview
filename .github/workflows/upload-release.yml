name: Publish release to Maven Central

# A final 2.x tag (v2.3.4, never v2.3.4-rc1) publishes. No manual run: nothing but a tag whose
# name is the version in the tree can reach Maven Central.
on:
  push:
    tags:
      - 'v2.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Release build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Tag matches the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for module in sceneview arsceneview; do
            version="$(sed -n 's/^VERSION_NAME=//p' "$module/gradle.properties")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$module is at $version, the tag says $tag"
              exit 1
            fi
          done

      # Central Portal: uploads, signs and releases in one step. Not reversible.
      - name: Publish release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-parallel --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
