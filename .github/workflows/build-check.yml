name: Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build library
        run: ./gradlew assembleDebug --stacktrace

      # What a release tag runs, short of the upload: release variant, sources and Dokka jars,
      # POM, signature. Fork pull requests have no signing key and skip it.
      - name: Rehearse the release publication (Maven local, signed)
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          ./gradlew publishToMavenLocal --no-daemon --no-parallel --no-configuration-cache
          find ~/.m2/repository/io/github/sceneview -type f | sort
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}