name: React Native iOS bridge compile

# Compile-checks the React Native module's iOS Swift bridge against the REAL
# `SceneViewSwift` public API **and the REAL React Native Objective-C API**.
#
# WHY THIS EXISTS (#2067)
# -----------------------
# `react-native/react-native-sceneview/ios/SceneViewModule.swift` shipped for
# months referencing `SceneViewSwift` APIs that do not exist (`ModelNode(String)`,
# an `ARSceneView { anchor in … }` trailing-closure content builder, an
# `override`n `requiresMainQueueSetup` on a plain `NSObject`). No CI job ever
# compiled the RN module's iOS target, so the breakage went unnoticed and the
# bridge's iOS support was non-functional. This workflow closes that gap.
#
# WHY A TYPE-CHECK, NOT A FULL APP BUILD
# --------------------------------------
# `SceneViewSwift` is distributed via Swift Package Manager ONLY — there is no
# published CocoaPods spec — so the demo's `pod install` cannot resolve it and
# the module's podspec cannot declare it as a `s.dependency`. A host app adds
# it once through Xcode's SwiftPM integration. Building the demo app end-to-end
# would therefore require scaffolding that SwiftPM wiring into a generated
# `.xcodeproj`; a `swiftc -typecheck` against a freshly built `.swiftmodule`
# catches the #2067 defect class without it.
#
# WHY THE REACT MODULE IS REAL, NOT A STUB
# ----------------------------------------
# The bridge does `import React`, so the type-check needs a React module. This
# job used to synthesise a hand-written Swift shim redeclaring the four React
# symbols the bridge touches. That shim was a liability: it could drift from
# the real React API without anything noticing, and — measured — it is strictly
# poorer than the real thing (a probe using `RCTEventEmitter`, `RCTConvert` and
# `RCTBridge` type-checks clean against real React and produces 8 errors
# against the shim). A guard whose reference API is hand-maintained tests the
# hand-maintenance, not the bridge.
#
# So the React module is now the REAL one: `npm ci` + `pod install` on
# `samples/react-native-demo` produces CocoaPods' own generated
# `React-Core.modulemap` (`module React { umbrella header
# "React-Core-umbrella.h" … }`) over React Native's real headers, and the
# type-check imports that. Nothing about React's API surface is authored here.
#
# Running the demo's `pod install` also validates the module's podspec on every
# run — that is not incidental. Two real integration defects surfaced the first
# time it ran: `s.homepage` was fed `package["repository"]` (an object, which
# CocoaPods rejects outright) and `s.platforms` claimed iOS 17.0 while
# `SceneViewSwift/Package.swift` requires iOS 18.0.
#
# THE TWO NEGATIVE CONTROLS
# -------------------------
# A type-check that silently resolved neither module would pass vacuously and
# this workflow would be prose. Both imports are therefore proven load-bearing
# on every run, before the real check: the same `swiftc` command is re-run once
# without `-I <SceneViewSwift>` and once without the React modulemap, and each
# MUST fail with `no such module`. If either negative control passes, the job
# fails — the guard refuses to report green on a check it cannot perform.
#
# MEASURED, NOT ASSUMED
# ---------------------
# Verified locally (Xcode 26.3, RN 0.73.11, CocoaPods 1.17.0) by mutating the
# TRACKED bridge file and running this job's type-check step verbatim. It goes
# red on every mutation, and in each case BOTH negative controls still passed
# first — so the red came from the real check, not from a broken setup:
#   * `try await ModelNode.load(path)` → `ModelNode(path)` (the exact #2067
#     regression)                                             → 4 errors
#   * `.cameraControls(_:)` → `.cameraControlsRenamed(_:)`    → 2 errors
#   * `AnchorNode.world(position:)` → `.worldRenamed(…)`      → 4 errors
#   * `: RCTViewManager` → `: RCTViewManagerRenamed`          → 16 errors
# and green (0 errors) on the unmutated file. The negative controls were
# mutation-tested too: replacing the bridge with a file that imports neither
# module makes the step exit 1 with "this guard is vacuous" instead of
# reporting a green type-check of nothing.
#
# LIMITATION (documented honestly)
# --------------------------------
# A type-check does not link, does not run, and does not exercise the Obj-C
# `RCT_EXTERN_MODULE` registration glue in `ios/RNSceneViewManager.m` — a
# property exported there but absent from the Swift class still passes here.
# What it does guarantee is that the bridge's Swift compiles against the real
# SceneViewSwift API and the real React API, which is the #2067 defect class.

on:
  push:
    branches: [main]
    paths:
      - 'react-native/react-native-sceneview/ios/**'
      - 'react-native/react-native-sceneview/react-native-sceneview.podspec'
      - 'react-native/react-native-sceneview/package.json'
      - 'react-native/react-native-sceneview/package-lock.json'
      # The React module the type-check imports is produced from the demo's
      # dependency graph, so the demo's manifests are inputs to this guard.
      - 'samples/react-native-demo/package.json'
      - 'samples/react-native-demo/package-lock.json'
      - 'samples/react-native-demo/ios/Podfile'
      - 'samples/react-native-demo/ios/Podfile.lock'
      - 'SceneViewSwift/**'
      - '.github/workflows/rn-ios-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'react-native/react-native-sceneview/ios/**'
      - 'react-native/react-native-sceneview/react-native-sceneview.podspec'
      - 'react-native/react-native-sceneview/package.json'
      - 'react-native/react-native-sceneview/package-lock.json'
      - 'samples/react-native-demo/package.json'
      - 'samples/react-native-demo/package-lock.json'
      - 'samples/react-native-demo/ios/Podfile'
      - 'samples/react-native-demo/ios/Podfile.lock'
      - 'SceneViewSwift/**'
      - '.github/workflows/rn-ios-compile.yml'
  workflow_dispatch:

concurrency:
  group: rn-ios-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile RN iOS bridge against SceneViewSwift + React
    # Deliberately NOT opted in to the self-hosted `sceneview-mac` runner: this
    # job runs `npm ci` and `pod install`, which write into shared per-user
    # caches (`~/.npm`, `~/Library/Caches/CocoaPods`). Keep it on a disposable
    # hosted runner. See CLAUDE.md → self-hosted runner skill.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # DEVELOPER_DIR (Apple-canonical) instead of `sudo xcode-select -s`:
        # the sudo form needs NOPASSWD in /etc/sudoers, which hosted runners
        # provide but self-hosted macOS runners do not. Same pattern as
        # bridge-ios-compile.yml — kept identical so the two stay in step.
        run: |
          for cand in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode.app; do
            if [ -d "$cand" ]; then
              echo "DEVELOPER_DIR=$cand/Contents/Developer" >> "$GITHUB_ENV"
              echo "Using Xcode: $cand"
              "$cand/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done
          echo "::error::No Xcode installation found in /Applications/"
          exit 1

      - name: Cache Swift Package dependencies
        uses: actions/cache@v6
        with:
          path: SceneViewSwift/.build
          key: spm-rn-ios-${{ runner.os }}-${{ hashFiles('SceneViewSwift/Package.resolved') }}
          restore-keys: |
            spm-rn-ios-${{ runner.os }}-

      # Build the real SceneViewSwift package for the iOS simulator. The RN
      # bridge is type-checked against the `.swiftmodule` this produces, so a
      # genuine SceneViewSwift API breakage fails this step before the
      # type-check even runs.
      - name: Build SceneViewSwift (iOS Simulator)
        working-directory: SceneViewSwift
        run: |
          set -o pipefail
          # ONLY_ACTIVE_ARCH=NO produces a fat (arm64 + x86_64) .swiftmodule so
          # the type-check works on both Apple Silicon and Intel macos-15 runners.
          # Without it, Intel runners produce only x86_64 and the arm64 type-check
          # fails. See the matching fix in bridge-ios-compile.yml (#2223).
          #
          # xcpretty is optional pretty-printing, not a build tool. Piping into a
          # MISSING xcpretty makes a verbose xcodebuild take SIGPIPE (exit 141),
          # and — worse here — the old inline `|| exit ${PIPESTATUS[0]}` exited
          # the whole step INSIDE the pipe, short-circuiting the `.swiftmodule`
          # guard below (an xcpretty that exits non-zero after a green xcodebuild
          # would make `exit ${PIPESTATUS[0]}` == `exit 0` and skip the guard).
          # So: detect xcpretty, run xcodebuild raw when absent, capture the REAL
          # exit code in a variable, test it AFTER — never `exit` inline — and
          # only then run the module guard. (Advisory cross-vendor review.)
          run_xcodebuild() {
            xcodebuild build \
              -scheme SceneViewSwift \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath "$RUNNER_TEMP/sv-dd" \
              -skipMacroValidation \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64 x86_64"
          }
          STATUS=0
          if command -v xcpretty >/dev/null 2>&1; then
            run_xcodebuild | xcpretty --color 2>/dev/null || STATUS=${PIPESTATUS[0]}
          else
            run_xcodebuild || STATUS=$?
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::SceneViewSwift build failed (xcodebuild exit $STATUS)."
            exit "$STATUS"
          fi
          MODULE_DIR="$RUNNER_TEMP/sv-dd/Build/Products/Debug-iphonesimulator"
          if [ ! -e "$MODULE_DIR/SceneViewSwift.swiftmodule" ]; then
            echo "::error::SceneViewSwift.swiftmodule was not produced — build failed."
            exit 1
          fi
          # Detect runner arch and export for use in subsequent steps.
          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" = "arm64" ]; then
            echo "SIM_TARGET=arm64-apple-ios18.0-simulator" >> "$GITHUB_ENV"
          else
            echo "SIM_TARGET=x86_64-apple-ios18.0-simulator" >> "$GITHUB_ENV"
          fi
          echo "SVMOD_DIR=$MODULE_DIR" >> "$GITHUB_ENV"
          echo "Runner arch: $RUNNER_ARCH → simulator target set in SIM_TARGET"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            react-native/react-native-sceneview/package-lock.json
            samples/react-native-demo/package-lock.json

      # ORDER MATTERS. The demo depends on the bridge module through a `file:`
      # link, and npm runs that linked package's `prepare` (`bob build`) even
      # under `--ignore-scripts` — so `bob` must already exist in the module's
      # own node_modules or the demo install dies with `bob: command not found`.
      # Installing the module's locked devDependencies first provides it.
      - name: Install bridge module JS dependencies
        working-directory: react-native/react-native-sceneview
        run: npm ci --ignore-scripts --no-audit --no-fund

      # `--ignore-scripts` skips the demo's own lifecycle scripts; the linked
      # module's `prepare` still runs (see above) and now succeeds.
      - name: Install demo JS dependencies
        working-directory: samples/react-native-demo
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Cache CocoaPods downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-rn-ios-${{ runner.os }}-${{ hashFiles('samples/react-native-demo/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-rn-ios-${{ runner.os }}-

      # Produces the REAL React module the type-check imports, and validates
      # this module's podspec (autolinking pulls `react-native-sceneview` into
      # the Pods project, so a malformed podspec fails right here).
      #
      # NO_FLIPPER=1 keeps the Flipper pod graph out — it is a debug tool this
      # guard does not need, and its pods are the flakiest part of RN 0.73's
      # dependency set. RCT_NEW_ARCH_ENABLED=0 keeps the old architecture, which
      # is what the bridge's `RCTViewManager` subclasses target.
      - name: pod install (produces the real React module)
        working-directory: samples/react-native-demo/ios
        env:
          LANG: en_US.UTF-8
          NO_FLIPPER: '1'
          RCT_NEW_ARCH_ENABLED: '0'
        run: pod install

      # Fail loudly if CocoaPods did not generate the React modulemap, rather
      # than letting the type-check fall back to something else.
      - name: Locate the generated React modulemap
        working-directory: samples/react-native-demo/ios
        run: |
          set -euo pipefail
          PODS="$PWD/Pods"
          MAP="$PODS/Target Support Files/React-Core/React-Core.modulemap"
          if [ ! -f "$MAP" ]; then
            echo "::error::CocoaPods did not generate React-Core.modulemap — cannot type-check against real React."
            exit 1
          fi
          # It must actually declare `module React` — that is the module name
          # `import React` resolves. A renamed module would silently break the
          # guard's premise.
          if ! grep -qE '^module React( |\{)' "$MAP"; then
            echo "::error::$MAP does not declare 'module React':"
            cat "$MAP"
            exit 1
          fi
          echo "REACT_MODULEMAP=$MAP" >> "$GITHUB_ENV"
          echo "PODS_ROOT_DIR=$PODS" >> "$GITHUB_ENV"
          cat "$MAP"

      # The actual regression guard, plus the two negative controls that keep it
      # from ever passing vacuously.
      - name: Type-check RN iOS bridge
        run: |
          set -euo pipefail

          SRC=(react-native/react-native-sceneview/ios/*.swift)
          echo "Type-checking: ${SRC[*]}"

          # Clang args that make `import React` resolve to CocoaPods' generated
          # module over React Native's real headers. Every search path below
          # points at generated or vendored files — none of React's API surface
          # is authored in this repository.
          CC_ARGS=(
            -Xcc -fmodule-map-file="$REACT_MODULEMAP"
            -Xcc -I"$PODS_ROOT_DIR/Target Support Files/React-Core"
          )
          for d in "$PODS_ROOT_DIR"/Headers/Public/*/; do
            CC_ARGS+=(-Xcc -I"${d%/}")
          done
          CC_ARGS+=(
            -Xcc -I"$PODS_ROOT_DIR/Headers/Public"
            -Xcc -I"$PODS_ROOT_DIR/boost"
            -Xcc -I"$PODS_ROOT_DIR/DoubleConversion"
            -Xcc -I"$PODS_ROOT_DIR/RCT-Folly"
            -Xcc -I"$PODS_ROOT_DIR/fmt/include"
          )

          # `-swift-version 5` matches the podspec's `swift_version = '5.9'`.
          typecheck() {
            xcrun --sdk iphonesimulator swiftc -typecheck \
              -swift-version 5 \
              -target "$SIM_TARGET" \
              "$@" \
              "${SRC[@]}"
          }

          # ---- Negative control 1: SceneViewSwift must be load-bearing -------
          echo "── Negative control: dropping -I <SceneViewSwift> must fail ──"
          if typecheck "${CC_ARGS[@]}" > "$RUNNER_TEMP/nc-sv.log" 2>&1; then
            echo "::error::Type-check PASSED without the SceneViewSwift module — the bridge is not actually being checked against SceneViewSwift, so this guard is vacuous."
            exit 1
          fi
          if ! grep -q "no such module 'SceneViewSwift'" "$RUNNER_TEMP/nc-sv.log"; then
            echo "::error::Expected \"no such module 'SceneViewSwift'\"; got a different failure:"
            head -30 "$RUNNER_TEMP/nc-sv.log"
            exit 1
          fi
          echo "✓ SceneViewSwift import is load-bearing"

          # ---- Negative control 2: React must be load-bearing ---------------
          echo "── Negative control: dropping the React modulemap must fail ──"
          if typecheck -I "$SVMOD_DIR" > "$RUNNER_TEMP/nc-react.log" 2>&1; then
            echo "::error::Type-check PASSED without the React module — the bridge is not actually being checked against React, so this guard is vacuous."
            exit 1
          fi
          if ! grep -q "no such module 'React'" "$RUNNER_TEMP/nc-react.log"; then
            echo "::error::Expected \"no such module 'React'\"; got a different failure:"
            head -30 "$RUNNER_TEMP/nc-react.log"
            exit 1
          fi
          echo "✓ React import is load-bearing"

          # ---- The real check ------------------------------------------------
          echo "── Type-check against real SceneViewSwift + real React ──"
          echo "SceneViewSwift module: $SVMOD_DIR  (target: $SIM_TARGET)"
          typecheck -I "$SVMOD_DIR" "${CC_ARGS[@]}"

          echo "✅ RN iOS bridge type-checks against the real SceneViewSwift API and the real React API."
