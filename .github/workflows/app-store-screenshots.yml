name: Sync App Store screenshots

# Uploads samples/ios-demo/appstore-screenshots/ to the EDITABLE App Store
# version. No build, no signing, no Xcode — plain App Store Connect REST.
#
# ⚠️ This is the SECONDARY path since #2899. `app-store.yml`'s submit step
# calls `asc_listing.apply_screenshots()` inline on every release, between the
# listing-text sync and the review submission — the only moment an editable
# version exists, because that step creates it and Apple locks the metadata
# when it submits. This workflow remains for OUT-OF-BAND refreshes, and can
# only write when a version happens to be open; dispatched at any other time
# it SKIPs honestly ("no editable iOS version").
#
# Do not read the rest of this header as "the dispatch is the only mechanism".
# It was, and relying on it alone is exactly how v4.26.0 shipped a screenshot
# set four releases stale while its listing text synced correctly.
#
# Why this is its own workflow rather than a job inside app-store.yml
# (#2612 P2 Phase B, review of PR #2781) — still true, and still the reason
# app-store.yml must never be *dispatched* merely to refresh screenshots:
#
#   The first cut added a `sync_screenshots` input + job to app-store.yml.
#   That workflow's `deploy-ios` / `deploy-macos` jobs are gated only on
#   `needs.check.outputs.*_ready`, with no event or input guard — so a
#   dispatch meant to refresh four PNGs ALSO ran two macos-15 archives and
#   uploaded a new build to TestFlight / App Store Connect. An irreversible
#   store side effect, on the flow that must stay boring.
#
#   Adding `&& inputs.sync_screenshots != 'true'` to both deploy jobs would
#   fix that instance. A separate file fixes the class: a screenshot sync
#   cannot start a build because there is no build here to start, and every
#   future job added to app-store.yml is exempt by construction rather than
#   by remembering a guard.
#
#   What the separate file does NOT buy is concurrency independence — this
#   workflow deliberately SHARES the `app-store-deploy` group, because both
#   workflows write the same editable App Store version. See the
#   `concurrency:` block below, which is the single source of truth on that.
#
# Screenshots persist from one App Store version to the next (a new version
# inherits the previous set), so this is listing maintenance rather than a
# per-release step. Hence dispatch-only: it is deliberately NOT wired to tags.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Upload appstore-screenshots/ to the editable App Store version"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  # SAME group as app-store.yml, on purpose.
  #
  # The first cut used a separate group, reasoning that an asset sync "must
  # not serialise against a release". That was comfort, not safety: both
  # workflows write to the SAME editable App Store version. A sync deletes a
  # display type's screenshots, then a concurrent deploy attaches that version
  # to a reviewSubmission and locks it — the subsequent reserves 409 and the
  # version goes to review with a truncated or empty screenshot set. The
  # delete-is-fatal guard only covers the pre-delete window, not that one.
  #
  # Queueing behind a deploy costs minutes. The race costs a corrupted listing
  # on a version under review. `cancel-in-progress: false` keeps both runs.
  group: app-store-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-screenshots:
    name: Upload App Store screenshots (en-US)
    # NOT gated at job level. `confirm` defaults to "false", so an operator who
    # clicks "Run workflow" without touching the dropdown would otherwise get
    # an all-skipped run whose conclusion is success — a green check, zero
    # annotations, nothing uploaded. That is the same fake green the script's
    # credential-less skip was upgraded to annotate. The guard below makes the
    # no-op say so, and every later step is conditioned on it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Guard — confirm must be explicitly true
        id: guard
        # Bound through env rather than interpolated into the shell. `confirm`
        # is a type: choice input, so GitHub validates it server-side today —
        # but that makes the safety of a credential-bearing job depend on an
        # input's type declaration surviving future edits. env binding does not.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "::warning::confirm was left at '$CONFIRM' — nothing was uploaded. Re-run with confirm=true to publish the repo's screenshots."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (for appstore-screenshots/*)
        if: steps.guard.outputs.go == 'true'
        uses: actions/checkout@v7

      - name: Upload screenshots to App Store Connect
        if: steps.guard.outputs.go == 'true'
        env:
          # Same secrets as the deploy workflow — no new scope, no new secret.
          # asc_listing.py reads the .p8 CONTENT straight from env, so there
          # is no key file to stage (and none to clean up).
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # $RUNNER_TEMP, not /tmp: the runner wipes it per job. On the
          # self-hosted `sceneview-mac` runner /tmp survives between runs, so
          # `python3 -m venv /tmp/...` would silently reuse a stale tree and
          # void the pinned-version guarantee below.
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # Pinned exact versions — credential-bearing job (#1230), tracked by
          # Dependabot (#1286). Same requirements file as the deploy workflow.
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet -r .github/workflows/requirements/app-store.txt
          "$RUNNER_TEMP/asc-venv/bin/python3" .claude/scripts/store-sync/asc_listing.py --apply-screenshots
