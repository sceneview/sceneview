name: Publish Dokka docs

# Manual only: a 2.x maintenance release must not replace the published API reference.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Dokka docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 21
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Generate Dokka HTML docs
        run: ./gradlew dokkaGenerate
      - name: Deploy to GitHub pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: SceneView/sceneview.github.io
          publish_branch: main
          publish_dir: ./build/dokka/html
          destination_dir: api/sceneview-android
          full_commit_message: Dokka docs - sceneview-android
          enable_jekyll: false