name: React Native TypeScript check

# Lints, type-checks and unit-tests the React Native module's TypeScript.
#
# WHY THIS EXISTS
# ---------------
# `react-native/react-native-sceneview/package.json` declared
# `"lint": "eslint \"src/**/*.{ts,tsx}\""` while `eslint` was in NEITHER its
# devDependencies NOR anywhere else in the repo. Running `npm run lint` after
# a clean `npm ci` failed with `sh: eslint: command not found` (exit 127) —
# measured, not inferred. Grepping every file under `.github/workflows/` for
# `lint`/`eslint` returned nothing, so no job invoked it either: the package
# advertised a lint gate that had never once run, locally or in CI.
#
# The same was true of its two other check scripts. `npm run typescript`
# (`tsc --noEmit`) and `npm test` (jest) existed and WORKED, but the only RN
# npm script any workflow ever called was `npm run build`, inside
# `release.yml`'s `publish-rn` job — i.e. at publish time, on a tag, far too
# late to block anything. The bridge's TypeScript was therefore shipped to
# npm having been type-checked and tested only on a contributor's laptop.
#
# This is the TypeScript-side twin of the exposure `rn-ios-compile.yml`
# (#2067) and `rn-android-compile.yml` (#3042) each closed for their own
# native bridge.
#
# WHY BIOME, NOT ESLINT
# ---------------------
# The repo already has exactly one JS/TS linter: Biome v2, configured by the
# repo-root `biome.json` and consumed by `mcp/` via `npm run lint`. Adding
# ESLint to satisfy a stale script would have meant a second linter, a second
# config and a second rule set inside one repo. Instead the RN sources were
# added to `biome.json`'s `files.includes` and the package's `lint` script
# now runs Biome from the repo root, mirroring `mcp/package.json`'s pattern
# (the root is the CWD so the config's root-relative `includes` resolve).
#
# NOT SILENTLY SKIPPABLE
# ----------------------
# Two ways this gate could quietly stop guarding anything, and what stops each:
#   1. A path filter that misses the module — the repo's "skipped -> green for
#      life" trap. The `paths:` list below covers the TypeScript surface, the
#      package manifest and lockfile, both tsconfigs, the workflow itself, and
#      `biome.json` (whose `files.includes` decides what Biome even looks at).
#   2. A vacuous pass — see the assert step below. Biome's exit code is NOT
#      sufficient here: it exits 1 only when NOTHING matched at all, so
#      dropping a single directory from `biome.json`'s `includes` leaves it at
#      0 while silently checking less. Mutation-tested: with the assert step,
#      dropping any one of the three `includes` lines fails the job; without
#      it, all three passed green. The assert compares the number of `.ts`/
#      `.tsx` files on disk against the count Biome reports.
#
# NOT A REQUIRED CHECK ON `main`
# ------------------------------
# Same rule as `snippets-check.yml`: this is a positively-path-filtered
# workflow, and a required check that does not trigger registers no check run
# at all — the PR would block forever. It stays advisory: when it runs and
# fails, the red check is visible on the PR even though branch protection does
# not enforce it.

on:
  pull_request:
    branches: [main]
    paths:
      - 'react-native/react-native-sceneview/src/**'
      - 'react-native/react-native-sceneview/__tests__/**'
      - 'react-native/react-native-sceneview/example/src/**'
      - 'react-native/react-native-sceneview/package.json'
      - 'react-native/react-native-sceneview/package-lock.json'
      - 'react-native/react-native-sceneview/tsconfig.json'
      - 'react-native/react-native-sceneview/tsconfig.build.json'
      - 'biome.json'
      - '.github/workflows/rn-ts-check.yml'
  push:
    branches: [main]
    paths:
      - 'react-native/react-native-sceneview/src/**'
      - 'react-native/react-native-sceneview/__tests__/**'
      - 'react-native/react-native-sceneview/example/src/**'
      - 'react-native/react-native-sceneview/package.json'
      - 'react-native/react-native-sceneview/package-lock.json'
      - 'react-native/react-native-sceneview/tsconfig.json'
      - 'react-native/react-native-sceneview/tsconfig.build.json'
      - 'biome.json'
      - '.github/workflows/rn-ts-check.yml'
  workflow_dispatch:

concurrency:
  group: rn-ts-check-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts-check:
    name: RN TypeScript lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-native/react-native-sceneview/package-lock.json

      # `npm ci` (not `npm install`) so the lockfile is authoritative and a
      # drifted lockfile fails here instead of being silently rewritten.
      - name: Install dependencies
        working-directory: react-native/react-native-sceneview
        run: npm ci --no-audit --no-fund

      # `npm run lint` cd's to the repo root and runs the package-local Biome
      # binary against this package's three TypeScript directories, so the root
      # `biome.json` (formatter + linter + assists) is the single rule source.
      - name: Lint (Biome)
        working-directory: react-native/react-native-sceneview
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/biome.log"

      # A green Biome exit does NOT prove Biome looked at this package. Measured
      # on Biome 2.5.7: when a path argument is excluded by `biome.json`'s
      # `files.includes`, Biome silently drops it and still exits 0 as long as
      # ANY other argument yielded files. Deleting just the `src/**` line from
      # `biome.json` therefore leaves this job green while the actually-shipped
      # source goes unlinted — the exact "reports a verdict it never computed"
      # shape `rn-android-compile.yml` guards against on the Kotlin side.
      # (Biome exits 1 only when NOTHING at all matched.)
      #
      # So don't trust the exit code: count the TypeScript files on disk and
      # require Biome to have checked exactly that many.
      - name: Assert Biome checked every TypeScript file
        working-directory: react-native/react-native-sceneview
        run: |
          set -euo pipefail
          EXPECTED="$(find src __tests__ example/src \( -name '*.ts' -o -name '*.tsx' \) | wc -l | tr -d ' ')"
          CHECKED="$(grep -oE 'Checked [0-9]+ files?' "$RUNNER_TEMP/biome.log" | head -1 | grep -oE '[0-9]+' || true)"
          echo "TypeScript files on disk: $EXPECTED — Biome checked: ${CHECKED:-<none reported>}"
          if [ "$EXPECTED" -lt 1 ]; then
            echo "::error::No .ts/.tsx found under src/, __tests__/ or example/src/ — the package layout moved and this gate is guarding nothing."
            exit 1
          fi
          if [ -z "$CHECKED" ]; then
            echo "::error::Biome printed no 'Checked N files' line — its output format changed and this assertion can no longer verify coverage."
            exit 1
          fi
          if [ "$CHECKED" -ne "$EXPECTED" ]; then
            echo "::error::Biome checked $CHECKED of $EXPECTED TypeScript files. A path is missing from biome.json's files.includes — this job would otherwise have passed while leaving code unlinted."
            exit 1
          fi

      - name: Type-check
        working-directory: react-native/react-native-sceneview
        run: npm run typescript

      - name: Unit tests
        working-directory: react-native/react-native-sceneview
        run: npm test
