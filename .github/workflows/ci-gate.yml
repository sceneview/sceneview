name: CI Gate

# Single always-on aggregator status check for branch protection.
#
# WHY THIS EXISTS (#1314)
# ----------------------
# `main` is merged fire-and-forget (`gh pr merge --squash --auto`). For
# auto-merge to actually gate on CI, branch protection must require a
# status check. But the repo's real CI workflows (ci.yml, ios.yml,
# telemetry-ci.yml) all use workflow-level `paths`/`paths-ignore` filters
# — and ci.yml additionally per-job `if:`-gates jobs on a path filter — so
# a docs-only or scripts-only PR runs ZERO (or `skipped`) jobs. Requiring
# any of those checks directly would leave such a PR stuck on
# "Expected — waiting for status" forever.
#
# DESIGN CHOICE
# -------------
# A GitHub job can only `needs:` jobs in its OWN workflow, and the repo
# has several PR-triggered workflows with different path filters — a single
# `needs:`-based gate cannot see across them. A `workflow_run`-triggered
# gate is unreliable as a required check (its check run attaches to the
# branch, not the PR head SHA, so the PR merge box never sees it).
#
# So this is a dedicated workflow with a `pull_request` trigger and NO
# path filter — it therefore runs on EVERY PR and ALWAYS reports the
# `CI Gate` status. Its single job polls the GitHub Checks API for the
# PR head SHA, waits for every OTHER check run to finish, and:
#   - FAILS  if any other check concluded `failure`/`cancelled`/`timed_out`
#   - PASSES if every other check is `success`, `skipped`, or `neutral`
# A path-filtered-out workflow simply produces no check runs for that SHA
# (or its `if:`-skipped jobs report `skipped`) — either way the gate is
# green, so docs/scripts/CI-only PRs merge without jamming.
#
# `action_required` is treated as PENDING, not failure (#1543): a fork PR's
# checks sit in `action_required` until a maintainer approves the run. That
# is not a defect — flipping `CI Gate` red would block a legitimate fork PR
# that is merely awaiting approval. The gate keeps waiting for those checks
# to be approved-then-completed (until the deadline), exactly as it would
# for any other in-progress check.
#
# CORE-CHECK GUARD (#1543)
# ------------------------
# Without a lower bound on the checks observed, the gate can pass green if a
# slow, non-path-gated workflow has not yet registered ANY check run by the
# time every *already-registered* `others` check has completed. To close
# that race the gate refuses to exit green until every check in
# `REQUIRED_CHECKS` (below) has been observed for this SHA — UNLESS none of
# `ci.yml`'s checks appear at all, which is the legitimate signature of a
# docs-only PR (ci.yml is workflow-level `paths-ignore`-filtered). This is a
# name-based "wait for these IF expected" guard, so it never false-negatives
# a genuinely light docs-only PR while still catching a core check that is
# simply slow to register.
#
# AGENT REVIEW IS ADVISORY, DELIBERATELY
# --------------------------------------
# `Agent review` (pr-review.yml) is listed in `ADVISORY_CHECKS`, so its
# conclusion never decides this gate. That is a policy choice, not an
# oversight, and it follows the rule the repo already applies to
# `check-doc-drift`: an LLM review is a heuristic, and blocking a heuristic
# guarantees false positives that erode trust in the whole gate. A wrong
# `DO_NOT_MERGE` must cost a maintainer one read of the review comment, not a
# frozen repository.
#
# What stays honest without being blocking: the check itself still goes RED,
# the verdict is posted as a comment on the PR, and `grade-pr-review.sh` still
# fails CLOSED (a crashed fan-out is `REVIEW_INCOMPLETE`, never a pass). The
# signal is loud; it just does not hold the merge button.
#
# It also avoids a structural deadlock: `claude-code-action` refuses to run on
# any PR that edits `pr-review.yml`, so making the check blocking would make
# every future change to the review workflow unmergeable by design.
#
# Promotion to blocking is a later decision, and it should be made the same way
# the advisory device-QA legs will be: after enough runs to measure the
# false-positive rate, not on the assumption that it is low.
#
# DEVICE QA EXCLUSION (#1588)
# ---------------------------
# `Device QA — *` check runs are deliberately excluded from the aggregation.
# `device-qa.yml` is intentionally NOT a per-PR gate — it has no
# `pull_request` trigger and runs only on push-to-main / `workflow_dispatch`
# / nightly schedule (see its header comment "NOT in the per-PR CI Gate").
# But when an agent manually `workflow_dispatch`-es `Device QA` on a branch
# head SHA to validate it, the resulting `Device QA — web (Playwright)` /
# `Device QA — android (Maestro)` check runs attach to that SHA, and the
# corresponding PR's `CI Gate` would otherwise pick them up. Any check run
# whose name starts with `Device QA` is therefore filtered out of the
# `others` set — the same treatment as the gate's own `SELF_CHECK`.
#
# ADVISORY CHECK EXCLUSION (#1984)
# --------------------------------
# `Coverage` was deliberately moved OFF the PR-blocking path and made
# advisory/nightly by #1959 (#1955) — the `coverage` job carries
# `continue-on-error: true`. But `continue-on-error` only masks an
# in-job *step* failure; it does NOT mask a `cancelled` conclusion when
# the whole job is concurrency-cancelled. On PR #1889 a transient
# concurrency-cancel left `Coverage (advisory): CANCELLED`, and the gate's
# failure filter (`failure`/`cancelled`/`timed_out`) flipped `CI Gate` red
# even though the only non-success check was advisory. An advisory check
# must NEVER affect the gate verdict — for ALL conclusions, including
# `CANCELLED` / `SKIPPED` / `FAILURE`. So any check run whose name is in
# `ADVISORY_CHECKS` (substring match) is filtered out of the `failed` set
# entirely, regardless of conclusion.
#
# An advisory check is ALSO dropped from the `pending` wait set (#2013):
# the gate must not block waiting for it. The slow `Coverage (advisory)`
# job can run well past the gate's internal deadline; if the gate waited
# on it the poll loop would time out red even though Coverage can never
# gate. Advisory checks may keep running — the gate stops as soon as every
# NON-advisory check has finished and ignores the advisory ones entirely.
#
# DOCS-ONLY BYPASS (#2117)
# ------------------------
# A docs-only PR (paths-ignored by ci.yml and all other PR-triggered
# workflows) registers ZERO check runs besides `CI Gate` itself. Without
# a bypass, the gate waits the full 50 min then hard-fails, blocking
# auto-merge until an admin manually merges. Fix: a short grace period
# (90 s after the initial 30 s warm-up) — if no other check run has
# registered by then, the gate exits green. Any non-trivial PR registers
# at least one check run within 90 s; the grace period only fires while
# `others` is completely empty and is disabled as soon as one check
# run appears.
#
# STICKY OBSERVATION LEDGER (#3018)
# ---------------------------------
# Every decision below used to be taken from ONE instant's read of the
# Checks API. That read is not stable: while GitHub builds a new run
# attempt (`gh run rerun`, "Re-run failed jobs"), an entire check suite can
# be absent from one response and back in the next.
#
# On PR #3015 that window landed on the gate's final poll. `Compile KMP
# core` had concluded `cancelled` (killed by its own `timeout-minutes`), a
# re-run was requested, and the 18:09:33Z read returned only the
# `PR Review (agents)` suite. Every consequence of the partial read pushed
# the same way: the 11 missing checks left `pending` so the loop broke,
# left `observed_names` so the CORE-CHECK GUARD read it as the docs-only
# signature and disabled itself, and left `others` so the `cancelled` never
# reached `ci-gate-aggregate.sh`. The gate aggregated ONE check run and
# passed. The one-entry conclusions list in that log is not a display bug —
# the aggregation genuinely saw one check.
#
# Fix: `.github/scripts/ci-gate-merge-observations.sh` keeps a ledger of
# every check name observed for this SHA. A name that disappears from a
# later read is kept as `status: vanished`, which the `pending` selector
# treats as not-completed — so the gate waits instead of concluding. When
# the check comes back its FRESH record replaces the remembered one, so a
# `cancelled` that is genuinely re-run to `success` still goes green; if it
# never comes back the gate times out red. Both branches are fail-closed.
#
# This is orthogonal to the #2492 collapse: that resolves two check runs
# sharing a name WITHIN one read, this carries names ACROSS reads. #2492's
# intent is untouched.
#
# WHAT THE LEDGER DOES *NOT* CLOSE (#3024)
# ----------------------------------------
# The ledger is per-gate-run: `mktemp` at the top of the step. This workflow
# carries `cancel-in-progress`, and merging any sibling PR to `main` recomputes
# every open PR's merge ref and re-fires `pull_request` — killing the in-flight
# gate and starting a new one with an EMPTY ledger. If that restarted gate's
# FIRST read lands in the rebuild window, there is nothing remembered, the
# CORE-CHECK GUARD sees zero core checks and reads its docs-only signature, and
# the #3015 shape reproduces verbatim. Measured, not hypothesised.
#
# So the ledger narrows the window from "any one read is partial" to "every
# read up to the decision is partial" — it does not eliminate it. Closing it
# means deciding INSIDE the gate whether `ci.yml` should have run for this PR,
# which is the #2117 trade and needs its own measurement. Tracked in #3024;
# do not read the section above as "the class is closed".
#
# RECOVERY FROM A PERMANENT VANISH — AND WHY IT IS NOT A ONE-CLICK FIX
# --------------------------------------------------------------------
# If a check never comes back (a deleted workflow run, a removed check suite),
# this gate burns its remaining deadline and exits red, naming what is missing.
#
# ⛔ Re-running THIS check is the obvious response and it is NOT safe on its
# own. A new gate run starts with an EMPTY ledger, so if the Checks API is
# still returning a partial view, the restarted gate has nothing remembered,
# the CORE-CHECK GUARD reads the docs-only signature, and it passes GREEN —
# converting this workflow's correct red into exactly the #3015 failure it
# exists to prevent. Measured, not hypothesised (#3024).
#
# The safe order is: first make the missing checks real again — re-run the
# WORKFLOW that owns them, or push a commit — and only then re-run this gate,
# after confirming the checks are visible on the PR. Never re-run this gate as
# a way of getting past its own red.
#
# Branch protection on `main` requires ONLY this `CI Gate` check.

on:
  pull_request:
    branches: [main]
    # ⛔ Intentionally NO paths / paths-ignore filter. This workflow MUST
    # run on every PR so the `CI Gate` status is always reported — that
    # is the whole point of the aggregator pattern (#1314).
  workflow_dispatch:

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    # The internal poll loop self-terminates at a 50-min deadline (+30s
    # warm-up sleep). It must comfortably exceed the slowest CI job's own
    # timeout. Since #1955 split JaCoCo off the PR-blocking path, the
    # slowest jobs are the advisory `Coverage (advisory)` job
    # (`timeout-minutes: 45`, but `continue-on-error: true` so it never
    # gates) and the `build` job (`timeout-minutes: 30`); the blocking
    # `Unit tests` job is `timeout-minutes: 30`. The 50-min internal
    # deadline still comfortably exceeds every one of them, so a
    # slow-but-succeeding job is seen as completing, not as a gate timeout.
    # The job timeout sits comfortably above the internal deadline so the
    # loop's own "::error:: timed out waiting for …" message is what
    # surfaces — a hard runner kill would give no diagnostic. 60 min keeps a
    # ~9-min cushion above the internal ~50.5-min worst case (#1360, #1554,
    # #1955).
    timeout-minutes: 60
    steps:
      # REQUIRED: the aggregation step shells out to
      # `.github/scripts/ci-gate-aggregate.sh`. Without a checkout that
      # script is not on disk, so the step dies with "No such file or
      # directory", `gate_rc` is non-zero and the gate fails EVERY PR
      # (#2013). This is the actual cause of the v4.13.0 admin-merge spree —
      # the helper was extracted by #1984 but no checkout step was added.
      - uses: actions/checkout@v7
      - name: Aggregate all PR check conclusions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          # This job's own check run name — excluded from the aggregation
          # so the gate never waits on itself.
          SELF_CHECK: CI Gate
          # Core checks that `ci.yml` ALWAYS produces on a non-docs PR — the
          # `changes`, `repo-hygiene` and `quality-gate` jobs have no per-job
          # `if:` path gate, so when `ci.yml` runs at all, all three appear.
          # The gate refuses to exit green until every one of these has been
          # observed for the head SHA (see CORE-CHECK GUARD note above), so a
          # slow-to-register core workflow can't be missed. Newline-separated.
          # Keep in sync with the un-`if:`-gated job `name:`s in ci.yml.
          REQUIRED_CHECKS: |
            Detect changed paths
            Repo hygiene checks
            Quality gate (full)
          # Advisory check-run names — substring-matched, newline-separated.
          # An advisory check (e.g. `Coverage (advisory)`, made advisory by
          # #1959/#1955) must NEVER affect the gate verdict, for ANY
          # conclusion including `CANCELLED` / `SKIPPED` / `FAILURE`. Any
          # check run whose name CONTAINS one of these strings is dropped
          # from the pass/fail decision (#1984). It is still permitted to
          # register and is still waited on while pending — it just cannot
          # red-light the gate.
          ADVISORY_CHECKS: |
            Coverage
            Agent review
        shell: bash
        run: |
          set -euo pipefail

          # workflow_dispatch has no PR context — nothing to aggregate.
          if [ -z "${HEAD_SHA:-}" ]; then
            echo "No pull_request context (manual dispatch) — nothing to gate."
            exit 0
          fi

          echo "Aggregating check runs for $REPO @ $HEAD_SHA"

          # Poll until every non-self check run for this SHA has finished.
          # GitHub registers a workflow's check runs within a few seconds
          # of the PR event, so we wait briefly before the first read to
          # avoid a false "all green" on an empty list.
          #
          # The fixed warm-up sleep alone is not enough: if another
          # workflow's check runs register *after* the sleep, the first
          # loop iteration sees an empty `others` set and would pass the
          # gate prematurely. So we additionally refuse to exit green
          # until at least one non-self check run has been observed AND
          # every expected core check (see REQUIRED_CHECKS) has registered.
          # 50-min internal deadline: must comfortably exceed the slowest
          # CI job's own timeout. Since #1955 the heaviest jobs are the
          # advisory `Coverage (advisory)` job (45 min, continue-on-error)
          # and `build` (30 min); the blocking `Unit tests` job is 30 min —
          # all well under 50 min, so a slow-but-succeeding job is seen as
          # completing.
          #
          # DOCS-ONLY BYPASS (#2117)
          # ------------------------
          # For a docs-only PR (paths-ignored by ci.yml and every other
          # workflow), no check runs other than `CI Gate` itself ever
          # register. Without a bypass, the gate polls until the full
          # 50-min deadline and then hard-fails — blocking auto-merge for
          # ~50 minutes then requiring an admin-merge workaround.
          #
          # Fix: a short docs-only grace period (90 s after the initial
          # warm-up sleep). If no other check runs have appeared by the
          # time the grace period expires, the PR is legitimately light
          # (all workflows were path-filtered out), and the gate exits
          # green. Any non-trivial PR will register at least one check run
          # within 90 s; the threshold has been confirmed against multiple
          # CI runs.  The grace period only applies while `others` is
          # *completely empty* — once at least one check run registers the
          # normal poll loop takes over and the docs-bypass is inactive.
          deadline=$(( $(date +%s) + 50 * 60 ))
          # docs-only grace: 90 s after the initial 30 s warm-up = 120 s total.
          docs_bypass_deadline=$(( $(date +%s) + 90 ))
          sleep 30
          seen_any_other=false

          # STICKY OBSERVATION LEDGER (#3018): every check name observed for
          # this SHA, carried across poll iterations so a check cannot leave
          # the set just because one Checks API read did not return it.
          ledger_file=$(mktemp)
          trap 'rm -f "$ledger_file"' EXIT

          # Normalise REQUIRED_CHECKS into a clean, non-empty list.
          required_checks=$(echo "${REQUIRED_CHECKS:-}" | sed '/^[[:space:]]*$/d')

          # Normalise ADVISORY_CHECKS into a clean, non-empty list of
          # substrings (#1984). A check run whose name CONTAINS any of these
          # is advisory and is excluded from the pass/fail decision below,
          # regardless of conclusion.
          advisory_checks=$(echo "${ADVISORY_CHECKS:-}" | sed '/^[[:space:]]*$/d')

          while :; do
            # All check runs for the head commit (handles >100 via paging).
            # `id` is carried so we can pick the LATEST run per name below
            # (check-run ids increase monotonically with creation).
            runs=$(gh api --paginate \
              "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | {name: .name, status: .status, conclusion: .conclusion, id: .id}')

            # NEWLINE-NORMALISE THE NAME, ONCE, HERE
            # --------------------------------------
            # A check-run name is attacker-influenceable: a FORK PR can add a
            # workflow whose job `name:` contains `\n`. Every downstream use
            # treats names as newline-separated records — `observed_names`
            # (core-check guard), the `pending`/`vanished` lists, and the
            # conclusions line that prints straight to the Actions log. A name
            # carrying a newline therefore splits into several fake records:
            # measured, `Evil\n::error title=CI Gate::forged` reaches column 0
            # of the log and the runner parses it as a workflow command.
            # Normalising at the single point where records are built closes
            # every one of those sinks at once. Legitimate job names never
            # contain newlines, so this is a no-op for real checks.
            #
            # Then drop this gate's own check run from consideration, plus every
            # `Device QA — *` run: Device QA is deliberately NOT a per-PR gate
            # (see header comment + device-qa.yml), so a manually-dispatched
            # Device QA run on a branch SHA must never count here (#1588).
            others=$(echo "$runs" | jq -c --arg self "$SELF_CHECK" \
              '.name |= gsub("[\r\n]"; " ")
               | select((.name != $self) and (.name | startswith("Device QA") | not))')

            # LATEST-RUN-PER-NAME COLLAPSE (#2492)
            # ------------------------------------
            # `ci.yml`'s concurrency group is keyed on the PR HEAD SHA
            # (`ci-<head.sha>`, ci.yml#L84). Merging a sibling PR to `main`
            # makes GitHub recompute THIS PR's merge ref and re-fire its
            # `pull_request` event — at the SAME head SHA, so `ci.yml`'s
            # `cancel-in-progress` CANCELS the in-flight run and immediately
            # starts a FRESH one for that same SHA. The check-runs API then
            # returns BOTH the superseded `cancelled` run AND the fresh run
            # under the same name (e.g. two `Detect changed paths`). The
            # superseded `cancelled` conclusion is pure concurrency noise —
            # exactly like `stale` — yet without this collapse it lands in
            # the `failed` set and red-lights `CI Gate`, skipping every
            # downstream job and blocking `--auto` until a manual re-run
            # (#2492; this ping-ponged PR #2467 three times in one session).
            #
            # Fix: keep only the LATEST run (max id) for each name before the
            # pending/fail decisions, so a name's verdict is its newest run.
            # A genuinely-cancelled check with NO newer run stays the latest
            # and STILL fails the gate (the #1984 advisory exclusion and the
            # `blocking CANCELLED still fails` contract in
            # test-ci-gate-aggregation.sh are untouched — the standalone
            # aggregate script still receives one `<conclusion>\t<name>` line
            # per name). Concurrency is unchanged, so the CI-minutes saving of
            # `cancel-in-progress` is preserved.
            others=$(echo "$others" \
              | jq -s -c 'group_by(.name) | map(max_by(.id))[]')

            # STICKY OBSERVATION LEDGER (#3018)
            # ---------------------------------
            # Fold this read into everything already observed for the SHA. A
            # name that was seen before and is missing NOW comes back as
            # `status: vanished` (never emitted by the Checks API), which the
            # `pending` selector below treats as not-completed — so a check
            # can never leave the gated set by disappearing mid-re-run. A name
            # still reported by the API keeps its live record, so a re-run
            # that turns `cancelled` into `success` is honoured on this poll.
            # Runs BEFORE the emptiness test so a total disappearance keeps
            # waiting instead of re-arming the docs-only bypass.
            others=$(printf '%s\n' "$others" \
              | bash .github/scripts/ci-gate-merge-observations.sh "$ledger_file")
            printf '%s\n' "$others" | sed '/^[[:space:]]*$/d' > "$ledger_file"

            # Names observed earlier that the current read did not return.
            vanished=$(echo "$others" | jq -r 'select(.status == "vanished") | .name')

            if [ -z "$others" ]; then
              # DOCS-ONLY BYPASS (#2117): if the short grace period has
              # elapsed with still no other check runs, every workflow was
              # path-filtered out — this is a legitimately docs-only PR.
              # Exit green so auto-merge is not blocked.
              if [ "$(date +%s)" -ge "$docs_bypass_deadline" ]; then
                echo "No other CI check runs registered within the docs-only grace period."
                echo "All changed paths appear to be CI-exempt (docs, website, marketing, branding, *.md, llms*.txt)."
                echo "CI Gate passed — docs-only PR, no CI workflows triggered."
                exit 0
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Timed out — no other CI check runs ever registered for this SHA."
                exit 1
              fi
              echo "No other check runs reported for this SHA yet — waiting for at least one to register."
              sleep 20
              continue
            fi
            # At least one other check run has appeared — disable the
            # docs-only bypass (set deadline to past so it can't fire).
            docs_bypass_deadline=0

            seen_any_other=true

            # All check-run names observed for this SHA (completed or not).
            observed_names=$(echo "$others" | jq -r '.name' | sort -u)

            # CORE-CHECK GUARD (#1543): if ANY core check has appeared then
            # ci.yml is running for this PR (it is not a docs-only PR), so
            # ALL core checks are expected — keep waiting until every one of
            # them has registered. If NONE have appeared the PR is docs-only
            # (ci.yml is paths-ignore-filtered out) and the guard is a no-op,
            # so a legitimately light docs PR is never blocked.
            missing_core=""
            any_core_seen=false
            if [ -n "$required_checks" ]; then
              while IFS= read -r rc; do
                [ -z "$rc" ] && continue
                if echo "$observed_names" | grep -qxF "$rc"; then
                  any_core_seen=true
                else
                  missing_core="${missing_core}${rc}"$'\n'
                fi
              done <<< "$required_checks"
            fi
            # Only enforce the guard once ci.yml has shown its hand.
            if [ "$any_core_seen" != true ]; then
              missing_core=""
            fi

            # `action_required` (#1543) is a fork-PR awaiting-maintainer-
            # approval state. GitHub reports it with `status: completed,
            # conclusion: action_required`, so it slips past the bare
            # `status != "completed"` filter. Treat it as PENDING-equivalent:
            # keep waiting (a maintainer may approve it) rather than letting
            # the loop break and the `failed` set flip the gate red.
            pending=$(echo "$others" | jq -r \
              'select(.status != "completed" or .conclusion == "action_required") | .name')

            # ADVISORY checks are NOT waited on (#2013). An advisory check
            # (e.g. the slow `Coverage (advisory)` job) cannot affect the
            # verdict, so the gate must not block on it either — if it hangs
            # past the deadline the gate would otherwise time out red even
            # though the check is non-gating. Drop advisory names from the
            # `pending` set so the loop can break once every NON-advisory
            # check has finished; the advisory job may keep running.
            if [ -n "$pending" ] && [ -n "$advisory_checks" ]; then
              non_advisory_pending=""
              while IFS= read -r pname; do
                [ -z "$pname" ] && continue
                is_advisory=false
                while IFS= read -r adv; do
                  [ -z "$adv" ] && continue
                  case "$pname" in
                    *"$adv"*) is_advisory=true; break ;;
                  esac
                done <<< "$advisory_checks"
                [ "$is_advisory" = true ] || \
                  non_advisory_pending="${non_advisory_pending}${pname}"$'\n'
              done <<< "$pending"
              pending=$(printf '%s\n' "$non_advisory_pending" | sed '/^[[:space:]]*$/d')
            fi

            if [ -z "$pending" ] && [ -z "$missing_core" ] && [ "$seen_any_other" = true ]; then
              break
            fi

            # DISPLAY ONLY — `pending` itself is never modified below.
            #
            # `vanished` is computed from the raw merged view, BEFORE the
            # advisory filter, so it also contains advisory names that were
            # just dropped from `pending`. An advisory check that vanishes is
            # not gated by anything — the loop is allowed to break with it
            # still missing — so announcing it as "still gated, waiting" would
            # assert the opposite of what the code does. Intersect with the
            # post-advisory `pending`: a vanished name that survived the
            # advisory filter is exactly a vanished name that still gates.
            if [ -n "$vanished" ] && [ -n "$pending" ]; then
              vanished_gating=$(printf '%s\n' "$vanished" | grep -xF -- "$pending" || true)
            else
              vanished_gating=""
            fi

            # A vanished name belongs in `pending` (that is the whole #3018
            # fix) but it is NOT "running": the API has stopped reporting it.
            # Printing it under the "still running" header would assert the
            # opposite of what was measured, and print every such name twice.
            # So split the two sets for the log; the wait block below prints
            # `running` under "running" and `vanished_gating` under its own
            # header.
            if [ -n "$pending" ] && [ -n "$vanished" ]; then
              # `--` is load-bearing: a check-run name is fork-controlled, and
              # a name like `-v` or `--help` would otherwise be parsed by grep
              # as an option, blanking the whole "still running" diagnostic.
              running=$(printf '%s\n' "$pending" | grep -vxF -- "$vanished" || true)
            else
              running="$pending"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI checks to complete."
              if [ -n "$running" ]; then
                echo "  Still running / awaiting approval:"
                echo "$running" | sort -u | while IFS= read -r n; do echo "    - $n"; done
              fi
              if [ -n "$missing_core" ]; then
                echo "  Expected core checks that never registered:"
                echo "$missing_core" | sed '/^[[:space:]]*$/d' | sort -u \
                  | while IFS= read -r n; do echo "    - $n"; done
              fi
              # DELIBERATE: the timeout prints the FULL `vanished` set, not
              # `vanished_gating`. The wait log above must not call an advisory
              # check "still gated" because it is not — but this is a
              # post-mortem, the header only claims the names were missing from
              # the read, and knowing that an advisory check disappeared too is
              # evidence about the API, not a claim about the verdict.
              if [ -n "$vanished" ]; then
                echo "  Observed earlier but missing from the final Checks API read (#3018):"
                echo "$vanished" | sort -u | while IFS= read -r n; do echo "    - $n"; done
              fi
              exit 1
            fi

            if [ -n "$running" ]; then
              echo "Waiting for checks to finish (running, or fork PR awaiting approval):"
              echo "$running" | sort -u | while IFS= read -r n; do echo "  - $n"; done
            fi
            # A vanished check is almost always a run attempt being rebuilt
            # (`gh run rerun`). Say so loudly rather than silently dropping it
            # from the verdict, which is exactly what #3018 was.
            if [ -n "$vanished_gating" ]; then
              echo "Observed earlier but absent from this Checks API read — still gated, waiting (#3018):"
              echo "$vanished_gating" | sort -u | while IFS= read -r n; do echo "  - $n"; done
            fi
            if [ -n "$missing_core" ]; then
              echo "Waiting for expected core checks to register:"
              echo "$missing_core" | sed '/^[[:space:]]*$/d' | sort -u \
                | while IFS= read -r n; do echo "  - $n"; done
            fi
            sleep 20
          done

          echo ""
          echo "All other check runs completed. Conclusions:"
          # `.conclusion // .status` so an ADVISORY check that is still running
          # or has vanished (#3018) prints `in_progress` / `vanished` instead
          # of a bare `null` — the loop is allowed to break on those, and the
          # log must say which of the two it was.
          echo "$others" | jq -r '"  - \(.name): \(.conclusion // .status)"' | sort -u

          # A real failure flips the gate red. `skipped`/`neutral`/`success`
          # all pass — path-filtered-out jobs report `skipped`.
          #
          # `stale` is NOT treated as a failure: GitHub marks a check run
          # `stale` when a newer commit (or `cancel-in-progress`) supersedes
          # its run. The current head SHA always gets a fresh run, so a
          # `stale` conclusion on this SHA's checks is noise, not a defect —
          # treating it as red would flip `CI Gate` red on an otherwise
          # green PR.
          #
          # `action_required` is NOT treated as a failure (#1543): it is the
          # fork-PR awaiting-maintainer-approval state, handled as pending in
          # the wait loop above. The loop only breaks once no check is in
          # `action_required` any more, so it cannot reach this set — but it
          # is excluded here too for defence in depth.
          #
          # ADVISORY EXCLUSION (#1984): a check run whose name CONTAINS any
          # ADVISORY_CHECKS substring is dropped from the failure decision
          # for EVERY conclusion (`failure`/`cancelled`/`timed_out` all
          # included). An advisory check — e.g. `Coverage (advisory)` — that
          # is concurrency-CANCELLED must not red-light the gate.
          #
          # The actual pass/fail decision is delegated to the standalone
          # `.github/scripts/ci-gate-aggregate.sh` so it is unit-tested in
          # isolation (test-ci-gate-aggregation.sh covers the #1984
          # CANCELLED-advisory case). The helper takes `<conclusion>\t<name>`
          # on stdin, `ADVISORY_CHECKS` from the env, prints the gating
          # failures, and exits 0 (pass) / 1 (fail).
          set +e
          failed=$(echo "$others" \
            | jq -r '[.conclusion // "", .name] | @tsv' \
            | ADVISORY_CHECKS="$advisory_checks" bash .github/scripts/ci-gate-aggregate.sh)
          gate_rc=$?
          set -e

          if [ "$gate_rc" -ne 0 ]; then
            echo ""
            echo "::error::One or more required CI checks failed:"
            echo "$failed" | sed '/^[[:space:]]*$/d' | sort -u \
              | while IFS= read -r n; do echo "  - $n"; done
            exit 1
          fi

          echo ""
          echo "CI Gate passed — every CI check succeeded or was skipped."
