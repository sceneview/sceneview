name: Bridge iOS Compile

# Compile-checks the Flutter plugin's iOS Swift bridge code against the REAL
# `SceneViewSwift` public API.
#
# Why a dedicated workflow (issue #2065): no existing job ever compiled the
# Flutter plugin's iOS target, so `SceneViewSwiftUIWrapper` drifted to APIs
# that do not exist on `SceneViewSwift` (`ModelNode(path)`, `ForEach` inside
# `@NodeBuilder`) and the bridge silently never compiled. This guard makes that
# class of regression fail the PR.
#
# Approach — a `swiftc -typecheck`, not a full `flutter build ios`:
#   * The Flutter plugin consumes `SceneViewSwift` via SPM, which CocoaPods
#     does not natively integrate — a full `flutter build ios` would need the
#     example app's `ios/` platform folder scaffolded AND the SPM dependency
#     wired into a generated `.xcodeproj`. That is heavy and flaky.
#   * A type-check builds `SceneViewSwift` for the iOS Simulator, then
#     `swiftc -typecheck`s the plugin's `Classes/*.swift` against the built
#     `.swiftmodule` plus the `Flutter.framework` that ships with the Flutter
#     SDK. It catches exactly the #2065 regression — Swift code referencing a
#     non-existent SceneViewSwift symbol — with no simulator, no CocoaPods,
#     and no generated project. Fast and deterministic.
#
# Limitation (documented honestly): a type-check does not exercise CocoaPods
# integration or the Obj-C plugin-registration glue. It DOES guarantee the
# bridge's Swift compiles against the published SceneViewSwift API surface,
# which is the regression #2065 is about.

on:
  push:
    branches: [main]
    paths:
      - 'flutter/sceneview_flutter/ios/**'
      - 'SceneViewSwift/**'
      - '.github/workflows/bridge-ios-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter/sceneview_flutter/ios/**'
      - 'SceneViewSwift/**'
      - '.github/workflows/bridge-ios-compile.yml'
  workflow_dispatch:

concurrency:
  group: bridge-ios-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-ios-bridge:
    name: Flutter iOS bridge type-check
    # Routes to Thomas's self-hosted Mac (label `sceneview-mac`) when the
    # heartbeat reports it online, falls back to `macos-15` otherwise. See
    # CLAUDE.md → "Self-hosted macOS runner (opt-in)" for the full pattern
    # and `.claude/scripts/setup-self-hosted-runner.sh` for the installer.
    # This is the first workflow opted in (pilot, low traffic by design).
    runs-on: ${{ vars.SELF_HOSTED_MACOS_ONLINE == 'true' && 'sceneview-mac' || 'macos-15' }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        # Use DEVELOPER_DIR env var (Apple-canonical) instead of `sudo
        # xcode-select -s`. The sudo form requires NOPASSWD configured in
        # /etc/sudoers, which GitHub-hosted runners provide but self-hosted
        # macOS runners do not — running in a launchd context with no TTY
        # makes sudo fail with `a password is required` and the step exits 1
        # (run id 26418464635 on sceneview-mac).
        # DEVELOPER_DIR works on both hosted and self-hosted, no sudo needed.
        run: |
          for cand in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode.app; do
            if [ -d "$cand" ]; then
              echo "DEVELOPER_DIR=$cand/Contents/Developer" >> "$GITHUB_ENV"
              echo "Using Xcode: $cand"
              "$cand/Contents/Developer/usr/bin/xcodebuild" -version
              exit 0
            fi
          done
          echo "::error::No Xcode installation found in /Applications/"
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache SceneViewSwift build
        uses: actions/cache@v6
        with:
          path: SceneViewSwift/.build
          key: bridge-ios-spm-${{ runner.os }}-${{ hashFiles('SceneViewSwift/Package.resolved') }}
          restore-keys: |
            bridge-ios-spm-${{ runner.os }}-

      # Build SceneViewSwift for the iOS Simulator so the bridge type-check has
      # a real `.swiftmodule` to import.
      #
      # xcpretty only PRETTY-PRINTS — it is not a build tool, and it is optional.
      # This job routes to the self-hosted `sceneview-mac` runner, where the
      # xcpretty gem may be absent; piping xcodebuild into a MISSING command
      # makes a verbose xcodebuild take SIGPIPE (exit 141) once the pipe buffer
      # fills, so the old `| xcpretty ... || exit ${PIPESTATUS[0]}` form failed
      # the step on a perfectly good build (the "missing xcpretty is tolerated"
      # claim was false). Detect xcpretty first, run xcodebuild RAW when it is
      # absent, capture the REAL xcodebuild exit code in a variable, and act on
      # that — never an `exit` inline in the pipe. (#2878/#2865 replaced the
      # `|| cat` that swallowed failures; this closes the xcpretty-absent hole
      # an advisory cross-vendor review flagged.)
      - name: Build SceneViewSwift (iOS Simulator)
        working-directory: SceneViewSwift
        run: |
          set -o pipefail
          # ONLY_ACTIVE_ARCH=NO forces a fat build (arm64 + x86_64) regardless of
          # whether the runner is Apple Silicon or Intel. Without it, macos-15 Intel
          # runners produce only an x86_64 .swiftmodule and the arm64 type-check step
          # fails with "could not find module 'SceneViewSwift' for target arm64…;
          # found: x86_64-apple-ios-simulator". See #2223.
          run_xcodebuild() {
            xcodebuild build \
              -scheme SceneViewSwift \
              -destination 'generic/platform=iOS Simulator' \
              -skipMacroValidation \
              -derivedDataPath "$RUNNER_TEMP/sv-dd" \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64 x86_64"
          }
          # The trailing `|| STATUS=...` keeps errexit (GitHub's default
          # `bash -eo pipefail`) from bailing out of the pipe before we read the
          # code, and captures xcodebuild's REAL exit (`PIPESTATUS[0]`, not
          # xcpretty's) so a xcpretty that is absent or merely crashes on a build
          # that SUCCEEDED never turns the step red.
          STATUS=0
          if command -v xcpretty >/dev/null 2>&1; then
            run_xcodebuild | xcpretty --color 2>/dev/null || STATUS=${PIPESTATUS[0]}
          else
            run_xcodebuild || STATUS=$?
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::SceneViewSwift build failed (xcodebuild exit $STATUS)."
            exit "$STATUS"
          fi

      # Type-check the Flutter plugin's iOS Swift against the built
      # SceneViewSwift module + the Flutter.framework that ships with the SDK.
      # A reference to a non-existent SceneViewSwift symbol fails here.
      - name: Type-check Flutter iOS bridge
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SV_MODULE="$RUNNER_TEMP/sv-dd/Build/Products/Debug-iphonesimulator"

          # Detect the native runner arch to pick the matching simulator target.
          # arm64 on Apple Silicon runners, x86_64 on Intel runners.
          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" = "arm64" ]; then
            SIM_TARGET="arm64-apple-ios18.0-simulator"
          else
            SIM_TARGET="x86_64-apple-ios18.0-simulator"
          fi
          echo "Runner arch: $RUNNER_ARCH  →  simulator target: $SIM_TARGET"

          # Locate the simulator slice of the Flutter engine xcframework that
          # ships inside the Flutter SDK cache. The path is engine-revision
          # independent — resolved via `flutter` so it tracks the SDK in use.
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          FLUTTER_FW=""
          for cand in \
            "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework" \
            "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/Flutter.xcframework"; do
            if [ -d "$cand" ]; then FLUTTER_FW="$cand"; break; fi
          done
          if [ -z "$FLUTTER_FW" ]; then
            # `flutter precache --ios` populates the iOS engine artifacts.
            flutter precache --ios
            FLUTTER_FW="$FLUTTER_ROOT/bin/cache/artifacts/engine/ios/Flutter.xcframework"
          fi
          FLUTTER_SIM_FW="$(find "$FLUTTER_FW" -maxdepth 1 -type d -name 'ios-*simulator*' | head -1)"
          echo "SceneViewSwift module dir: $SV_MODULE"
          echo "Flutter simulator framework: $FLUTTER_SIM_FW"

          # Type-check every Swift file in the plugin's iOS Classes/ folder.
          # `-typecheck` performs full semantic analysis (the #2065 errors are
          # semantic, not syntactic) without emitting object code. Swift 5
          # language mode matches the podspec's `swift_version = '5.9'`.
          swiftc -typecheck \
            -swift-version 5 \
            -sdk "$SDK" \
            -target "$SIM_TARGET" \
            -F "$FLUTTER_SIM_FW" \
            -I "$SV_MODULE" \
            -L "$SV_MODULE" \
            flutter/sceneview_flutter/ios/Classes/*.swift

          echo "✅ Flutter iOS bridge type-checks against the real SceneViewSwift API."
