# tag-release.yml — safety net + manual handle for the release-fast tag step.
#
# The PRIMARY tagger is now release-fast.yml's own `tag` job (#3358): it waits
# for the release PR it opened to merge and tags the merge commit itself. That
# removes the event chain entirely, because the auto-merge is performed with the
# default `GITHUB_TOKEN` and GitHub emits NO workflow events for pushes made
# with that token — this workflow's `on: push` trigger simply never fired for an
# auto-merged release PR, and v4.33.0 sat bumped-but-untagged until a human
# noticed.
#
# This workflow remains for the two cases release-fast cannot cover:
#   * a HUMAN merges the release PR (a human merge IS a real push event, and it
#     may land after release-fast's waiting job has already timed out);
#   * `workflow_dispatch` — a manual recovery handle when a release did land
#     untagged for any other reason. The usual one (#3750): release-fast's `tag`
#     job went red while the PR waited, then the PR auto-merged. That merge is
#     GITHUB_TOKEN work, so the `push` trigger below never fires for it, and by
#     the time someone dispatches this, main has usually moved on — HEAD is no
#     longer the release commit and the script would exit 0 with "not a release
#     commit". So pass the merge commit explicitly:
#       gh workflow run tag-release.yml -f commit=<release PR merge commit sha>
#     (`gh pr view release/vX.Y.Z --json mergeCommit -q .mergeCommit.oid`).
#     Left empty, the dispatch tags HEAD of the dispatched ref, as before.
#
# The decision logic lives in `.claude/scripts/tag-release.sh`, shared with
# release-fast so the two callers cannot drift. It is idempotent: it fires ONLY
# on a HEAD commit matching the release-fast commit shape whose version matches
# gradle.properties, and an already-existing tag is a no-op, never a move.
name: Tag release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Release merge commit SHA on main (empty = HEAD of the dispatched ref)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag merged release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The input reaches the shell through an env var only, and must be a bare
      # hex SHA already on main: tagging a commit from another branch would
      # publish a release that never went through main's required checks.
      - name: Detect release commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -z "$COMMIT" ]; then
            bash .claude/scripts/tag-release.sh
            exit 0
          fi
          echo "$COMMIT" | grep -qE '^[0-9a-f]{7,40}$' \
            || { echo "::error::commit must be a hex SHA, got '$COMMIT'"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$COMMIT is not on origin/main — refusing to tag"; exit 1; }
          bash .claude/scripts/tag-release.sh "$COMMIT"
