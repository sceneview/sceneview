name: iOS CI

on:
  # `sceneview-core/**` is shared KMP logic consumed by the Apple
  # (RealityKit) renderer, so an iOS-affecting core change must re-run
  # iOS CI — it also triggers Android CI in ci.yml's path filter. See #1295.
  push:
    branches: [main]
    paths:
      - 'SceneViewSwift/**'
      - 'samples/ios-demo/**'
      - 'sceneview-core/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SceneViewSwift/**'
      - 'samples/ios-demo/**'
      - 'sceneview-core/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (iOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Using Xcode: $(xcode-select -p)"
          xcodebuild -version

      # Wait for CoreSimulator, then resolve the simulator ONCE by UDID and
      # reuse it for every xcodebuild below (#3174).
      #
      # The WAIT is the actual fix. "Unable to find a device matching the
      # provided destination specifier" reads like a missing device; it is not.
      # On run 31807717171 attempt 1, inside ONE job on one runner: step 5 died
      # on `iPhone 16 Pro` at 14:07:45 with no concrete simulator in the
      # available-destination list, and 16 s later step 10 resolved that same
      # device — `id:DB7A4F45-…, OS:26.2` — and went green. The device was there;
      # CoreSimulator had not finished enumerating it. Reruns "fix" it, which is
      # why this looks like flakiness.
      #
      # Resolving by UDID is the second, smaller half: `Select Xcode` above walks
      # a preference list, and a `name=iPhone <model>` pin is a promise about a
      # machine we do not own. Doing both here also means a genuinely
      # simulator-less runner fails on this step, naming the cause, instead of
      # three xcodebuilds each blaming their own scheme.
      #
      # ⛔ Do not "simplify" this to a single `simctl list`. Called at the top of
      # a job it lands squarely in the cold window, and a resolver that gave up
      # there would kill the whole job where today one step dies and the rest
      # still runs.
      - name: Resolve an iOS Simulator destination
        run: |
          set -euo pipefail
          . .claude/scripts/lib/ios-simulator.sh
          # ⛔ The assignment is load-bearing — do NOT fold it back into
          # `echo "IOS_DEST=$(ios_simulator_destination)" >> "$GITHUB_ENV"`.
          # Under `set -e` a command substitution that fails inside another
          # command's ARGUMENTS does not abort the shell: echo's own status (0)
          # governs, and there is no pipe for `pipefail` to see. That form wrote
          # an empty IOS_DEST and exited 0 on a simulator-less runner — throwing
          # away the fail-closed guarantee this whole file exists to provide.
          # Only the assignment form propagates the resolver's exit code.
          IOS_DEST="$(ios_simulator_destination)"
          printf 'IOS_DEST=%s\n' "$IOS_DEST" >> "$GITHUB_ENV"

      - name: Cache Swift Package dependencies
        uses: actions/cache@v6
        with:
          path: SceneViewSwift/.build
          key: spm-${{ runner.os }}-${{ hashFiles('SceneViewSwift/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build Swift Package (iOS)
        working-directory: SceneViewSwift
        run: |
          # `set -o pipefail` + `|| exit ${PIPESTATUS[0]}` propagate a failing
          # xcodebuild's exit code. The old `|| cat` tail DEFEATED pipefail:
          # `cat` reads CI's empty stdin and exits 0, so the step stayed green
          # through real build/test failures (#2878, #2865). `PIPESTATUS[0]` is
          # xcodebuild's code — not xcpretty's — so a missing xcpretty is still
          # tolerated (xcodebuild OK → 0 → step green). See #1515.
          set -o pipefail
          xcodebuild build \
            -scheme SceneViewSwift \
            -destination "$IOS_DEST" \
            -skipMacroValidation \
            | xcpretty --color 2>/dev/null || exit ${PIPESTATUS[0]}

      # Build the visionOS target so a visionOS-only API breakage can't slip
      # into main silently (#1366 — the xrOS target was broken on main for
      # multiple releases because no CI job built it). `swift build` against
      # the XROS SDK does not need the visionOS simulator runtime installed
      # on the runner — only the SDK, which ships with Xcode — so this works
      # on a stock `macos-15` image without a `Download visionOS platform`
      # step. If the SDK is genuinely absent the step fails loudly rather
      # than skipping (no `|| true`).
      - name: Build Swift Package (visionOS)
        working-directory: SceneViewSwift
        run: |
          set -o pipefail
          XROS_SDK="$(xcrun --sdk xros --show-sdk-path)"
          echo "visionOS SDK: $XROS_SDK"
          swift build \
            --sdk "$XROS_SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-xros2.0

      - name: Run tests
        working-directory: SceneViewSwift
        run: |
          # `pipefail` so an iOS-simulator test-build failure actually fails
          # CI — without it the AugmentedImageNodeTests breakage in #1515
          # slipped past a "green" run.
          set -o pipefail
          xcodebuild test \
            -scheme SceneViewSwift \
            -destination "$IOS_DEST" \
            -skipMacroValidation \
            | xcpretty --color 2>/dev/null || exit ${PIPESTATUS[0]}

      # Build the iOS sample demo so a missing pbxproj registration on a new
      # demo file fails the PR instead of slipping into main. Caught by
      # Thomas's "tester visuellement impérativement" rule on PR #1042 (file
      # added but not in pbxproj → main broken until 74dccb56). Closes #1044.
      #
      # `if: always()` on all three steps so the demo build runs even when
      # the SwiftPM tests above flake — pbxproj regressions are orthogonal
      # to test correctness, and flaky simulator tests should not hide
      # demo build failures. The overall job status still goes red if any
      # step fails (no `continue-on-error: true`), so a real test failure
      # still blocks merge — this just ensures both signals are surfaced.
      - name: Cache iOS demo Swift Package dependencies
        if: always()
        uses: actions/cache@v6
        with:
          path: samples/ios-demo/SourcePackages
          # `hashFiles()` must point at a file that exists at checkout time
          # (#1360). The previous key targeted the workspace-scoped
          # `xcshareddata/swiftpm/Package.resolved`, which Xcode only writes
          # *during* `-resolvePackageDependencies` — so on a clean runner
          # the file is absent, `hashFiles()` returns an empty string, and
          # the key is the constant `spm-<os>-demo-` for every run (no cache
          # invalidation when dependencies change). The checked-in resolved
          # file lives at `samples/ios-demo/Package.resolved`; hash that.
          key: spm-${{ runner.os }}-demo-${{ hashFiles('samples/ios-demo/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-demo-

      - name: Resolve iOS demo dependencies
        if: always()
        working-directory: samples/ios-demo
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme SceneViewDemo \
            -project SceneViewDemo.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build & test iOS sample demo (catches missing pbxproj entries)
        if: always()
        # `xcodebuild test` builds the demo AND runs the `SceneViewDemoTests`
        # unit-test target (wired in #1227) — so a missing pbxproj registration
        # on a new demo file still fails the PR, and the AppStoreUpdater tests
        # now run on every PR.
        #
        # Inject `SKETCHFAB_API_KEY` so the `Info.plist` placeholder
        # substitution path (introduced for #1157) is exercised on every CI
        # build, not just on `xcodebuild archive` in `app-store.yml`. Forks
        # without the secret get an empty string — `SketchfabConfig.swift`
        # silently falls back to `nil`, matching the existing graceful
        # degradation in `ExploreTab.swift`.
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        working-directory: samples/ios-demo
        run: |
          # `pipefail` so a failing xcodebuild is not masked by xcpretty — #1515.
          set -o pipefail
          xcodebuild test \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemo \
            -destination "$IOS_DEST" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SKETCHFAB_API_KEY="$SKETCHFAB_API_KEY" \
            | xcpretty --color 2>/dev/null || exit ${PIPESTATUS[0]}

      # #2852 — the step above CANNOT see the AR code. Every AR demo wraps its
      # real ARKit/RealityKit logic in `#if !targetEnvironment(simulator)`
      # (14 files under `Views/Demos/` at the time of writing), because ARKit
      # world tracking does not run on a Simulator. A Simulator destination
      # therefore strips that branch before the compiler ever sees it: a type
      # error, a renamed API or a bad call inside those blocks passes CI green
      # and lands on main. Until this step existed, the FIRST compile of that
      # code happened in `app-store.yml`'s `xcodebuild archive` — i.e. during a
      # release, behind signing secrets. The worst possible moment to find out.
      #
      # `CODE_SIGNING_ALLOWED=NO` is what lets a device destination build with
      # no certificates, so this runs on forks and on stock runners. Build-only
      # on purpose: compiling AR code is not running it, and this step makes no
      # claim about runtime behaviour — that still needs a physical device.
      # NOTE: the name is quoted on purpose — an unquoted ` #2852` would start a
      # YAML comment and the issue reference would vanish from the step name.
      - name: "Compile the device code path (no signing) — #2852"
        if: always()
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        working-directory: samples/ios-demo
        run: |
          # `pipefail` so a failing xcodebuild is not masked by xcpretty — #1515.
          set -o pipefail
          xcodebuild build \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemo \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKETCHFAB_API_KEY="$SKETCHFAB_API_KEY" \
            | xcpretty --color 2>/dev/null || exit ${PIPESTATUS[0]}
