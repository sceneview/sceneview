name: Daily Maintenance

on:
  schedule:
    # 07:11 UTC daily. Deliberately OFF the top-of-hour: GitHub queues all
    # `0 * * * *` crons in one burst and drops the overflow on busy
    # infrastructure, so `0 7 * * *` runs were silently skipped (#1646).
    # Editing this `schedule:` block also re-registers the cron under the
    # committing account — the original registration was bound to an account
    # that is no longer active, which is why this workflow had never fired
    # on schedule despite being marked active. Keep it distinct from
    # nightly-ci.yml (04:00 UTC).
    - cron: '11 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. Dependency version check ───────────────────────────────────────────
  check-deps:
    name: Check dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest versions
        id: versions
        run: |
          FILAMENT_LATEST=$(curl -sf https://api.github.com/repos/google/filament/releases/latest | jq -r .tag_name | tr -d 'v' || echo "unknown")
          ARCORE_LATEST=$(curl -sf https://api.github.com/repos/google-ar/arcore-android-sdk/releases/latest | jq -r .tag_name | tr -d 'v' || echo "unknown")
          KOTLIN_LATEST=$(curl -sf https://api.github.com/repos/JetBrains/kotlin/releases/latest | jq -r .tag_name | tr -d 'v' || echo "unknown")

          FILAMENT_CURRENT=$(grep '^filament ' gradle/libs.versions.toml 2>/dev/null | head -1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "unknown")
          KOTLIN_CURRENT=$(grep '^kotlin ' gradle/libs.versions.toml 2>/dev/null | head -1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "unknown")
          ARCORE_CURRENT=$(grep '^arCore ' gradle/libs.versions.toml 2>/dev/null | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || echo "unknown")

          echo "filament_latest=$FILAMENT_LATEST" >> $GITHUB_OUTPUT
          echo "filament_current=$FILAMENT_CURRENT" >> $GITHUB_OUTPUT
          echo "arcore_latest=$ARCORE_LATEST" >> $GITHUB_OUTPUT
          echo "arcore_current=$ARCORE_CURRENT" >> $GITHUB_OUTPUT
          echo "kotlin_latest=$KOTLIN_LATEST" >> $GITHUB_OUTPUT
          echo "kotlin_current=$KOTLIN_CURRENT" >> $GITHUB_OUTPUT

      - name: Report dependency status and open issue if outdated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILAMENT_CURRENT="${{ steps.versions.outputs.filament_current }}"
          FILAMENT_LATEST="${{ steps.versions.outputs.filament_latest }}"
          ARCORE_CURRENT="${{ steps.versions.outputs.arcore_current }}"
          ARCORE_LATEST="${{ steps.versions.outputs.arcore_latest }}"
          KOTLIN_CURRENT="${{ steps.versions.outputs.kotlin_current }}"
          KOTLIN_LATEST="${{ steps.versions.outputs.kotlin_latest }}"

          echo "## Dependency status -- $(date +%Y-%m-%d)"
          printf "| %-12s | %-10s | %-10s | %-8s |\n" "Dependency" "Current" "Latest" "Status"
          printf "|%s|%s|%s|%s|\n" "$(printf '%0.s-' {1..14})" "$(printf '%0.s-' {1..12})" "$(printf '%0.s-' {1..12})" "$(printf '%0.s-' {1..10})"

          OUTDATED=()

          if [ "$FILAMENT_CURRENT" != "unknown" ] && [ "$FILAMENT_LATEST" != "unknown" ] && [ "$FILAMENT_CURRENT" != "$FILAMENT_LATEST" ]; then
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "Filament" "$FILAMENT_CURRENT" "$FILAMENT_LATEST" "OUTDATED"
            OUTDATED+=("Filament $FILAMENT_CURRENT -> $FILAMENT_LATEST")
          else
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "Filament" "$FILAMENT_CURRENT" "$FILAMENT_LATEST" "ok"
          fi

          if [ "$ARCORE_CURRENT" != "unknown" ] && [ "$ARCORE_LATEST" != "unknown" ] && [ "$ARCORE_CURRENT" != "$ARCORE_LATEST" ]; then
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "ARCore" "$ARCORE_CURRENT" "$ARCORE_LATEST" "OUTDATED"
            OUTDATED+=("ARCore $ARCORE_CURRENT -> $ARCORE_LATEST")
          else
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "ARCore" "$ARCORE_CURRENT" "$ARCORE_LATEST" "ok"
          fi

          if [ "$KOTLIN_CURRENT" != "unknown" ] && [ "$KOTLIN_LATEST" != "unknown" ] && [ "$KOTLIN_CURRENT" != "$KOTLIN_LATEST" ]; then
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "Kotlin" "$KOTLIN_CURRENT" "$KOTLIN_LATEST" "OUTDATED"
            OUTDATED+=("Kotlin $KOTLIN_CURRENT -> $KOTLIN_LATEST")
          else
            printf "| %-12s | %-10s | %-10s | %-8s |\n" "Kotlin" "$KOTLIN_CURRENT" "$KOTLIN_LATEST" "ok"
          fi

          if [ ${#OUTDATED[@]} -gt 0 ]; then
            OUTDATED_LIST=$(printf '%s\n' "${OUTDATED[@]}")
            ISSUE_TITLE="Dependency updates available -- $(date +%Y-%m-%d)"
            EXISTING=$(gh issue list --state open --search "Dependency updates available" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --title "$ISSUE_TITLE" \
                --body "Automated maintenance detected outdated dependencies on $(date +%Y-%m-%d):

          $OUTDATED_LIST

          Please evaluate each upgrade for compatibility with the current SceneView API surface." \
                || echo "::warning::Could not create dependency issue"
            else
              echo "Dependency issue #$EXISTING already exists -- skipping."
            fi
          fi

  # ── 2. Stale issue detection ───────────────────────────────────────────────
  stale:
    name: Mark stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been open for 30 days with no activity.
            If it is still relevant, please leave a comment — otherwise it will be closed in 7 days.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if the issue is still relevant.
          stale-pr-message: >
            This PR has been open for 30 days with no activity.
            Please rebase and update — it will be closed in 7 days if there is no response.
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: 'pinned,roadmap,in-progress'
          exempt-pr-labels: 'pinned'

  # ── 3. SceneView agent skill drift ────────────────────────────────────────
  # Catches the case where a library API was renamed/removed between releases
  # without updating `agents/sceneview/` (the published agent skill). Daily
  # cadence is enough — the same check also runs on every PR via ci.yml's
  # `repo-hygiene` job.
  skill-drift:
    name: SceneView agent skill drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Run skill drift check
        id: drift
        shell: bash
        run: |
          if bash .claude/scripts/check-sceneview-skill.sh > skill-drift.log 2>&1; then
            echo "drift=0" >> $GITHUB_OUTPUT
          else
            echo "drift=1" >> $GITHUB_OUTPUT
            cat skill-drift.log
          fi

      - name: Open or update tracking issue
        if: steps.drift.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "Agent skill drift detected" --json number --jq '.[0].number' 2>/dev/null || echo "")
          BODY=$'Daily maintenance detected drift between `agents/sceneview/` and the SceneView library source.\n\n```\n'"$(cat skill-drift.log)"$'\n```\n\nRun `bash .claude/scripts/check-sceneview-skill.sh` locally and update the skill from real demos / `llms.txt`.'
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Agent skill drift detected — $(date +%Y-%m-%d)" \
              --body "$BODY" \
              --label "agent-skill,maintenance" \
              || echo "::warning::Could not create skill drift issue"
          else
            gh issue comment "$EXISTING" --body "$BODY" \
              || echo "::warning::Could not comment on existing skill drift issue #$EXISTING"
          fi

      - name: Close the tracking issue once the skill is back in sync
        if: steps.drift.outputs.drift == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unambiguous here, unlike the store jobs: check-sceneview-skill.sh
          # runs with no credentials and no network dependency, so its exit 0
          # is a real pass — a crash exits non-zero and files an issue instead.
          bash .claude/scripts/close-maintenance-issue.sh \
            "Agent skill drift detected" \
            "\`check-sceneview-skill.sh\` passes again — \`agents/sceneview/\` matches the library source. Closed automatically by \`maintenance.yml\`; it re-files itself if the skill drifts again."

  # ── 4. CI health summary ──────────────────────────────────────────────────
  ci-health:
    name: CI health check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check recent CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only count failures from the 'build' job (not flaky ar-emulator)
          FAILURES=$(gh run list --workflow=ci.yml --limit 7 --json conclusion,createdAt,name \
            | jq '[.[] | select(.conclusion == "failure")] | length')
          echo "CI failures in last 7 runs: $FAILURES"
          # Raised threshold: ar-emulator is continue-on-error so only
          # true build failures count now. Threshold = 4 to avoid noise.
          if [ "$FAILURES" -gt 4 ]; then
            echo "::warning::CI is consistently failing -- $FAILURES failures in last 7 runs"
            EXISTING=$(gh issue list --state open --search "CI health:" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --title "CI health: $FAILURES failures in last 7 runs -- $(date +%Y-%m-%d)" \
                --body "Automated maintenance detected $FAILURES CI failures in the last 7 runs. Please investigate the ci.yml workflow." \
                || echo "::warning::Could not create CI health issue"
            else
              echo "CI health issue #$EXISTING already open -- skipping duplicate."
            fi
          else
            echo "CI health OK ($FAILURES/7 failures)"
          fi

  # ── 5. Structured maintenance digest (report-only /maintain mirror) ───────
  # Reproduces the *observable* signals of the `/maintain` Claude Code skill
  # (CI health, open issues/PRs, dependency drift, version sync, quality
  # signals, release decision) as a single structured report. It is strictly
  # READ-ONLY — the skill itself takes actions (commits, labels, AVD rebuilds)
  # which are unsafe to run unattended in CI, so this job only observes.
  # Output goes to the step-summary AND a single auto-updated tracking issue
  # so the digest is browsable day to day. Non-blocking: the report script
  # always exits 0, and the issue post is best-effort.
  maintenance-report:
    name: Daily maintenance digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write       # post/update the digest tracking issue
      pull-requests: read # the script counts open PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # release decision needs the full tag history

      - name: Generate maintenance digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .claude/scripts/maintenance-report.sh -o maintenance-report.md

      - name: Post or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIGEST_TITLE="Daily maintenance digest"
          BODY="$(cat maintenance-report.md)"
          # Find an existing open digest issue (best-effort).
          EXISTING=$(gh issue list --state open --search "$DIGEST_TITLE in:title" \
            --label maintenance --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "$DIGEST_TITLE" \
              --body "$BODY" \
              --label "maintenance,ci" \
              || echo "::warning::Could not create maintenance digest issue"
          else
            # Overwrite the body so the issue always shows the latest digest,
            # and add a short dated comment so the history stays visible.
            gh issue edit "$EXISTING" --body "$BODY" \
              || echo "::warning::Could not update digest issue #$EXISTING"
            gh issue comment "$EXISTING" \
              --body "Digest refreshed — $(date -u +%Y-%m-%d). See the issue body for the latest table." \
              || echo "::warning::Could not comment on digest issue #$EXISTING"
          fi

  # ── 5b. Digest → actionable tasks ─────────────────────────────────────────
  # The digest above is a REPORT: it re-writes one issue body every day, which
  # means a real anomaly (CI red for three days, a dependency four minors
  # behind, a stale published artifact) has to be noticed by a human reading a
  # table. This job closes that loop — it turns anomalies into individually
  # actionable, de-duplicated issues that can be picked up by the issue-batch
  # pipeline without anyone reading the digest first.
  #
  # ⛔ ANTI-SPAM IS THE WHOLE DESIGN CONSTRAINT.
  #   An agent with `issues: write` on a daily cron is a burst waiting to
  #   happen, and the repo's rule is explicit that issue/PR bursts are never
  #   acceptable. Three guards, in order of strength:
  #     1. A hard cap of MAX_NEW_ISSUES per run, stated in the prompt AND
  #        verified afterwards by a deterministic step that reddens the run if
  #        it was exceeded (the prompt is a request; the check is the measure).
  #     2. Mandatory de-duplication against open issues carrying the same
  #        `auto-filed` label before anything is created.
  #     3. "Anomaly only" — a healthy repo produces ZERO issues. An empty run
  #        is the expected outcome most days, not a failure.
  #
  # Issues filed here use GITHUB_TOKEN, whose events do not re-trigger
  # workflows, so this cannot feed itself through issue-intake.yml's triage.
  digest-to-tasks:
    name: File actionable maintenance tasks
    needs: maintenance-report
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      MAX_NEW_ISSUES: '3'
    steps:
      - name: Check agent credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No tasks filed::CLAUDE_CODE_OAUTH_TOKEN missing or expired — the digest was still posted, but no actionable issues were filed from it."
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.has_token == 'true'
        with:
          fetch-depth: 0

      # Count before, count after — the cap is measured, not trusted.
      #
      # The label is created here, not left to the agent: the prompt forbids
      # creating labels (so a hallucinated label can never enter the repo), and
      # `auto-filed` did not exist when this job was written. Without this step
      # the agent would file issues carrying no `auto-filed` label at all, the
      # before/after count would read 0 → 0 forever, and the cap enforcement
      # below would be a guard that measures nothing. `gh label create` is
      # idempotent enough here — it fails loudly only on a real API problem,
      # and an already-existing label is a no-op we swallow deliberately.
      - name: Ensure label and count existing auto-filed issues
        id: before
        if: steps.creds.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create auto-filed \
            --description "Opened automatically by the daily maintenance agent — verify before acting" \
            --color BFD4F2 2>/dev/null \
            || echo "label 'auto-filed' already exists (or could not be created) — continuing"
          N="$(gh issue list --state open --label auto-filed --limit 200 --json number --jq 'length')"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "Open auto-filed issues before this run: $N"

      - name: File actionable tasks
        if: steps.creds.outputs.has_token == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-8'
          prompt: |
            You convert SceneView's daily maintenance signal into actionable
            work. You do NOT fix anything — you file well-scoped issues, and
            only for genuine anomalies.

            ## Read the state

            Run `bash .claude/scripts/maintenance-report.sh` and read its
            output. Cross-check anything it flags against reality before acting
            on it — `gh run list --limit 20`, `gh issue list --state open`,
            `git log --oneline --since="7 days ago"`, the relevant file in the
            tree. A digest line is a lead, not a finding.

            ## Hard limits — these are not suggestions

            - **File AT MOST 3 new issues in this run.** If you find more, file
              the 3 highest-impact and mention the rest in the body of the most
              related one. A run that exceeds this reddens the workflow.
            - **De-duplicate first.** Before filing anything, run
              `gh issue list --state all --label auto-filed --limit 100` AND a
              text search for the specific symptom. If an open issue already
              covers it, add a dated comment with what changed instead of
              opening a second one. Never re-file something that is merely
              still unfixed.
            - **Anomaly only.** If the repo is healthy, file NOTHING and say so
              in your final message. Zero issues is the normal outcome. Do not
              manufacture work to look useful — an issue nobody needed costs
              more attention than it saves.
            - Do not file for anything already covered by a dedicated daily job
              (store listing drift, ASC listing drift, MCP npm freshness,
              Play reviews, doc drift) — those open their own tracked issues.

            ## What qualifies

            A concrete, fixable regression or drift with a clear owner-surface:
            CI red on `main` for more than one run in a row; a dependency far
            enough behind to matter (with the specific version gap); a published
            artifact lagging `VERSION_NAME`; a script or workflow failing
            repeatedly; a stale generated file. Ambiguity, design questions, and
            "we should consider…" are NOT issues — leave them out.

            ## Issue shape

            Title: imperative and specific ("Bump Filament 1.62.4 → 1.63.1", not
            "Dependency update"). Body: what the signal was, the evidence
            (command output, run URL, file:line), why it matters, and the
            smallest next step. Apply the labels `auto-filed` and `maintenance`
            plus any existing `module:*`/`platform:*` label that fits — check
            `gh label list --limit 200` and never create a label.

            Finish with a one-line summary: how many issues you filed and why.

      # The cap is enforced here, deterministically. The prompt asked; this
      # measures. A burst reddens the daily run so it cannot pass unnoticed.
      - name: Enforce the issue cap
        if: steps.creds.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          set -euo pipefail
          AFTER="$(gh issue list --state open --label auto-filed --limit 200 --json number --jq 'length')"
          NEW=$(( AFTER - BEFORE ))
          echo "Open auto-filed issues: $BEFORE -> $AFTER (net +$NEW, cap $MAX_NEW_ISSUES)"
          {
            echo "### Maintenance tasks filed"
            echo
            echo "Open \`auto-filed\` issues: **$BEFORE → $AFTER** (net +$NEW, cap $MAX_NEW_ISSUES)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEW" -gt "$MAX_NEW_ISSUES" ]; then
            echo "::error title=Issue cap exceeded::The agent filed $NEW issues in one run (cap $MAX_NEW_ISSUES). Review and close the excess, then tighten the prompt."
            exit 1
          fi

  # ── 6. GitHub Pages freshness check ───────────────────────────────────────
  # The live site at https://sceneview.github.io is published by docs.yml,
  # which pushes to the external `sceneview/sceneview.github.io` repo over an
  # SSH deploy key. GitHub's legacy Pages auto-build does NOT fire for
  # bot/deploy-key pushes, so the site can silently stop rebuilding even
  # though new commits keep landing (#1826 — 13 days stuck on an old
  # version). docs.yml now force-triggers a build via the Pages API, but
  # that depends on a PAT secret being present and the API call succeeding.
  # This job is the safety net: it compares the latest commit on
  # `sceneview.github.io` against its latest Pages BUILD and alerts if the
  # site is behind by more than a day.
  pages-freshness:
    name: GitHub Pages freshness check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check sceneview.github.io build freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="sceneview/sceneview.github.io"

          # Latest commit timestamp on the published branch.
          LATEST_COMMIT_DATE=$(gh api "repos/$REPO/commits?per_page=1" \
            --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
          # Latest Pages BUILD timestamp (the actual site rebuild).
          LATEST_BUILD_DATE=$(gh api "repos/$REPO/pages/builds/latest" \
            --jq '.created_at' 2>/dev/null || echo "")

          echo "Latest commit on $REPO : ${LATEST_COMMIT_DATE:-unknown}"
          echo "Latest Pages build     : ${LATEST_BUILD_DATE:-unknown}"

          if [ -z "$LATEST_COMMIT_DATE" ] || [ -z "$LATEST_BUILD_DATE" ]; then
            echo "::warning::Could not read commit/build timestamps — skipping check."
            exit 0
          fi

          COMMIT_TS=$(date -d "$LATEST_COMMIT_DATE" +%s 2>/dev/null || echo 0)
          BUILD_TS=$(date -d "$LATEST_BUILD_DATE" +%s 2>/dev/null || echo 0)
          # Lag = how far the published build trails the latest commit.
          LAG=$(( COMMIT_TS - BUILD_TS ))
          LAG_HOURS=$(( LAG / 3600 ))
          echo "Build trails latest commit by ${LAG_HOURS}h."

          # Allow 24h of slack — a commit can land just before this cron.
          if [ "$LAG" -le 86400 ]; then
            echo "GitHub Pages is fresh."
            exit 0
          fi

          echo "::warning::sceneview.github.io has unbuilt commits for ${LAG_HOURS}h."
          TITLE="GitHub Pages build is stale — sceneview.github.io"
          BODY="Automated maintenance detected that **https://sceneview.github.io** has not rebuilt for the latest commits.

          - Latest commit on \`$REPO\`: \`$LATEST_COMMIT_DATE\`
          - Latest Pages build:          \`$LATEST_BUILD_DATE\`
          - Build trails the latest commit by **~${LAG_HOURS}h**.

          The site is serving stale content. GitHub Pages' legacy auto-build does not fire for the SSH deploy-key pushes \`docs.yml\` makes. \`docs.yml\` force-triggers a build via the Pages API after each deploy — if this issue is open, that trigger is failing.

          **To fix:** re-run \`docs.yml\` (workflow_dispatch), or manually \`gh api -X POST repos/$REPO/pages/builds\`, then confirm the \`PERSONAL_TOKEN\`/\`PAGES_REBUILD_TOKEN\` secret has \`repo\`/\`pages:write\` scope. Background: #1826."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "GitHub Pages build is stale in:title" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "bug,maintenance" \
              || echo "::warning::Could not create Pages staleness issue"
          else
            echo "Pages staleness issue #$EXISTING already open — skipping duplicate."
          fi

  # ── 7. Deep-link verification health ──────────────────────────────────────
  # The demo apps' QR-code → demo-screen flow rides on VERIFIED deep links:
  # Android App Links (`assetlinks.json` + `android:autoVerify="true"`) and
  # iOS/macOS Universal Links (`apple-app-site-association` + the `applinks:`
  # entitlement). Verification fails SILENTLY — a fingerprint rotation, a Play
  # App Signing change, a malformed AASA, or the `.well-known/*` files simply
  # not being deployed to sceneview.github.io leaves the QR flow dead with no
  # error anywhere (#1695). This job runs check-deeplink-health.sh, which
  # cross-checks the hosted `.well-known/*` files against the committed
  # source of truth and the demo apps' intent-filters / entitlements. It is
  # NON-BLOCKING: a broken/stale link config opens a single tracking issue
  # (same pattern as the Pages-freshness job above) instead of failing CI.
  deeplink-health:
    name: Deep-link verification health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Run deep-link health check
        id: deeplink
        shell: bash
        run: |
          if bash .claude/scripts/check-deeplink-health.sh > deeplink-health.log 2>&1; then
            echo "broken=0" >> $GITHUB_OUTPUT
          else
            echo "broken=1" >> $GITHUB_OUTPUT
          fi
          cat deeplink-health.log

      - name: Open or update tracking issue
        if: steps.deeplink.outputs.broken == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Deep-link verification is broken — QR → demo flow"
          BODY=$'Automated maintenance detected that the demo apps'"'"' verified deep links\nare unhealthy. App Links / Universal Links verification fails silently —\nthe QR-code → demo-screen flow falls back to a browser with no error.\n\n```\n'"$(cat deeplink-health.log)"$'\n```\n\n**To fix:**\n- Confirm `https://sceneview.github.io/.well-known/assetlinks.json` and\n  `apple-app-site-association` are deployed and reachable (the files live\n  in `website-static/.well-known/` — they must be published by `docs.yml`).\n- If fingerprints drifted, regenerate `assetlinks.json` from the current\n  Play App Signing + upload-key SHA-256 (see\n  `website-static/.well-known/README.md`).\n- Run `bash .claude/scripts/check-deeplink-health.sh` locally to reproduce.\n\nBackground: #1695.'
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Deep-link verification is broken in:title" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "bug,maintenance" \
              || echo "::warning::Could not create deep-link health issue"
          else
            echo "Deep-link health issue #$EXISTING already open — skipping duplicate."
          fi

      - name: Close the health issue once deep links verify again
        if: steps.deeplink.outputs.broken == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .claude/scripts/close-maintenance-issue.sh \
            "Deep-link verification is broken" \
            "\`check-deeplink-health.sh\` passes again — the QR → demo deep-link flow verifies. Closed automatically by \`maintenance.yml\`; it re-files itself if verification breaks again."

  # ── 8. Stale claude/* branch cleanup ──────────────────────────────────────
  # PRIMARY mechanism is the repo's "Automatically delete head branches"
  # setting (deleteBranchOnMerge) — every PR branch is dropped the instant
  # its PR merges, so no backlog accumulates in normal operation.
  # This job is the BACKSTOP for the cases that setting can't reach:
  # branches whose PR merged before the setting was on, orphan branches
  # fully merged into main with no PR (ahead=0), and merged-PR branches
  # left over from API merges. It deletes the provably-dead ones — merged
  # into origin/main (ahead=0) OR carrying a MERGED PR (squash-merge case) —
  # in a SINGLE `git push --delete` call. Branches with an OPEN PR or genuine
  # unmerged commits are never touched. Worktrees are skipped (they only
  # exist on local checkouts, not in CI).
  branch-cleanup:
    name: Prune merged claude/* branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # git push --delete
      pull-requests: read   # gh pr view (open-PR guard)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # full history — ahead-count needs all refs

      - name: Prune merged remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --yes  : perform the deletion (merged == dead, safe to act).
          # --no-worktrees : CI has no .claude/worktrees/ checkouts.
          # The script's own guards (current branch, ahead>0, open PR)
          # protect every branch that still carries live work.
          bash .claude/scripts/cleanup-branches-worktrees.sh --yes --no-worktrees

  # ── 9. Play Store reviews & ratings ingest ────────────────────────────────
  # The empire dashboard aggregates npm downloads + GitHub stars, but the Play
  # Store side of the demo app — rating + written reviews — was invisible to
  # any automation. User reviews are a free, high-signal bug feed nobody was
  # reading systematically (#1692).
  #
  # This job runs `play-reviews-ingest.sh`, which pulls recent reviews via the
  # Android Publisher `reviews.list` API (the SAME `PLAY_STORE_SERVICE_ACCOUNT_JSON`
  # service account play-store.yml already uses to publish — read-only, no new
  # write scope). It computes the average rating + star histogram over the
  # fetched window and flags reviews matching a crash/bug signal.
  #
  # For each flagged review it opens ONE de-duplicated tracking issue, keyed
  # by the stable Play `reviewId` — same open/update tracking-issue pattern as
  # the Pages-freshness (job 6) and deep-link-health (job 7) monitors above.
  # Re-running the job never files the same review twice.
  #
  # NON-BLOCKING: the ingest script always exits 0; a missing secret, a 403
  # before the read-only review permission is granted, or an API error all
  # degrade to a WARN. Known API gap: `reviews.list` only returns reviews
  # modified in roughly the last week, and install counts are NOT exposed by
  # any queryable Play API — both are documented in the script header.
  play-reviews:
    name: Play Store reviews ingest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write       # open/update per-review triage issues
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Play API client
        run: |
          # Reuse play-store.yml's pinned requirements (google-auth + requests)
          # — Dependabot already tracks that file via the `pip` ecosystem entry.
          pip install --quiet -r .github/workflows/requirements/play-store.txt

      - name: Ingest Play Store reviews
        id: ingest
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          bash .claude/scripts/play-reviews-ingest.sh play-reviews.json | tee reviews-ingest.log

      - name: Open de-duplicated triage issues for flagged reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f play-reviews.json ]; then
            echo "::warning::play-reviews.json not produced — skipping triage."
            exit 0
          fi

          # A degraded ingest (missing secret / 403 / API error) has no
          # `flagged` entries — nothing to do, never fail the job.
          FLAGGED_COUNT=$(python3 -c "import json;print(len(json.load(open('play-reviews.json')).get('flagged',[])))" 2>/dev/null || echo 0)
          echo "Flagged reviews: $FLAGGED_COUNT"
          [ "$FLAGGED_COUNT" -eq 0 ] && exit 0

          # Emit one TSV line per flagged review: reviewId, star, signal,
          # device, appVersion, language, text. The python side base64-encodes
          # the text so newlines/tabs in a review body can't break the loop.
          python3 - << 'PYEOF' > flagged.tsv
          import base64, json
          for r in json.load(open("play-reviews.json")).get("flagged", []):
              text = base64.b64encode((r.get("text") or "").encode()).decode()
              print("\t".join([
                  r.get("reviewId", ""),
                  str(r.get("starRating", "?")),
                  r.get("signal", "?"),
                  str(r.get("device", "unknown")),
                  str(r.get("appVersion", "unknown")),
                  str(r.get("language", "")),
                  text,
              ]))
          PYEOF

          while IFS=$'\t' read -r RID STAR SIGNAL DEVICE APPVER LANG TEXT_B64; do
            [ -z "$RID" ] && continue
            TEXT=$(echo "$TEXT_B64" | base64 -d 2>/dev/null || echo "(decode error)")
            # De-dup key: the stable Play reviewId, carried verbatim in the
            # issue title so a search is exact and idempotent.
            SHORT_ID="${RID:0:18}"
            TITLE="Play Store review — $SIGNAL signal (${STAR}★) [${SHORT_ID}]"
            EXISTING=$(gh issue list --repo "${{ github.repository }}" --state all \
              --search "${SHORT_ID} in:title" \
              --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              echo "Review $SHORT_ID already tracked in #$EXISTING — skipping."
              continue
            fi
            BODY=$(cat <<EOF
          Automated Play Store review triage (#1692) flagged a user review as a
          potential bug report.

          | Field | Value |
          |---|---|
          | Star rating | ${STAR} / 5 |
          | Bug signal | \`${SIGNAL}\` |
          | Device | ${DEVICE} |
          | App version | ${APPVER} |
          | Language | ${LANG:-unknown} |
          | Play review ID | \`${RID}\` |

          **Review text**

          > ${TEXT}

          ---
          Posted by the \`play-reviews\` maintenance job. De-duplicated by Play
          review ID — this review will not be filed again. Triage: reproduce on
          the listed device/version, then either fix or close as not-a-bug.
          Replying to the review in the Play Console is a separate manual step
          (this automation is read-only by design).
          EOF
            )
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "bug,play-store,user-report" \
              || echo "::warning::Could not create triage issue for review $SHORT_ID"
          done < flagged.tsv

      - name: Append review metrics to step summary
        if: always()
        run: |
          {
            echo "### Play Store reviews — $(date -u +%Y-%m-%d)"
            echo ""
            if [ -f play-reviews.json ]; then
              python3 - << 'PYEOF'
          import json
          d = json.load(open("play-reviews.json"))
          if d.get("degraded"):
              print(f"_Ingest degraded: {d['degraded']}_")
          else:
              print(f"- Reviews fetched (≈last 7d window): **{d.get('reviewCount', 0)}**")
              avg = d.get("averageRating")
              print(f"- Average rating (fetched window): **{avg if avg is not None else 'n/a'} / 5**")
              hist = d.get("starHistogram", {})
              if hist:
                  print("- Star histogram: " + "  ".join(f"{k}★={v}" for k, v in sorted(hist.items())))
              print(f"- Flagged for triage: **{len(d.get('flagged', []))}**")
          print("")
          print("_Install base / lifetime rating are not exposed by a queryable "
                "Play API — see play-reviews-ingest.sh._")
          PYEOF
            else
              echo "_No review data produced this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 10. Store preflight (Apple agreements / App Review / cert expiry) ───────
  # Detection tier of "store publishing as code" (#2612 P1). CI-green means the
  # build UPLOADED, not that the store account can accept it. This job runs the
  # read-only ASC preflight daily so a silent, human-only store blocker —
  # an expired Apple Program License Agreement (REQUIRED_AGREEMENTS_MISSING_OR_
  # EXPIRED), an App Review rejection (#2534), a distribution cert/profile about
  # to lapse — surfaces in the digest DAYS before it 403s a release deploy,
  # instead of being discovered by email archaeology at deploy minute 40.
  #
  # Reuses app-store.yml's EXISTING ASC secrets (APP_STORE_CONNECT_KEY_ID /
  # _ISSUER_ID / _API_KEY) — read-only, NO new scope. These are repo-level
  # secrets (app-store.yml declares no `environment:`), so they are visible
  # here; if a maintainer ever scopes them to an environment, add the same
  # `environment:` here or the job degrades to a SKIP (never a fake green).
  #
  # ADVISORY: `continue-on-error` + the script's advisory-first exit policy mean
  # this never fails the maintenance workflow; it only posts to the step
  # summary. Opening a de-duplicated tracking issue on a real blocker is a P1
  # follow-up (the play-reviews pattern above), deliberately kept out of the
  # first landing.
  store-preflight:
    name: Store preflight (ASC)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run store preflight (read-only ASC probes)
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # openssl / curl / jq / xxd all ship on ubuntu-latest. Advisory-first:
          # GATE_HARD stays 0 so a blocker never fails the job — the digest
          # carries the signal. A missing secret degrades to a SKIP inside the
          # script.
          bash .claude/scripts/store-preflight.sh --json store-preflight.json | tee store-preflight.log || true

      - name: Append store preflight to step summary
        if: always()
        run: |
          {
            echo "### Store preflight (App Store Connect) — $(date -u +%Y-%m-%d)"
            echo ""
            if [ -f store-preflight.json ]; then
              python3 - << 'PYEOF'
          import json
          d = json.load(open("store-preflight.json"))
          verdict = d.get("verdict", "?")
          badge = {"pass":"✅ pass","warn":"⚠️ warn","blocked":"⛔ blocked","skip":"⏭️ skipped"}.get(verdict, verdict)
          ap = d.get("apple", {})
          print(f"- Verdict: **{badge}**")
          print(f"- Agreements: `{ap.get('agreements','?')}`")
          rv, rs = ap.get("reviewVersion"), ap.get("reviewState")
          print(f"- Latest App Review: {rv or 'n/a'} — `{rs or 'n/a'}`")
          print(f"- Distribution cert: {ap.get('certMinDaysToExpiry','n/a')} day(s) to expiry")
          print(f"- Provisioning profile: {ap.get('profileMinDaysToExpiry','n/a')} day(s) to expiry")
          notes = d.get("notes") or []
          if notes:
              print("")
              print("**Notes**")
              for n in notes:
                  print(f"- {n}")
          if verdict == "skip":
              print("")
              print(f"_Skipped: {d.get('detail','')}_")
          print("")
          print("_Read-only detection (#2612 P1). Agreements / tax forms / "
                "Resolution Center replies are human-only — this only detects "
                "and deep-links, it never clears a blocker._")
          PYEOF
            else
              echo "_No preflight output produced this run (tooling or secret unavailable) — treated as advisory SKIP._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 11. sceneview-mcp npm freshness ────────────────────────────────────────
  # sceneview-mcp is on an INDEPENDENT npm track (#1705) — it does NOT ship on
  # every SDK release, so it silently rots when mcp/ changes without a tag (it
  # fell a month behind at 4.0.12). WARN-only: if the local mcp/package.json
  # version is ahead of npm, remind a maintainer to dispatch mcp-publish.yml.
  mcp-npm-freshness:
    name: MCP npm freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Compare local mcp/package.json against published npm
        id: check
        run: |
          set -euo pipefail
          LOCAL=$(node -p "require('./mcp/package.json').version")
          NPM=$(npm view sceneview-mcp version 2>/dev/null || echo "unknown")
          echo "local=$LOCAL  npm=$NPM"
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM" >> "$GITHUB_OUTPUT"
          # `sort -V` puts the lower semver first. A lag means npm < local, i.e.
          # local is NOT the first line. Equal versions = in sync (no lag).
          # `lag` opens the issue; `resolved` closes it — and it is deliberately
          # NOT the inverse. A failed `npm view` yields "unknown", which is no
          # lag, but it is also no measurement: closing a real stale-npm issue
          # because the registry was briefly unreachable would retract a finding
          # that is still true. `resolved` therefore requires a version actually
          # read back from npm.
          if [ "$NPM" = "unknown" ]; then
            echo "::warning::Could not read the published sceneview-mcp version — freshness NOT measured this run."
            echo "lag=false" >> "$GITHUB_OUTPUT"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL" = "$NPM" ]; then
            echo "lag=false" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$LOCAL" "$NPM" | sort -V | head -1)" = "$NPM" ]; then
            echo "::warning::sceneview-mcp npm ($NPM) lags local mcp/package.json ($LOCAL) — dispatch mcp-publish.yml to republish."
            echo "lag=true" >> "$GITHUB_OUTPUT"
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          else
            # npm is AHEAD of mcp/package.json — a publish landed before the bump
            # merged. Not a lag, and a "npm is stale" issue no longer describes
            # anything true, so it should close too.
            echo "lag=false" >> "$GITHUB_OUTPUT"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue
        if: steps.check.outputs.lag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOCAL='${{ steps.check.outputs.local }}'
          NPM='${{ steps.check.outputs.npm }}'
          TITLE="sceneview-mcp npm is stale ($NPM < $LOCAL)"
          BODY=$'Daily maintenance found `sceneview-mcp` on npm is **'"$NPM"$'**, behind the local `mcp/package.json` (**'"$LOCAL"$'**).\n\nThe MCP is on an independent npm track (#1705) and does not ship on every SDK tag. Republish it on demand (no tag needed):\n\n```\ngh workflow run mcp-publish.yml -R sceneview/sceneview --ref main\n```\n\nThe dispatch is idempotent — if the version is already on npm it logs a notice and succeeds.'
          EXISTING=$(gh issue list --state open --search "sceneview-mcp npm is stale in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY" --label "maintenance" \
              || echo "::warning::Could not create MCP npm freshness issue"
          else
            gh issue comment "$EXISTING" --body "$BODY" \
              || echo "::warning::Could not comment on existing MCP npm freshness issue #$EXISTING"
          fi

      - name: Close the tracking issue once npm has caught up
        if: steps.check.outputs.resolved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Bound to env first rather than interpolated into the run: body —
          # same shape as the open step above. These two are semver-constrained
          # and repo-controlled, so this is style not exposure, but the
          # `${{ }}`-inside-a-shell-string pattern is the one that becomes an
          # injection the day a value stops being trusted.
          NPM_VERSION: ${{ steps.check.outputs.npm }}
          LOCAL_VERSION: ${{ steps.check.outputs.local }}
        run: |
          bash .claude/scripts/close-maintenance-issue.sh \
            "sceneview-mcp npm is stale" \
            "npm now serves \`$NPM_VERSION\` and \`mcp/package.json\` is at \`$LOCAL_VERSION\` — the lag this issue tracks is gone. Closed automatically by \`maintenance.yml\`; it re-files itself if the versions diverge again."

  # ── 12. Play Store listing drift (read-only) ───────────────────────────────
  # Sibling of § 10, on the Play side. play-store.yml only ever runs
  # play_listing.py --apply, and only on a minor bump — so the listing is
  # written blind: nobody sees how far the live store has drifted from the repo
  # until after the write. That is how #2794 stayed invisible (a bad tablet
  # imageType 400'd mid-edit, silently rolling back the icon and the copy for
  # every release since #1710, while `continue-on-error` kept the run green).
  # This job runs the READ-ONLY diff daily so the drift is visible in advance.
  # Advisory: never fails, and SKIPs honestly when the secret is absent.
  listing-drift:
    name: Play listing drift (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write        # open/refresh the listing-drift tracking issue
    steps:
      - uses: actions/checkout@v7

      - name: Diff live Play listing against the repo
        id: diff
        continue-on-error: true
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: io.github.sceneview.demo
          LISTING_DIR: samples/android-demo/distribution/play-store
        run: |
          python3 -m venv /tmp/listing-venv
          # Same pinned deps as the apply path — credential-bearing job (#1230).
          /tmp/listing-venv/bin/pip install --quiet -r .github/workflows/requirements/play-store.txt
          # --dry-run opens a throwaway edit, reads, and abandons it: nothing is
          # ever committed to the store. --fail-on-drift makes drift its OWN exit
          # code (3), so the tracking-issue step below gates on a measured signal
          # instead of grepping prose — still advisory: this step exits 0, a
          # drifted listing opens an issue rather than failing CI.
          #
          # 2>&1 into the log, and capture the REAL exit code. A bare
          # `| tee … || true` discards it and sends the traceback to stderr
          # only — the log would still hold the "[dry-run] probe edit_id=…"
          # line, so it is non-empty and matches neither [skip] nor DRIFT, and
          # the summary below would report "✅ No drift" over a crashed run.
          # That is the exact silent-green class this job exists to catch
          # (#2794) — do not simplify this back into a bare pipe.
          set +e
          /tmp/listing-venv/bin/python3 .claude/scripts/store-sync/play_listing.py \
            --dry-run --fail-on-drift > listing-drift.log 2>&1
          rc=$?
          set -e
          cat listing-drift.log
          echo "DRIFT_RC=$rc" >> "$GITHUB_ENV"
          # Exit 3 is the ONLY code meaning "drift measured" (creds present, diff
          # non-empty). 0 = clean or credential-less skip; 2/other = crash. Gate
          # the issue step on 3 alone so a skipped or crashed run never files a
          # drift issue it did not actually find.
          if [ "$rc" -eq 3 ]; then echo "drift=1" >> "$GITHUB_OUTPUT"; fi
          # Mirror signal for the auto-close, and deliberately NOT `rc != 3`:
          # per the comment above, 0 also covers the credential-less skip, and an
          # empty log means the tool never ran. Closing a live drift issue on
          # either would retract a finding nobody re-measured — the #2794
          # silent-green class, pointed at the backlog instead of the store.
          # Require the same three facts the summary requires to say "No drift".
          if [ "$rc" -eq 0 ] && [ -s listing-drift.log ] \
            && ! grep -q '^\[skip\]' listing-drift.log; then
            echo "clean=1" >> "$GITHUB_OUTPUT"
          fi
          # Advisory job: never fail the step on a red check, the summary carries
          # the signal. Exit 0 explicitly rather than relying on continue-on-error.
          exit 0

      - name: Append listing drift to step summary
        if: always()
        run: |
          {
            echo "### Play listing drift (read-only) — $(date -u +%Y-%m-%d)"
            echo ""
            if [ -f listing-drift.log ] && [ -s listing-drift.log ]; then
              if [ "${DRIFT_RC:-}" = "3" ]; then
                # 3 = drift MEASURED (--fail-on-drift). Checked FIRST so a real
                # drift is never mislabelled as the crash branch below.
                echo "⚠️ **Drift detected** — the live listing differs from the repo."
                echo ""
                echo '```'
                grep 'DRIFT' listing-drift.log || true
                echo '```'
                echo ""
                echo "_A tracking issue is opened/refreshed below. The next minor release"
                echo "overwrites the live listing with the repo's version (store-as-code:"
                echo "delete-then-upload per imageType)._"
              elif [ "${DRIFT_RC:-}" = "0" ]; then
                if grep -q '^\[skip\]' listing-drift.log; then
                  echo "⏭️ **Skipped** — no Play service-account credential available."
                else
                  echo "✅ **No drift** — the live listing matches the repo."
                fi
              else
                # Empty, 2, or any other code: no comparison completed. Never a
                # clean bill of health — say so loudly above the truncated log.
                echo "❌ **The drift check itself failed** (exit \`${DRIFT_RC:-unknown}\`)."
                echo "This is NOT a clean bill of health — the live listing was not compared."
                echo ""
                echo '```'
                tail -30 listing-drift.log
                echo '```'
              fi
            else
              echo "_No diff output produced this run — treated as advisory SKIP._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the Play listing drift issue
        if: steps.diff.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Play Store listing drift detected"
          DRIFT=$(grep 'DRIFT' listing-drift.log || true)
          BODY=$'The live Play Store listing has drifted from the repo (`samples/android-demo/distribution/play-store`).\n\n```\n'"$DRIFT"$'\n```\n\nThe next minor release reconciles it (the store-as-code sync overwrites the live listing from the repo); to reconcile sooner, re-run the sync from `play-store.yml`. Read-only diff: `.claude/scripts/store-sync/play_listing.py --dry-run`.\n\n_Auto-filed by maintenance.yml (#2612 Phase C). Refreshed daily while the drift persists; close once reconciled._'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE — since $(date -u +%Y-%m-%d)" --body "$BODY" \
              --label "maintenance" \
              || echo "::warning::Could not create Play listing drift issue"
          else
            gh issue edit "$EXISTING" --body "$BODY" \
              || echo "::warning::Could not refresh Play listing drift issue #$EXISTING"
          fi

      - name: Close the drift issue once the listing is reconciled
        if: steps.diff.outputs.clean == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .claude/scripts/close-maintenance-issue.sh \
            "Play Store listing drift detected" \
            "The read-only diff now reports the live Play listing matching \`samples/android-demo/distribution/play-store\` — measured, not inferred from a skipped run. Closed automatically by \`maintenance.yml\`; it re-files itself the next time the listing drifts."

  # ── 13. App Store listing drift + checksum-provenance probe (read-only) ─────
  # ASC sibling of § 10 (store-preflight) and § 12 (Play listing-drift). Runs
  # asc_listing.py --dry-run --fail-on-drift: a read-only live-vs-repo diff of
  # the App Store listing text and screenshots. Advisory — a drifted listing
  # opens a tracking issue (below), never fails CI.
  #
  # The screenshot half of the diff keys on `sourceFileChecksum == MD5(source
  # bytes)`. That convention reports `unattested-match` for console-sourced sets,
  # not CONFIRMED — but the write path deletes-then-uploads a WHOLE display-type
  # set, so it can only ever yield a full or an empty set; the observed one-file
  # delta on the 4.25.0 draft was therefore a human console upload, not our own
  # echo (Fable audit, #2612 Phase C, n=1). On that basis the diff is wired
  # ADVISORY-ONLY: this job files an issue and release-checklist §17 WARNs. It is
  # NOT gated to blocking — promoting it waits on n=5. Do NOT hardcode
  # --screenshots-are-console-sourced here (that re-creates the #2811 tautology);
  # the `[probe]` verdict this run prints stays the standing provenance signal.
  #
  #   Read the verdict:  gh run view <id> --log | grep '\[probe\]'
  #   Trigger on demand: gh workflow run maintenance.yml -R sceneview/sceneview
  asc-listing-drift:
    name: App Store listing drift + checksum probe (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write        # open/refresh the listing-drift tracking issue
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run ASC listing dry-run (read-only diff + checksum probe)
        id: diff
        continue-on-error: true
        env:
          # Same three secrets as § 10 store-preflight and app-store.yml — no
          # new scope, no new secret. asc_listing.py reads the .p8 content from
          # APP_STORE_CONNECT_API_KEY directly; a missing secret degrades to a
          # SKIP inside the script (exit 0, not a green lie).
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # $RUNNER_TEMP, not /tmp: the self-hosted mac runner does not wipe
          # /tmp between jobs, so a venv there would silently reuse a stale tree
          # and void the pinned versions. (Same reason as app-store-screenshots.yml.)
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          # Pinned, Dependabot-tracked, shared with the deploy workflow (#1230).
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet -r .github/workflows/requirements/app-store.txt
          # --fail-on-drift makes drift its own exit code (3) so the tracking-
          # issue step can gate on a measured signal. Still advisory: this step
          # exits 0, a drifted listing opens an issue rather than failing CI.
          #
          # advisory must not mean unreadable. `| tee … || true` discards the
          # script's status twice over (the pipeline reports tee's, then `|| true`
          # swallows it), so a crash AFTER the first line of output — transient
          # 5xx, token expiry mid-run — would leave a partial log with no drift
          # lines and no [probe] verdict, and the summary would render that as a
          # clean read. That is the repo's own `continue-on-error` hazard turned
          # inward, on the one job whose entire purpose is to not overstate what
          # it measured. Capture the SCRIPT's exit code (PIPESTATUS[0], not tee's)
          # and hand it to the summary step, which labels a non-zero run instead
          # of printing a truncated log as if it were a finding-free one.
          set +e
          "$RUNNER_TEMP/asc-venv/bin/python3" .claude/scripts/store-sync/asc_listing.py --dry-run --fail-on-drift \
            | tee asc-listing-drift.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "asc_rc=$rc" >> "$GITHUB_ENV"
          # 3 alone = drift measured (creds present, diff non-empty). 0 = clean or
          # credential-less skip; 2/other = crash. Gate the issue on 3 so a skip
          # or crash never files a drift issue it did not find.
          if [ "$rc" -eq 3 ]; then echo "drift=1" >> "$GITHUB_OUTPUT"; fi
          # Mirror signal for the auto-close. By the same reading, `clean` cannot
          # be `rc != 3`: 0 covers the credential-less skip too, and an empty log
          # means the script never spoke. Closing a live drift issue on either
          # would retract a finding nobody re-measured. `[skip]` is matched
          # unanchored because asc_listing.py prints it both bare and behind a
          # `::warning::` prefix.
          if [ "$rc" -eq 0 ] && [ -s asc-listing-drift.log ] \
            && ! grep -q '\[skip\]' asc-listing-drift.log; then
            echo "clean=1" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Append ASC listing drift to step summary
        if: always()
        run: |
          {
            echo "### App Store listing drift + checksum probe — $(date -u +%Y-%m-%d)"
            echo ""
            # asc_rc reclassified for --fail-on-drift: 3 = drift MEASURED (a
            # finding, not a failure); empty or any other non-zero = the read did
            # not complete. Special-case 3 FIRST so a real drift is never
            # mislabelled as an incomplete read (the #2794 silent-green class,
            # inverted). An empty asc_rc means the step died before recording one.
            if [ "${asc_rc:-}" = "3" ]; then
              echo "> ⚠️ **Drift detected** — the live App Store listing differs from"
              echo "> the repo. A tracking issue is opened/refreshed below; the diff"
              echo "> is listed under **Full read-only diff**."
              echo ""
            elif [ -n "${asc_rc:-}" ] && [ "${asc_rc}" != "0" ]; then
              echo "> ⚠️ **Incomplete read — \`asc_listing.py\` exited ${asc_rc}.**"
              echo "> Any output below is partial. An absent drift list or missing"
              echo "> \`[probe]\` verdict here means *not measured*, NOT *no drift*."
              echo ""
            elif [ -z "${asc_rc:-}" ]; then
              echo "> ⚠️ **Setup failed before the probe ran** (venv or pip step)."
              echo "> Nothing was measured."
              echo ""
            fi
            if [ -f asc-listing-drift.log ] && [ -s asc-listing-drift.log ]; then
              # The provenance verdict is a standing signal of this job — surface
              # it first. It is advisory (`unattested-match` for console sets), not
              # a gate: #2612 Phase C is wired advisory-only (issue + §17 WARN).
              PROBE=$(grep '^\[probe\]' asc-listing-drift.log || true)
              if [ -n "$PROBE" ]; then
                echo "**Checksum provenance (#2612 Phase C — advisory)**"
                echo '```'
                printf '%s\n' "$PROBE"
                echo '```'
                echo ""
              fi
              echo "**Full read-only diff**"
              echo '```'
              cat asc-listing-drift.log
              echo '```'
            else
              echo "_No output produced (tooling or secret unavailable) — advisory SKIP._"
            fi
            echo ""
            echo "_Read-only (#2612 P2 Phase C). Writes nothing to the store; the"
            echo "screenshot sync is the dispatch-only \`app-store-screenshots.yml\`._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the App Store listing drift issue
        if: steps.diff.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="App Store listing drift detected"
          DRIFT=$(grep 'DRIFT' asc-listing-drift.log || true)
          BODY=$'The live App Store listing has drifted from the repo (`samples/ios-demo/distribution/`).\n\n```\n'"$DRIFT"$'\n```\n\nScreenshot-only drift keys on `sourceFileChecksum == MD5`, an `unattested-match` convention (see the `[probe]` verdict in the run summary) — treat it as advisory. Reconcile listing text via the listing step of `app-store.yml`. Read-only diff: `.claude/scripts/store-sync/asc_listing.py --dry-run`.\n\n⛔ **Do not reconcile the screenshot half by dispatching `app-store-screenshots.yml` without re-capturing first.** `samples/ios-demo/appstore-screenshots/` still holds frames captured before #2897, when `SceneEnvironment.intensity` was fed to RealityKit as a `2^x` exponent — its README says so in as many words, and nothing enforces it: the dispatch is manual and `asc_listing.py` compares checksums, not pixels. Uploading them would replace the live screenshots with known-wrong lighting.\n\n_Auto-filed by maintenance.yml (#2612 Phase C). Refreshed daily while the drift persists; closes itself once the diff comes back clean._'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE — since $(date -u +%Y-%m-%d)" --body "$BODY" \
              --label "maintenance" \
              || echo "::warning::Could not create App Store listing drift issue"
          else
            gh issue edit "$EXISTING" --body "$BODY" \
              || echo "::warning::Could not refresh App Store listing drift issue #$EXISTING"
          fi

      - name: Close the drift issue once the listing is reconciled
        if: steps.diff.outputs.clean == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .claude/scripts/close-maintenance-issue.sh \
            "App Store listing drift detected" \
            "The read-only diff now reports the live App Store listing matching the repo — measured with credentials present, not inferred from a skipped run. Closed automatically by \`maintenance.yml\`; it re-files itself the next time the listing drifts."
