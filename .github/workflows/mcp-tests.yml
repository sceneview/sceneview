name: MCP tests

# Runs the vitest suites of the MCP surface: the `mcp/` npm package, the five
# vertical packages under `mcp/packages/`, and the `mcp-gateway/` Worker.
#
# WHY A NEW WORKFLOW AND NOT A STEP SOMEWHERE (#3201)
# ---------------------------------------------------
# None of these suites ran anywhere. `mcp-gateway/` — the paid Worker — held
# 17 test files and 187 cases that no workflow touched; one of them had
# inverted, asserting a tool count the dashboard had outgrown, so it was green
# while the page was wrong and only went red once the page was fixed. Nothing
# reported that for months.
#
# `mcp/`'s own suite is in a subtler state, and the first version of this header
# got it wrong — worth recording, since the error is the one this workflow is
# about. It claimed the suite never ran in CI. It does run: `quality-gate.sh`
# runs it behind `[ -d "mcp/node_modules" ]`, and in ci.yml's `Quality gate
# (full)` job that directory EXISTS, because `- uses: ./.github/actions/setup-mcp`
# (ci.yml:1838) runs `npm ci` in `mcp/` (setup-mcp/action.yml:31-32) before the
# `bash .claude/scripts/quality-gate.sh` step (ci.yml:1847).
#
# The real defect is that nothing says so. No declaration ties that leg to
# `setup-mcp`, which sits in the job for the other MCP work; remove it, reorder
# the steps, or move the leg to a job without it and the suite stops running
# while the report reads the same. Until this PR the guard's false branch
# printed nothing at all, so "did not run" and "passed" were indistinguishable.
# And because the invocation goes through a wrapper script, no reachability
# audit can see it — a stated bound of `check-test-suites-reachable.sh`, and the
# reason `mcp` read as covered there only through `release.yml`.
#
# Accidental coverage that no reader can verify is what this workflow replaces:
# the same suite, invoked by name, on a declared trigger.
#
# `release.yml` and `mcp-publish.yml` do run `npm test`, but only on a `v*`
# tag — by then the code is on `main`. Publish-time tests are not merge gates.
#
# PATHS INCLUDE `mcp/**` FOR THE GATEWAY JOB TOO
# ----------------------------------------------
# `mcp-gateway/` imports `mcp/src/tiers.ts`, `mcp/src/tools/index.ts` and every
# `mcp/packages/*/src/tools.ts` directly, so a change confined to `mcp/` can
# break the gateway's suite. Filtering the gateway on `mcp-gateway/**` alone
# would reproduce the original gap one directory over: coverage has to follow
# the dependency, not the directory name.

on:
  push:
    # `branches: [main]` is required — `paths:` alone does NOT scope the push
    # trigger to a branch, so without it this runs on every push to every
    # `claude/*` worktree branch. PR coverage comes from the trigger below.
    branches: [main]
    paths:
      - 'mcp/**'
      - 'mcp-gateway/**'
      - '.github/workflows/mcp-tests.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'mcp-gateway/**'
      - '.github/workflows/mcp-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp:
    name: MCP package + vertical packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to 20 to match every other Node-using workflow
          # (ci.yml, release.yml, mcp-ts-check.yml, telemetry-ci.yml) — #1602.
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        working-directory: mcp
        run: npm ci

      - name: Test
        working-directory: mcp
        run: npm test

      # The five vertical packages are run EXPLICITLY, one step each, even
      # though the `npm test` above already sweeps them: vitest with no config
      # picks up everything under `mcp/`, which is coverage by default rather
      # than by declaration. A `vitest.config.ts` added to `mcp/` tomorrow with
      # a narrowed `include` would drop all five without a word — and it is the
      # reachability gate, reading this YAML, that has to be able to see them.
      # Two of them (automotive, healthcare) have no package.json of their own,
      # so they borrow this job's toolchain; that is also how they are consumed.
      - name: Test automotive package
        working-directory: mcp
        run: npx vitest run --root packages/automotive

      - name: Test gaming package
        working-directory: mcp
        run: npx vitest run --root packages/gaming

      - name: Test healthcare package
        working-directory: mcp
        run: npx vitest run --root packages/healthcare

      - name: Test interior package
        working-directory: mcp
        run: npx vitest run --root packages/interior

      - name: Test rerun package
        working-directory: mcp
        run: npx vitest run --root packages/rerun

  mcp-gateway:
    name: MCP gateway (Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json

      - name: Install dependencies
        working-directory: mcp-gateway
        run: npm ci

      # `mcp/src/generated/{llms-txt,symbols}.ts` are GITIGNORED — generated
      # from `llms.txt` and the committed `.api` dumps, deliberately not
      # committed (see .gitignore). The gateway follows `../mcp/src/symbols.ts`
      # and `../mcp/src/tools/handler.ts` into them, so on a fresh checkout both
      # steps below fail: `tsc` with TS2307 on two modules, and vitest with 8 of
      # its 17 files unable to import. `mcp/`'s own lifecycle scripts
      # (`prebuild`/`test`) run these three generators, which is why every other
      # MCP job is unaffected and why this job was the one that broke.
      #
      # They import nothing but `node:` builtins, so they need no `npm ci` in
      # `mcp/`. The version generator is included even though `version.ts` IS
      # committed: running the lifecycle exactly as declared beats a hand-picked
      # subset that drifts. Verified byte-identical — regenerating leaves the
      # tree clean.
      - name: Generate mcp/src/generated (gitignored, imported by the gateway)
        working-directory: mcp
        run: |
          node scripts/generate-llms-txt.js
          node scripts/generate-version.js
          node scripts/generate-symbols.js

      - name: Typecheck
        working-directory: mcp-gateway
        run: npx tsc --noEmit

      # The gateway's suite imports `mcp/src` and `mcp/packages/*/src` as
      # TypeScript sources, which vitest transpiles itself — verified by running
      # it with `mcp/node_modules` moved aside: 17 files, 187 passed. So this
      # job deliberately does NOT install `mcp/`'s dependencies; if that ever
      # stops being true, it fails here rather than silently skipping. That
      # check covered node_modules only, which is exactly how the generated-file
      # dependency above got past it.
      - name: Test
        working-directory: mcp-gateway
        run: npx vitest run
