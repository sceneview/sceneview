name: MCP tests

# Runs the vitest suites of the MCP surface: the `mcp/` npm package and the
# five vertical packages under `mcp/packages/`.
#
# WHY A NEW WORKFLOW AND NOT A STEP SOMEWHERE (#3201)
# ---------------------------------------------------
# `mcp/`'s own suite was covered only by accident. Until #3244 removed the
# local harness, `.claude/scripts/quality-gate.sh` ran it behind
# `[ -d "mcp/node_modules" ]` from ci.yml's `Quality gate (full)` job, and the
# directory existed there only because `./.github/actions/setup-mcp` happened
# to sit in that job for the other MCP work. Nothing declared that dependency,
# the guard's false branch printed nothing, and the invocation went through a
# wrapper script no reachability audit could see. That job and that script are
# gone now; this workflow is the only thing that runs the suite on a PR.
#
# Accidental coverage that no reader can verify is what this workflow replaces:
# the same suite, invoked by name, on a declared trigger.
#
# `release.yml` and `mcp-publish.yml` do run `npm test`, but only on a `v*`
# tag — by then the code is on `main`. Publish-time tests are not merge gates.

on:
  push:
    # `branches: [main]` is required — `paths:` alone does NOT scope the push
    # trigger to a branch, so without it this runs on every push to every
    # `claude/*` worktree branch. PR coverage comes from the trigger below.
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-tests.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-tests.yml'
      # The reachability job below reads every workflow and every versioned
      # test file, so the PRs that must trigger it are the ones that touch
      # either — a PR that only deletes a workflow is exactly the PR it is for.
      - '.github/workflows/**'
      - '**/*.test.*'
      - '**/*.spec.*'
      - '**/__tests__/**'
      - '**/package.json'
      - '.claude/scripts/check-test-suites-reachable.sh'
      - '.claude/scripts/test-check-test-suites-reachable.sh'
      - '.claude/scripts/validate-demo-assets.sh'
      - '.claude/scripts/test-validate-demo-assets.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp:
    name: MCP package + vertical packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned to 20 to match every other Node-using workflow
          # (ci.yml, release.yml, mcp-ts-check.yml, telemetry-ci.yml) — #1602.
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        working-directory: mcp
        run: npm ci

      - name: Test
        working-directory: mcp
        run: npm test

      # The five vertical packages are run EXPLICITLY, one step each, even
      # though the `npm test` above already sweeps them: vitest with no config
      # picks up everything under `mcp/`, which is coverage by default rather
      # than by declaration. A `vitest.config.ts` added to `mcp/` tomorrow with
      # a narrowed `include` would drop all five without a word — and it is the
      # reachability gate, reading this YAML, that has to be able to see them.
      # Two of them (automotive, healthcare) have no package.json of their own,
      # so they borrow this job's toolchain; that is also how they are consumed.
      - name: Test automotive package
        working-directory: mcp
        run: npx vitest run --root packages/automotive

      - name: Test gaming package
        working-directory: mcp
        run: npx vitest run --root packages/gaming

      - name: Test healthcare package
        working-directory: mcp
        run: npx vitest run --root packages/healthcare

      - name: Test interior package
        working-directory: mcp
        run: npx vitest run --root packages/interior

      - name: Test rerun package
        working-directory: mcp
        run: npx vitest run --root packages/rerun

  # Every JS/TS package carrying tests must be reachable from a workflow
  # (#3201): invoked by a step AND triggered when the package changes. This
  # used to be a step of ci.yml's `repo-hygiene` job; #3244 removed that job
  # with the rest of the local harness, so the gate lives here, next to the
  # suites it was written for. Self-test first: the gate's subject is the file
  # it is declared in, so the fixtures are synthetic repos and a green run says
  # "the reachability check works", not "today's workflows happen to line up".
  test-suite-reachability:
    name: Test suites reachable from a workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Self-test the test-suite reachability gate
        run: bash .claude/scripts/test-check-test-suites-reachable.sh

      # Same shape, next gate over: the demo-asset validator must refuse to
      # run without curl (exit 2) rather than report every CDN URL as a
      # transient miss and exit 0 (#3192).
      - name: Self-test the demo-asset validator's could-not-run contract
        run: bash .claude/scripts/test-validate-demo-assets.sh

      - name: Check every test suite is reachable from a workflow
        run: bash .claude/scripts/check-test-suites-reachable.sh
