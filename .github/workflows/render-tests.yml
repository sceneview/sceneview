name: Render Tests

on:
  # Two trigger tiers, split by what each one is allowed to cost (#3216):
  #
  # `pull_request` — runs the `android-library-render` job when the PR
  # touches something `:sceneview:connectedDebugAndroidTest` can see, and the
  # `web-render` job when it touches a web path (the `paths:` list below,
  # split per job by the `changes` job). The library job is the one blocking
  # leg of this workflow; before #3216 it had no pre-merge run at all, so a
  # PR that added or broke an androidTest merged on a green that never
  # executed it, and the red surfaced on `main` attributed to whichever push
  # came next. The iOS job stays off PRs: it is advisory by design
  # (`continue-on-error`), spins up a macOS Simulator, and its screenshots
  # were rarely consulted by reviewers. It carries `if:
  # github.event_name != 'pull_request'`. The demo screenshot, AR playback
  # and demo render-golden emulator jobs were removed: 0 catches in 30 days,
  # red on 13 of 24 nightlies. Fork PRs get no secrets, which is
  # fine — neither PR job needs any.
  #
  # `push` to main — the emulator/Simulator jobs (the web suite runs in
  # device-qa.yml on push, see `web-render`), strictly path-gated (#1311,
  # #1321): runs only when render-affecting source actually changes. SKIPPED
  # on doc-only, CI-only (`.github/**`), and `mcp/`-only merges — none of
  # those can change a rendered frame. squash-merge means `main` HEAD differs
  # from every PR commit, so this main-push run still catches integration
  # regressions a PR build can't.
  pull_request:
    branches: [main]
    paths:
      - 'sceneview/**'
      - 'sceneview-core/**'
      - 'arsceneview/src/**'
      - '.github/workflows/render-tests.yml'
      - '.github/actions/setup-gradle/**'
      # Same reasoning as the push list below: a dependency bump or a
      # renderer-affecting module config change can break an instrumented
      # test as surely as `src/**` can.
      - 'gradle/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      # The web Playwright suite (`samples/web-demo`) is reachable from no
      # other PR-time workflow, and `check-test-suites-reachable.sh` (#3201)
      # reads a `pull_request` trigger whose `paths:` exclude the package as
      # "runs its tests but never triggers on it". So web changes trigger
      # this workflow too, and the `web-render` job runs on PRs (advisory,
      # `|| true`, ubuntu-only). The `changes` job below then runs each leg
      # only for its own half of this list: a library PR no longer waits on
      # the 24-min web suite, and a web-only PR no longer boots the emulator.
      - 'samples/web-demo/**'
      # The demo runs the website viewer since #4316: a viewer-only edit
      # ships to /web-demo/ and must run the suite too.
      - 'website-static/js/sceneview.js'
      - 'sceneview-web/**'
  push:
    branches: [main]
    paths:
      - 'sceneview/src/**'
      - 'arsceneview/src/**'
      - 'sceneview-core/src/**'
      - 'samples/**'
      - 'SceneViewSwift/**'
      - 'gradle/**'
      # Build-script changes can alter a rendered frame (dependency bumps,
      # renderer-affecting module config) just as much as `src/**` does.
      - 'build.gradle*'
      - '**/build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '**/gradle.properties'
  workflow_dispatch:
  # Invoked by nightly-ci.yml so the scheduled full-validation run reuses
  # this render-test definition rather than duplicating it. See #1324.
  workflow_call:
    inputs:
      base-sha:
        description: Compare paths with this SHA and dispatch only changed legs.
        type: string
        default: ''

# Cancellation is allowed on pull requests only (#2917, #3216).
#
# On a PR the group is the PR ref, so a new push to the same PR supersedes
# the previous run — the old SHA is never going to merge, no point finishing
# it. Everywhere else (push to main, workflow_dispatch, the nightly
# workflow_call) the group is `github.run_id`, which is unique per run, so
# nothing ever cancels. The previous `group: render-tests-${{ github.ref }}`
# + `cancel-in-progress: true` put EVERY push to main in one group: each
# merge killed the run of the one before it, and over the last 30 main runs
# 15 ended `cancelled` — the commit they were testing went untested and
# nothing said so. Per-merge runs on main now queue instead of cancelling;
# the cost is GitHub-hosted minutes proportional to the merge rate (the
# jobs below are ubuntu-latest + one macos-latest leg, no self-hosted
# runner), the gain is that every merge reaches a verdict.
concurrency:
  group: render-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Per-job path gate ─────────────────────────────────────────────────────
  # The workflow-level `paths:` lists above are unions of unrelated suites,
  # and without a per-job gate whichever half triggered the workflow dragged
  # every other job along. Measured over 2026-09-18..25:
  #   - pull_request: 67 of the 84 PR runs touched no web path, yet each one
  #     ran the 24-min web job (798 runner-minutes) against the unchanged
  #     committed `site/` bundle; that job was the last check to finish on 10
  #     of the 17 library PR heads, setting their "all checks green" time to
  #     ~25 min instead of ~7. 13 web-only PR runs booted the emulator for
  #     nothing (29 runner-minutes).
  #   - push: 29 of the 52 main runs touched no iOS path, yet each ran the
  #     macOS `ios-render` job (277 macOS runner-minutes); 23 touched no
  #     Android path, yet each booted four emulators (489 runner-minutes; three of
  #     those emulator jobs have since been removed).
  #
  # Direct dispatches compare the selected ref with `main`; scheduled callers
  # pass the last successful nightly SHA. The nightly's own manual dispatch
  # passes no SHA, so it still runs every leg.
  # Fail-open: if this job does not conclude `success`, every job runs, so a
  # broken filter can cost minutes but never skip a suite silently.
  changes:
    name: Detect changed paths
    if: >-
      ${{ github.event_name == 'pull_request' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch' || inputs.base-sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # Same pattern as ci.yml's `changes` job: a PR reads its file list from
      # the API (no checkout); a push diffs `before..sha`, which needs the
      # history, but only trees — `blob:none` plus a sparse `.github`.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          filter: blob:none
          sparse-checkout: .github
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ inputs.base-sha || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'main' }}
          filters: |
            shared: &shared
              - '.github/workflows/render-tests.yml'
            android:
              - *shared
              - 'sceneview/**'
              - 'sceneview-core/**'
              - 'arsceneview/**'
              - 'samples/android-demo/**'
              - 'assets/manifest.json'
              - 'samples/common/**'
              - '.github/actions/setup-gradle/**'
              - 'gradle/**'
              - '**/build.gradle*'
              - 'settings.gradle*'
              - '**/gradle.properties'
            ios:
              - *shared
              - 'SceneViewSwift/**'
              - 'samples/ios-demo/**'
              - 'assets/manifest.json'
            web:
              - *shared
              - 'samples/web-demo/**'
              - 'website-static/js/sceneview.js'
              - 'sceneview-web/**'
      - name: Assert every path filter produced a real verdict
        env:
          VERDICTS: |
            android=${{ steps.filter.outputs.android }}
            ios=${{ steps.filter.outputs.ios }}
            web=${{ steps.filter.outputs.web }}
        run: |
          set -euo pipefail
          bad=0
          while IFS='=' read -r name value; do
            [ -z "$name" ] && continue
            case "$value" in
              true|false) echo "  $name = $value" ;;
              *) echo "::error::Path filter '$name' produced '$value' instead of true/false."; bad=1 ;;
            esac
          done <<< "$VERDICTS"
          [ "$bad" -eq 0 ]

  # ── Android library render tests ──────────────────────────────────────────
  android-library-render:
    name: Android library render tests (emulator)
    needs: changes
    # Only when an Android-side path changed (see `changes`); always on
    # dispatch and on the nightly, where `changes` is skipped.
    if: >-
      ${{ !cancelled() && (needs.changes.result != 'success'
      || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking on push/nightly: SwiftShader emulator render tests are
    # inherently flaky (JNI teardown races, GPU emulation timing), so a
    # spurious red X on main is kept advisory — the workflow is NOT a required
    # status check. On a pull request the job DOES report its own verdict
    # (#3216): it is the only leg of this workflow that runs there, it is the
    # one whose gradle invocation has no `|| true`, and it is the pre-merge
    # run the PR author came for — a red it cannot show is a red nobody sees.
    # Still not a required check, so a flake does not block a merge by itself.
    continue-on-error: ${{ github.event_name != 'pull_request' }}

    # The 3-shard emulator matrix (#1119, PR #1145) was REVERTED to a single
    # job: the 5 render-test classes cleanly `assumeTrue`-skip on SwiftShader
    # CI (Filament `readPixels` crash, tracked in #803 — gated by the
    # `gpuReadback` flag, see #912), so sharding boots 3 emulators to run 0
    # tests — strictly more CI cost for the same 0 coverage. This SwiftShader
    # leg deliberately does NOT pass `gpuReadback=true`. Re-apply the matrix
    # scaffold (DemoParameters alone; Visual+Geometry paired; Smoke+Lighting
    # paired) once #803 lands a hardware-GPU runner that opts in and real
    # per-class wall-clocks justify the parallelism.

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      # Enable KVM for hardware acceleration (required for emulator performance)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build androidTest APK
        run: ./gradlew :sceneview:assembleDebugAndroidTest --stacktrace

      - name: Run render tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Run the whole render-test suite in one emulator. The render-test
            # classes `assumeTrue`-skip on SwiftShader (#803, #912) because this
            # leg does NOT pass `gpuReadback=true`, so they report as SKIPPED
            # (not orphan, not failed) and this completes fast. A hardware-GPU
            # runner can opt in with
            # `-Pandroid.testInstrumentationRunnerArguments.gpuReadback=true`.
            ./gradlew :sceneview:connectedDebugAndroidTest --stacktrace

            # Pull rendered screenshots from device for visual inspection
            mkdir -p render-output
            adb pull /sdcard/Android/data/io.github.sceneview.test/files/render-test-output/ render-output/ || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-library-render-results
          path: sceneview/build/reports/androidTests/
          if-no-files-found: ignore

      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-library-render-screenshots
          retention-days: 7
          path: render-output/
          if-no-files-found: ignore

  # ── iOS render tests ──────────────────────────────────────────────────────
  # Runs the `SceneViewDemoUITests` UI-testing target (#2803) — an XCUITest
  # smoke that launches the demo in a simulator and captures an XCTAttachment
  # screenshot of the launch screen, every tab, and a representative subset of
  # working 3D demos (reached via the app's `-demo <id>` launch arg). Before
  # #2803 this job ran the logic-only `SceneViewDemoTests` unit target via
  # `-scheme SceneViewDemo`, which emits ZERO screenshots — so the job's name
  # was a lie and it produced no PNG artifact.
  #
  # It uses its OWN dedicated scheme (`SceneViewDemoUITests`), NOT `SceneViewDemo`
  # — so the per-PR iOS unit-test check in ios.yml (`-scheme SceneViewDemo test`)
  # stays fast and simulator-free; the heavy UI/screenshot pass lives only here
  # (main-push + nightly, non-blocking).
  ios-render:
    name: iOS screenshot tests (Simulator)
    # Advisory leg — push/nightly/dispatch only, never on a PR (#3216).
    needs: changes
    if: >-
      ${{ github.event_name != 'pull_request' && !cancelled()
      && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
      - name: Fetch binary assets (ios)
        uses: ./.github/actions/fetch-assets
        with:
          scopes: ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Same reason as ios.yml (#3174): wait for CoreSimulator to enumerate its
      # devices, then resolve by UDID rather than pinning a model name. The wait
      # is the part that matters — the failure it prevents is a cold-start race,
      # not a missing device. This leg pinned an even older `iPhone 16`, so it
      # had more room to rot than ios.yml did.
      #
      # Deliberately NOT `|| true`, even though the screenshot legs below are
      # non-blocking: "no iOS simulator ever appeared" must be visible, not
      # absorbed into a leg that reports zero screenshots and shrugs.
      - name: Resolve an iOS Simulator destination
        run: |
          set -euo pipefail
          . .claude/scripts/lib/ios-simulator.sh
          # ⛔ The assignment is load-bearing — do NOT fold it back into
          # `echo "IOS_DEST=$(ios_simulator_destination)" >> "$GITHUB_ENV"`.
          # Under `set -e` a command substitution failing inside another
          # command's ARGUMENTS does not abort: echo's status (0) governs. That
          # form wrote an empty IOS_DEST and exited 0, and here that is a true
          # false green — every xcodebuild below is `|| true`, so an empty
          # destination fails silently and this leg reports zero screenshots and
          # goes green. #1515 / #2878 again, in the step written to prevent it.
          IOS_DEST="$(ios_simulator_destination)"
          printf 'IOS_DEST=%s\n' "$IOS_DEST" >> "$GITHUB_ENV"

      - name: Resolve SPM dependencies
        working-directory: samples/ios-demo
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemoUITests \
            -destination "$IOS_DEST" \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Run UI screenshot tests
        working-directory: samples/ios-demo
        run: |
          # UI tests build the host app + the UI test runner and launch on the
          # simulator. CODE_SIGNING_ALLOWED=NO: a simulator build needs no
          # signing. `|| true` keeps this leg non-blocking (render-tests is a
          # post-merge signal, not a required check) — the screenshots are still
          # captured into the xcresult even if an assertion trips, and the
          # extract step below surfaces the real count.
          xcodebuild test \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemoUITests \
            -destination "$IOS_DEST" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -300 || true

      - name: Extract screenshot PNGs from xcresult
        if: always()
        working-directory: samples/ios-demo
        run: |
          set -uo pipefail
          mkdir -p ios-render-screenshots
          if [ ! -d TestResults.xcresult ]; then
            echo "::warning::no TestResults.xcresult produced — the UI test bundle did not run"
            exit 0
          fi
          # Xcode 16: `xcresulttool export attachments` writes every XCTAttachment
          # (our XCUIScreenshot PNGs) to disk as real image files, plus a
          # manifest.json mapping each to its human-readable attachment name.
          # THIS is what makes the job a genuine PNG producer (#2803): the old
          # `xcresulttool get --format json` emitted JSON only, never an image.
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path ios-render-screenshots \
            || echo "::warning::xcresulttool export attachments failed — inspect the xcresult artifact"
          COUNT=$(find ios-render-screenshots -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) | wc -l | tr -d ' ')
          echo "iOS screenshot images extracted: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::warning::fewer than 4 iOS screenshots extracted ($COUNT) — inspect the UI test run / xcresult"
          else
            echo "iOS screenshot job produced $COUNT real image(s)."
          fi

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-render-screenshots
          retention-days: 7
          path: samples/ios-demo/ios-render-screenshots/
          if-no-files-found: ignore

      - name: Upload xcresult bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcresult
          retention-days: 7
          path: samples/ios-demo/TestResults.xcresult
          if-no-files-found: ignore

  # ── Web render tests ──────────────────────────────────────────────────────
  web-render:
    name: Web Playwright screenshot tests
    # Advisory leg (`|| true`). Runs on PRs that touch a web path, so the
    # suite stays reachable from a PR-time workflow (see the
    # `pull_request.paths` note), and on a manual dispatch.
    #
    # NOT on push to main nor on the nightly `workflow_call`: there it was an
    # exact duplicate. `device-qa.yml`'s web leg runs the same
    # `samples/web-demo` suite (same `playwright.config.ts`, full spec set,
    # lockfile-pinned) on every push that touches `samples/web-demo/**` and
    # every night, and it is BLOCKING, whereas this job can never go red. Any
    # other push only re-tested the unchanged committed `site/` bundle.
    # Measured 2026-09-18..25: 52 push + 8 nightly runs of this job, ~24 min
    # each (~1,430 runner-minutes), none of which could report a failure.
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && (needs.changes.result != 'success'
              || needs.changes.outputs.web == 'true'))) }}
    runs-on: ubuntu-latest
    # 30 min: the suite (53 tests, 1 worker) measures 13–17 min green on push
    # runs — 20 min left no headroom and the slower nightly runners timed the
    # job out (#2775, nights of 2026-07-19→21). Per-test hangs are still
    # bounded by Playwright's own 60 s test timeout, so this job-level value
    # is a backstop, not the hang detector.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: samples/web-demo
        # Same pinned install as device-qa.sh's web leg (#3773): `npm ci` from
        # the committed lockfile, so this PR-time leg runs the Playwright /
        # Chromium pair the release gate runs, not `@playwright/test@latest`.
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: samples/web-demo
        run: npx playwright test --reporter=html || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          retention-days: 7
          path: samples/web-demo/playwright-report/
          if-no-files-found: ignore

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-render-screenshots
          retention-days: 7
          path: samples/web-demo/test-results/
          if-no-files-found: ignore
