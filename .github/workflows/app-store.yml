name: Deploy iOS App to App Store

# PREREQUISITES (manual actions):
# 1. Create an iOS Distribution certificate in Apple Developer portal
# 2. Export it as .p12 WITH a password
# 3. base64 encode it: base64 -i certificate.p12 | pbcopy
# 4. Set GitHub secrets:
#    - IOS_BUILD_CERTIFICATE_BASE64: the base64 string from step 3
#    - IOS_BUILD_CERTIFICATE_PASSWORD: the password from step 2
#    - IOS_PROVISIONING_PROFILE_BASE64: base64-encoded .mobileprovision (iOS)
#    - MACOS_PROVISIONING_PROFILE_BASE64: base64-encoded .provisionprofile (macOS)
#    - APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY

on:
  push:
    # Strict semver glob, matching release.yml / play-store.yml. A broader
    # `v*` would let a pre-release (`v4.8.0-rc1`) or stray (`vtest`) tag
    # trigger an App Store / TestFlight deploy with no matching release run.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Auto-submit the uploaded build for App Store review (TestFlight upload always runs)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: app-store-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check prerequisites
    runs-on: ubuntu-latest
    outputs:
      ios_ready: ${{ steps.secrets.outputs.ios_ready }}
      macos_ready: ${{ steps.secrets.outputs.macos_ready }}
      build_number: ${{ steps.build_number.outputs.build_number }}
    steps:
      - name: Compute the App Store build number
        id: build_number
        # CFBundleVersion for BOTH upload streams of this run (#2443, #3081).
        #
        # A UTC timestamp `YYYYMMDDHHMM` (e.g. 202608221540): wall-clock only
        # moves forward, so every archive is strictly newer than the last, and
        # 2026… is far above every build number ever uploaded (the historical
        # high-water mark was 366). It is a valid integer CFBundleVersion —
        # 12 digits, under Apple's 18-digit cap.
        #
        # The previous scheme, `github.run_number + 1000` (~1288), worked but
        # carried two latent Apple rejections the old comment itself named:
        # the run counter resets if the workflow is ever renamed, and the
        # +1000 offset is exhausted the day a historical build exceeds 1288.
        # Both surface at archive time, not in CI. A timestamp has neither.
        #
        # Computed ONCE here and handed to the iOS and macOS legs through job
        # outputs: those are separate jobs that start minutes apart, so
        # calling `date` in each would give the two streams different
        # numbers. One source keeps them in lockstep, and the submit step's
        # `ASC_EXPECTED_BUILD` (#2893 W1) is the same value.
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "App Store build number (CFBundleVersion) for this run: $BUILD_NUMBER"
      - name: Check if secrets are configured
        id: secrets
        env:
          HAS_CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 != '' }}
          HAS_PASS: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD != '' }}
          HAS_IOS_PROF: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_MACOS_PROF: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_MACOS_INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 != '' }}
          HAS_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_PASS" = "true" ] && [ "$HAS_IOS_PROF" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "ios_ready=true" >> $GITHUB_OUTPUT
            echo "iOS secrets configured"
          else
            echo "ios_ready=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping iOS deploy — signing secrets not configured."
          fi
          # macOS App Store deploy needs (#2252):
          #   - IOS_BUILD_CERTIFICATE_BASE64 → "Apple Distribution" cert — REUSED to sign
          #     the .app bundle. It's the unified iOS+macOS distribution cert and already
          #     carries an extractable key (iOS TestFlight signs with it). This sidesteps
          #     #2252: the auto-generated macOS Apple Distribution cert was non-extractable,
          #     that cert type is maxed (2/2), and Xcode 26 rejects the legacy Mac App
          #     Distribution cert for Mac App Store archives.
          #   - MACOS_INSTALLER_CERT_BASE64 → "3rd Party Mac Developer Installer" — signs the .pkg
          #   - MACOS_PROVISIONING_PROFILE_BASE64 → "SceneView Demo Mac App Store" profile,
          #     which MUST reference the same Apple Distribution cert as IOS_BUILD_CERTIFICATE.
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_PASS" = "true" ] && [ "$HAS_MACOS_PROF" = "true" ] && [ "$HAS_MACOS_INSTALLER_CERT" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "macos_ready=true" >> $GITHUB_OUTPUT
            echo "macOS secrets configured"
          else
            echo "macos_ready=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping macOS deploy — signing secrets not configured (need IOS_BUILD_CERTIFICATE_BASE64, MACOS_INSTALLER_CERT_BASE64, MACOS_PROVISIONING_PROFILE_BASE64). See #2252."
          fi

  deploy-ios:
    name: Build & Upload iOS to TestFlight
    needs: check
    if: needs.check.outputs.ios_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: samples/ios-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Using Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "pass:$P12_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "::error::P12 password verification failed."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Stage App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Cache Swift Package dependencies
        uses: actions/cache@v6
        with:
          path: samples/ios-demo/SourcePackages
          # Hash the checked-in `Package.resolved` (#1360) — the nested
          # `xcshareddata/swiftpm/Package.resolved` does not exist until
          # Xcode resolves packages, so it yields a constant empty hash.
          key: spm-${{ runner.os }}-${{ hashFiles('samples/ios-demo/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme SceneViewDemo \
            -project SceneViewDemo.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      # Tag pushes always run through this workflow (the `on:` block above is
      # `tags: [v[0-9]+.[0-9]+.[0-9]+]`), but mirror the Play Store guard
      # condition so manual `workflow_dispatch` debug runs can iterate without
      # tripping the live API probe. See #1909.
      - name: Verify Sketchfab API key wiring (#1909)
        if: startsWith(github.ref, 'refs/tags/v')
        # `defaults.run.working-directory` is samples/ios-demo, so step back
        # to the repo root for the shared verify script.
        working-directory: ${{ github.workspace }}
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        run: bash .claude/scripts/verify-sketchfab-key.sh

      - name: Build archive
        # Inject the Sketchfab API key as a user-defined build setting so it
        # gets substituted into `Info.plist`'s `SketchfabAPIKey =
        # $(SKETCHFAB_API_KEY)` placeholder at archive time. Environment
        # variables set on the runner don't survive `xcodebuild archive` into
        # the shipped `.ipa`, so the legacy `ProcessInfo` lookup in
        # `SketchfabConfig.swift` would return nil for every TestFlight +
        # App Store build (issue #1157). Mirrors the Android pattern in
        # `play-store.yml:170` / `build-apks.yml:47`.
        #
        # BUILD_NUMBER (below) overrides the static `CURRENT_PROJECT_VERSION`
        # literal baked into project.pbxproj so every upload gets a
        # strictly-increasing CFBundleVersion. Without it, re-archiving the
        # same source reuses the pinned build number and App Store Connect
        # rejects the duplicate ("must contain a higher version than the
        # previously uploaded") — issue #2443. A command-line build setting
        # takes precedence over the project-file value, so this reliably
        # overrides the literal at archive time.
        #
        # The value is the UTC `YYYYMMDDHHMM` timestamp computed once by the
        # `check` job (see its `build_number` step for the rationale, #3081)
        # and shared with the macOS leg through `needs.check.outputs`, so
        # both upload streams carry the same CFBundleVersion.
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
        run: |
          echo "Archiving with CFBundleVersion (CURRENT_PROJECT_VERSION) = $BUILD_NUMBER"
          # Hand the number to the submit step (#2893 W1) so it can attach the
          # build THIS run uploaded instead of whichever iOS build happens to
          # be VALID first. Same job → $GITHUB_ENV is the right channel.
          echo "ASC_EXPECTED_BUILD=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemo \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/SceneViewDemo.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=5G3DZ3TH45 \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SKETCHFAB_API_KEY="$SKETCHFAB_API_KEY"

      - name: Export IPA and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>5G3DZ3TH45</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.sceneview.demo</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SceneViewDemo.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_API_ISSUER_ID

      - name: Submit build for App Store review
        # Auto-submit on:
        #   - explicit workflow_dispatch with submit_for_review=true (legacy
        #     manual gate)
        #   - tag push starting with `v` (new — aligns with Android
        #     play-store.yml's tag-push behaviour that auto-publishes to
        #     production track + matches the implicit "tag = release"
        #     semantics across the whole repo)
        #
        # Branch pushes to `main` still upload to TestFlight only — Apple
        # review-submission is reserved for explicit release tags.
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.submit_for_review == 'true') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # versionString for the App Store record. For a tag push we read it
          # from the tag name (`refs/tags/v4.2.0` → `4.2.0`); otherwise we fall
          # back to the SDK version declared in `gradle.properties` so manual
          # workflow_dispatch from main still picks the latest committed
          # version instead of a stale hardcoded constant.
          ASC_VERSION_STRING: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}', github.ref_name) || '' }}
        run: |
          python3 -m venv $RUNNER_TEMP/asc-venv
          # Pinned exact versions — this job runs with APP_STORE_CONNECT_API_KEY
          # in env, so a compromised PyPI release must not be pullable here (#1230).
          # Deps live in a requirements file so Dependabot can track/bump them (#1286).
          # Absolute path via $GITHUB_WORKSPACE — this job sets
          # `working-directory: samples/ios-demo`, so a repo-root-relative
          # path would not resolve and the pip install would fail, skipping
          # every App Store submission (it did exactly that, silently, back
          # when this step was `continue-on-error` — #1286). Since #2731 the
          # step is fatal, so a pip failure is a loud red step.
          $RUNNER_TEMP/asc-venv/bin/pip install -r "$GITHUB_WORKSPACE/.github/workflows/requirements/app-store.txt" --quiet

          # Wait for Apple to process the build
          echo "Waiting 120s for Apple to process the build..."
          sleep 120

          # The submit program lives in .github/scripts/app_store_submit.py — it was a
          # 932-line heredoc here until #3146, which made this one step 65% of the
          # workflow file and forced its self-test to regex-carve the code back out of
          # the YAML. Nothing about the program changed in the move.
          #
          # Absolute path via $GITHUB_WORKSPACE for the same reason as the pip install
          # above: this job sets `working-directory: samples/ios-demo`, so a
          # repo-root-relative path would not resolve (#1286).
          $RUNNER_TEMP/asc-venv/bin/python3 "$GITHUB_WORKSPACE/.github/scripts/app_store_submit.py"

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true

  deploy-macos:
    name: Build & Upload macOS to App Store
    needs: check
    if: needs.check.outputs.macos_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: samples/ios-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Using Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Install the Apple certificates and provisioning profile
        env:
          # The macOS App Store flow needs TWO distinct signing certs (#2252):
          #   APP_CERT       → "Apple Distribution"             — signs the .app bundle
          #   INSTALLER_CERT → "3rd Party Mac Developer Installer" — signs the .pkg wrapper
          # Earlier runs only imported the installer cert, so xcodebuild fell back to
          # signing the .app with it too and the provisioning profile rejected it.
          # The .app cert is REUSED from the iOS pipeline's IOS_BUILD_CERTIFICATE_BASE64:
          # it already holds the team's "Apple Distribution" cert WITH an extractable
          # private key (iOS TestFlight signs with it daily), and "Apple Distribution"
          # is the unified iOS+macOS cert. This sidesteps #2252's blocker — the
          # auto-generated macOS Apple Distribution cert was non-extractable and the
          # type is maxed (2/2), and Xcode 26 rejects the legacy Mac App Distribution
          # cert for Mac App Store archives. The macOS provisioning profile must
          # reference this same Apple Distribution cert.
          APP_CERT_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          APP_CERT_PATH=$RUNNER_TEMP/app_certificate.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APP_CERT_BASE64" | base64 --decode -o $APP_CERT_PATH
          echo -n "$INSTALLER_CERT_BASE64" | base64 --decode -o $INSTALLER_CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          if ! openssl pkcs12 -in "$APP_CERT_PATH" -passin "pass:$APP_CERT_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "::error::Apple Distribution P12 password verification failed."
            exit 1
          fi
          if ! openssl pkcs12 -in "$INSTALLER_CERT_PATH" -passin "pass:$INSTALLER_CERT_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "::error::Mac Installer P12 password verification failed."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          # Import both certs into the SAME keychain so xcodebuild can find
          # the right identity for each signing step (.app vs .pkg).
          security import $APP_CERT_PATH       -P "$APP_CERT_PASSWORD"       -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import $INSTALLER_CERT_PATH -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "Installed identities:"
          security find-identity -v $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.provisionprofile
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Cache Swift Package dependencies
        uses: actions/cache@v6
        with:
          path: samples/ios-demo/SourcePackages
          # Hash the checked-in `Package.resolved` (#1360) — the nested
          # `xcshareddata/swiftpm/Package.resolved` does not exist until
          # Xcode resolves packages, so it yields a constant empty hash.
          key: spm-macos-${{ runner.os }}-${{ hashFiles('samples/ios-demo/Package.resolved') }}
          restore-keys: spm-macos-${{ runner.os }}-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme SceneViewDemo \
            -project SceneViewDemo.xcodeproj \
            -clonedSourcePackagesDirPath SourcePackages

      # Same #1909 guard as the iOS archive above — macOS App Store builds
      # share the SKETCHFAB_API_KEY secret, so the same empty/blank secret
      # would silently ship a broken Explore tab to Mac users too.
      - name: Verify Sketchfab API key wiring (#1909)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ github.workspace }}
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        run: bash .claude/scripts/verify-sketchfab-key.sh

      - name: Build archive
        # See iOS variant above for the rationale on `SKETCHFAB_API_KEY=` —
        # mirrored here so macOS App Store binaries also ship the
        # Sketchfab key substituted into `Info.plist` rather than the
        # unsubstituted `$(SKETCHFAB_API_KEY)` literal.
        #
        # BUILD_NUMBER (below) — same #2443 fix as the iOS archive above. The
        # Mac App Store stream is what actually hit the
        # duplicate-CFBundleVersion rejection (build 366 reused), so the
        # strictly-increasing build number is mandatory here. It is the UTC
        # `YYYYMMDDHHMM` timestamp the `check` job computed once for this run
        # (#3081) — read from `needs.check.outputs` rather than recomputed, so
        # this leg and the iOS leg carry the same number.
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
          BUILD_NUMBER: ${{ needs.check.outputs.build_number }}
        run: |
          echo "Archiving with CFBundleVersion (CURRENT_PROJECT_VERSION) = $BUILD_NUMBER"
          xcodebuild archive \
            -project SceneViewDemo.xcodeproj \
            -scheme SceneViewDemo \
            -destination 'generic/platform=macOS' \
            -archivePath $RUNNER_TEMP/SceneViewDemo-macOS.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=5G3DZ3TH45 \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SKETCHFAB_API_KEY="$SKETCHFAB_API_KEY"

      - name: Export and upload to App Store
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          cat > $RUNNER_TEMP/ExportOptions-macOS.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>5G3DZ3TH45</string>
            <!-- #2252: the .pkg installer is signed with the Mac Installer
                 Distribution cert. It is NEVER part of the provisioning profile
                 (profiles only carry the .app / Apple Distribution cert), so it
                 must be named explicitly here — otherwise exportArchive errors
                 "Provisioning profile … doesn't include signing certificate
                 '3rd Party Mac Developer Installer'". -->
            <key>installerSigningCertificate</key>
            <string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.sceneview.demo</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SceneViewDemo-macOS.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions-macOS.plist \
            -exportPath $RUNNER_TEMP/export-macos \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 \
            -authenticationKeyID $APP_STORE_CONNECT_API_KEY_ID \
            -authenticationKeyIssuerID $APP_STORE_CONNECT_API_ISSUER_ID

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true
