name: Build sample APKs

on:
  # Release tags and manual dispatch only. Its one unique output is the pair of
  # debug APKs attached to a GitHub Release.
  #
  # No `push: branches: [main]` any more (2026-09): ci.yml's `build` job already
  # runs the same `:samples:android-demo:assembleDebug` +
  # `:samples:android-tv-demo:assembleDebug` on every push to `main`, so the
  # main-push run here was the same build a second time (90 of 125 merges over
  # 2026-09-12..26, never red), and nothing reads its `sample-apks` artifact.
  #
  # .claude/scripts/tag-release.sh pushes release tags with GITHUB_TOKEN, and a
  # GITHUB_TOKEN push triggers no workflow — this is why it also dispatches
  # release.yml / play-store.yml / app-store.yml on the tag ref by hand, and
  # now this workflow too. Because that dispatch passes the tag as `--ref`,
  # `github.ref` resolves to `refs/tags/vX.Y.Z` exactly as it would on a real
  # tag push, so the two release-upload steps below key off
  # `startsWith(github.ref, 'refs/tags/v')` alone (no `event_name` check) —
  # same pattern as release.yml and app-store.yml. Without this wiring, every
  # release from v4.35.0 through v4.39.0 shipped with no APKs attached to its
  # GitHub Release.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# This workflow uploads GitHub Release assets via softprops/action-gh-release on
# tag pushes. A re-pushed/moved tag must NOT cancel an in-flight asset upload, or
# the Release is left partial. Matches release.yml / play-store.yml / app-store.yml.
concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sample APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Fetch binary assets (android tv)
        uses: ./.github/actions/fetch-assets
        with:
          scopes: android tv

      - uses: ./.github/actions/setup-gradle

      # Tag refs only — see #1909. A plain manual dispatch (no tag ref)
      # intentionally tolerates a missing key (forks, internal snapshots).
      # Only the tag-attached release APKs must fail-fast on a blank secret.
      - name: Verify Sketchfab API key wiring (#1909)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        run: bash .claude/scripts/verify-sketchfab-key.sh

      # One stable signing key for both APKs. Without it the runner signs them
      # with its own throwaway debug key, a new one every run: a release APK
      # could not update the previous one, and Android developer verification
      # (enforced since 2026-09-30) blocks sideloading a package whose signing
      # key is not registered in the Play Console. This key is registered there
      # for io.github.sceneview.demo and io.github.sceneview.sample.tv. The
      # samples' `githubApk` signing config takes over the debug build type only
      # when SCENEVIEW_GITHUB_KEYSTORE_FILE is set, so ci.yml and local builds
      # keep the debug key. Tag refs fail fast on a missing secret (same rule as
      # #1909); a plain manual dispatch falls back to the debug key. The file
      # lives in RUNNER_TEMP, which the runner empties at the end of the job.
      - name: Decode GitHub APK signing key
        env:
          SCENEVIEW_GITHUB_KEYSTORE_BASE64: ${{ secrets.SCENEVIEW_GITHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SCENEVIEW_GITHUB_KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::SCENEVIEW_GITHUB_KEYSTORE_BASE64 is not set: release APKs must be signed with the registered key."
              exit 1
            fi
            echo "::warning::SCENEVIEW_GITHUB_KEYSTORE_BASE64 is not set: these APKs are signed with the runner's throwaway debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/sceneview-github-apk.jks"
          printf '%s' "$SCENEVIEW_GITHUB_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "SCENEVIEW_GITHUB_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build all sample APKs
        env:
          # Read by the `githubApk` signing config only when the step above
          # exported SCENEVIEW_GITHUB_KEYSTORE_FILE.
          SCENEVIEW_GITHUB_KEYSTORE_PASSWORD: ${{ secrets.SCENEVIEW_GITHUB_KEYSTORE_PASSWORD }}
          SCENEVIEW_GITHUB_KEY_ALIAS: ${{ secrets.SCENEVIEW_GITHUB_KEY_ALIAS }}
          SCENEVIEW_GITHUB_KEY_PASSWORD: ${{ secrets.SCENEVIEW_GITHUB_KEY_PASSWORD }}
          # Optional. When unset (forks, PRs from forks), the demo's runtime
          # check disables Streetscape / Geospatial / Cloud Anchors gracefully.
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
          # Optional. When unset, the demo's Sketchfab gallery falls back to
          # the bundled featured models and disables search. See
          # samples/android-demo/.../sketchfab/ for the BuildConfig wiring.
          SKETCHFAB_API_KEY: ${{ secrets.SKETCHFAB_API_KEY }}
        # `-PdemoPlainDebug=true`: this debug APK is the public one (GitHub
        # Release asset, tools/try-demo.sh --download, docs/docs/try.md), so it
        # keeps the plain `io.github.sceneview.demo` id, "SceneView" label and
        # store icon. Without it the android-demo debug build is the side-by-side
        # QA app (`io.github.sceneview.demo.qa`, "SV QA") — see #4138.
        run: |
          ./gradlew \
            :samples:android-demo:assembleDebug \
            :samples:android-tv-demo:assembleDebug \
            -PdemoPlainDebug=true \
            --console=plain

      - name: Collect APKs
        run: |
          mkdir -p dist
          for sample in android-demo android-tv-demo; do
            apk=$(find "samples/$sample/build/outputs/apk/debug" -name "*.apk" | head -1)
            if [ -n "$apk" ]; then
              cp "$apk" "dist/sceneview-${sample}.apk"
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: sample-apks
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
