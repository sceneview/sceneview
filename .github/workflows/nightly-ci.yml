name: Nightly full CI

# WHY THIS EXISTS (#1324)
# ----------------------
# After the main-CI slimming pass (#1311 / #1321), several heavy workflows
# are strictly path-gated on `main`:
#   - `CI`               — per-job path filter; skips jobs whose scope is untouched.
#   - `Render Tests`     — runs only on render-affecting source changes.
#   - `Build sample APKs`— runs only on real code/build-script changes.
#   - `Deploy ... Play Store` — tag-only.
# That is the right trade-off for the high-merge-rate cycle, but it means
# NO single scheduled run exercises the full validation surface end-to-end.
#
# This workflow closes that gap: once a night it runs the heavy legs whose
# inputs changed since the last successful scheduled run. If `main` HEAD is
# unchanged, the already-green result is reused and no heavy runner starts.
#
# It REUSES the existing workflows via `workflow_call` instead of duplicating
# their job bodies. A manual dispatch still bypasses every path gate and runs
# the complete validation surface.
#
# It is deliberately NOT a required check — it is a scheduled safety net,
# not a PR gate.

on:
  schedule:
    # 04:00 UTC daily — low-traffic window.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Changes since the last successful scheduled run ───────────────────────
  # The 2026-10-19 audit measured 2.9 runner-hours per night re-running the
  # same SHA already covered by push CI. Scheduled runs reuse the last green
  # night's SHA for per-leg path gates and skip every heavy workflow when HEAD
  # is identical. A manual dispatch always runs everything.
  nightly-changes:
    name: Detect changes since last successful nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-heavy: ${{ steps.changes.outputs.run-heavy }}
      base-sha: ${{ steps.changes.outputs.base-sha }}
    steps:
      - name: Find the last successful scheduled SHA
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "base-sha=" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — running every nightly leg."
            exit 0
          fi
          LAST_SHA=$(gh run list --repo "$REPO" --workflow nightly-ci.yml \
            --event schedule --status success -L 1 --json headSha \
            --jq '.[0].headSha // ""' 2>/dev/null || true)
          if [ -z "$LAST_SHA" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "base-sha=" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful scheduled nightly found; running every leg."
          elif [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "run-heavy=false" >> "$GITHUB_OUTPUT"
            echo "base-sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
            echo "HEAD matches the last successful nightly ($LAST_SHA); skipping heavy legs."
          else
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "base-sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
            echo "Diffing nightly legs from $LAST_SHA to $CURRENT_SHA."
          fi

  # ── Full CI build/lint/test (path filter bypassed) ────────────────────────
  # Scheduled runs dispatch only changed path groups; manual runs force all.
  full-ci:
    name: Full CI (forced)
    needs: nightly-changes
    if: needs.nightly-changes.outputs.run-heavy == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      force-all: ${{ github.event_name == 'workflow_dispatch' || needs.nightly-changes.outputs.base-sha == '' }}
      base-sha: ${{ needs.nightly-changes.outputs.base-sha }}
    secrets: inherit

  # ── Render tests (emulator + iOS Simulator + Playwright web) ──────────────
  render-tests:
    name: Render tests
    needs: nightly-changes
    if: needs.nightly-changes.outputs.run-heavy == 'true'
    uses: ./.github/workflows/render-tests.yml
    with:
      base-sha: ${{ needs.nightly-changes.outputs.base-sha }}
    secrets: inherit

  # ── Device-QA harness (Maestro Android + Playwright web) ──────────────────
  # The autonomous cross-platform device-QA orchestrator (umbrella #1560,
  # slice #1566). Path-gated on `main` so it does not run per-push for
  # unrelated changes; the nightly run forces it so a harness/demo regression
  # still surfaces within 24h. Its Android leg is `continue-on-error`
  # internally (SwiftShader/Maestro flake), so it does not spam issues.
  device-qa:
    name: Device QA
    needs: nightly-changes
    if: needs.nightly-changes.outputs.run-heavy == 'true'
    uses: ./.github/workflows/device-qa.yml
    with:
      base-sha: ${{ needs.nightly-changes.outputs.base-sha }}
    secrets: inherit

  # ── Nightly health surfacing (#2732) ──────────────────────────────────────
  # v1 reported from the END of the run (`needs: [full-ci, render-tests]`,
  # `if: needs.full-ci.result == 'failure'`) and was blind three ways:
  #   - a CANCELLED run kills its own report job — the 2026-07-09→07-16 week
  #     of nightly `cancelled` runs (hang → next night's concurrency cancel)
  #     produced zero reports;
  #   - `cancelled` never matched `== 'failure'` anyway;
  #   - `render-tests` result was ignored and `device-qa` wasn't in `needs`.
  # v2 therefore grades from the START of the run, where nothing can be
  # cancelled yet: it looks at the last TWO completed *scheduled* nights
  # (run-level conclusion covers every leg — any non-success of full-ci /
  # render-tests / device-qa flips the run) and opens/updates the tracking
  # issue only when BOTH were bad — the 2-consecutive-nights anti-noise rule,
  # which absorbs one-off SwiftShader or runner flakes. Leg-level detail is
  # pulled from the most recent bad run's job list; `skipped` sub-jobs are
  # NOT named (path-gated skips inside the reused workflows are legitimate),
  # a leg-level `cancelled` or `failure` is. Manual workflow_dispatch runs
  # are excluded from the streak (`--event schedule`) so a manual green run
  # cannot mask a sick schedule.
  nightly-health:
    name: Nightly health check (last 2 nights)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Grade the last two completed nights
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Our concurrency group cancels a still-running previous night when
          # this run starts; give that dying run a bounded window to reach a
          # terminal state so the streak is graded on fresh data (otherwise
          # the grading is off by one night — still correct, just staler).
          for attempt in 1 2 3 4; do
            NEWEST_OTHER=$(gh run list --repo "$REPO" --workflow=nightly-ci.yml \
              --event schedule --limit 3 --json databaseId,status \
              --jq "[.[] | select(.databaseId != ${CURRENT_RUN_ID})][0].status" 2>/dev/null || echo "")
            [ "$NEWEST_OTHER" = "in_progress" ] || [ "$NEWEST_OTHER" = "queued" ] || break
            echo "Previous night still terminating (attempt $attempt/4) — waiting 30s..."
            sleep 30
          done
          # `|| echo "[]"` (a valid empty array, NOT ""): under `set -e` an
          # unguarded transient API blip would red this job, flip the run
          # conclusion, and feed a manufactured "bad night" back into the
          # very signal this job grades (review finding, PR #2743). An empty
          # array degrades to the honest "nothing to grade" branch instead.
          RUNS=$(gh run list --repo "$REPO" --workflow=nightly-ci.yml \
            --event schedule --status completed --limit 2 \
            --json databaseId,conclusion,url 2>/dev/null || echo "[]")
          COUNT=$(jq 'length' <<<"$RUNS")
          if [ "$COUNT" -lt 2 ]; then
            echo "Fewer than 2 completed scheduled nights on record — nothing to grade."
            exit 0
          fi
          C1=$(jq -r '.[0].conclusion' <<<"$RUNS")   # most recent completed night
          C2=$(jq -r '.[1].conclusion' <<<"$RUNS")   # the night before it
          echo "Last two scheduled nights: $C1 (newest), $C2"
          if [ "$C1" = "success" ]; then
            echo "Most recent night is green — healthy."
            exit 0
          fi
          if [ "$C2" = "success" ]; then
            echo "One bad night ($C1) — holding fire (anti-noise #2732: reports need 2 consecutive bad nights)."
            exit 0
          fi
          ID1=$(jq -r '.[0].databaseId' <<<"$RUNS")
          URL1=$(jq -r '.[0].url' <<<"$RUNS")
          URL2=$(jq -r '.[1].url' <<<"$RUNS")
          LEGS=$(gh run view "$ID1" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "- \(.name): **\(.conclusion)**"] | join("\n")' \
            2>/dev/null || echo "_job details unavailable_")
          [ -n "$LEGS" ] || LEGS="_no per-job detail (run-level: $C1)_"
          BODY=$(printf '%s\n' \
            "The nightly safety net has been unhealthy for **2+ consecutive scheduled nights** (#2732)." \
            "" \
            "| Night | Conclusion |" \
            "|---|---|" \
            "| $URL1 | $C1 |" \
            "| $URL2 | $C2 |" \
            "" \
            "Non-success legs of the most recent bad night:" \
            "$LEGS" \
            "" \
            "If the full-ci leg hung, the unit-test job uploads a thread-dump artifact since #2716 — check the run's artifacts for the culprit test." \
            "" \
            "A cancelled night usually means the run hung until the next night's concurrency group killed it — treat it as a failure, not noise.")
          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"Nightly CI unhealthy\" in:title" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$REPO" \
              --title "Nightly CI unhealthy — 2+ consecutive bad nights" \
              --body "$BODY" \
              --label "ci" \
              || echo "::warning::Could not create nightly-health issue"
          else
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" \
              || echo "::warning::Could not comment on existing nightly-health issue #$EXISTING"
          fi
