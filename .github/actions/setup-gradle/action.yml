name: Set up Gradle
description: |
  Installs the JDK, configures Gradle caching, and makes ./gradlew executable.
  Used by every workflow that invokes ./gradlew so the JDK/cache snippet
  lives in exactly one place.

inputs:
  java-version:
    description: JDK major version (e.g. 17 for Flutter jobs, 21 for everything else)
    required: false
    default: "21"
  java-distribution:
    description: JDK distribution (temurin, zulu, etc.)
    required: false
    default: temurin

runs:
  using: composite
  steps:
    # One JDK. Until #4423, `:sceneview-compose` and `:samples:desktop-demo`
    # pinned `jvmToolchain(22)` for filament-kmp's FFM binding, and Gradle
    # configures every included subproject on any root `./gradlew`, so every
    # job also installed a JDK 22. filament-kmp 0.7+ is JNI and both modules
    # are on `jvmToolchain(21)`, the default below. The jobs that pass 17
    # (Flutter, React Native) build standalone projects through `-p`, which
    # never configure the root build; if one ever does, settings.gradle's
    # foojay resolver provisions JDK 21 rather than failing.
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    # The basic provider keys by OS/architecture plus the Gradle build files,
    # not by workflow and job. The 2026-10-19 audit found 12 job-specific
    # copies using 10.94 GB against the repo's 10 GB limit; one shared key lets
    # jobs that build the same graph reuse one entry instead.
    # Only `main` writes. PRs, tags, other branches and self-hosted runners
    # restore that shared entry without creating another copy.
    #
    # A self-hosted runner never writes (#3469). Its Gradle User Home is the
    # machine's own `~/.gradle`, which the action refuses to restore into
    # anyway ("Gradle User Home already exists: will not restore from cache"),
    # so nothing saved from it is ever consumed by that machine — yet on every
    # `main` push the post-step tarred and uploaded that whole home. On
    # `sceneview-mac` that meant a 2.2 GB + 3.0 GB upload still at
    # `Sent 1073741824 of 2201734690 (48.8%), 0.6 MBs/sec` when the job's
    # 30 min timeout fired (job 100769714909), or a transfer stuck at
    # `Sent 0 of 1269721491 (0.0%), 0.0 MBs/sec` for the full 30 min (job
    # 100796430540): every `main` push that reached the iOS-sim job ended
    # `cancelled` in `Post Run ./.github/actions/setup-gradle` with the tests
    # green in ~20 s, while the same commits' PR runs (read-only) spent 0 s
    # there. The save also ran `gradle --stop` against the developer's live
    # daemons and pushed multi-GB macOS entries into a repo cache already at
    # 14.5 GB active against the 10 GB quota, evicting the Linux entries every
    # hosted job restores.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        cache-read-only: ${{ github.ref != 'refs/heads/main' || runner.environment == 'self-hosted' }}

    # Verify the checked-in gradle-wrapper.jar matches the SHA of a known-good
    # Gradle distribution. A malicious PR can otherwise sneak a tampered
    # wrapper jar into the repo and have it executed by every downstream
    # `./gradlew` call. Centralised here so every workflow that calls
    # `./gradlew` inherits the guard.
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
