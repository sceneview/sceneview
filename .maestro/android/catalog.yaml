# Maestro MASTER flow — full SceneView Android demo catalog QA.
#
#   maestro test .maestro/android/catalog.yaml
#
# This is the Android leg of the autonomous device-QA harness (umbrella #1560,
# slice #1562). It drives every one of the 49 registered demos in
# `samples/android-demo` like a real user — deep-link launch, camera orbit
# drag, viewport tap, one screenshot per demo, navigate back — and asserts
# each demo's Activity stays alive (a crash drops the "Navigate back"
# affordance, failing the flow).
#
# It delegates to six sub-flows. NOTE (#2239): those six files are QA
# GROUPINGS, and since the catalogue regroup they no longer mirror the app's
# nine catalogue sections (Viewer, Geometry & Materials, Rendering,
# Interaction, AR Placement, AR Tracking, AR Understanding, AR Anchors,
# Platform — see DEMO_CATEGORIES). They were deliberately left alone: every
# leg still resolves, and re-cutting the files would have churned the QA
# surface for a rename. Splitting them along the new sections is tracked in
# the #2239 follow-up.
#
# Demo ids mirror ALL_DEMOS in samples/android-demo .../DemoRegistry.kt, PLUS
# retired-alias ids (DeepLinkRouter.DEMO_ID_ALIASES) that pre-select the modes
# of the consolidated demos that absorbed them — so every registered demo AND
# every merged-in capability gets its own QA leg. That is why `fog`,
# `gesture-feedback-preview`, `ar-terrain`, `ar-rooftop` and `ar-streetscape`
# still appear below after #2239 / #3463 retired their cards: driving the
# retired id is how the merged mode gets exercised. Flow entries:
#   3d-basics.yaml ....... 5
#   lighting.yaml ........ 5
#   content.yaml ......... 2
#   interaction.yaml ..... 4
#   advanced.yaml ........ 14
#   ar.yaml .............. 33
#                          --
#   Total entries ........ 63  (covering 49 registered demos, 63 capabilities)
#
# Crash detection:
#   - Per-demo: flows/demo.yaml asserts the "Navigate back" button is visible
#     after interaction — a process crash makes that assertion fail.
#   - FATAL / ANR logcat sweep: Maestro 1.39 cannot read logcat from a flow.
#     The orchestrator runner (umbrella slice #1566, `device-qa.sh`) clears
#     logcat before this flow and greps it for `FATAL EXCEPTION` / `ANR in`
#     afterwards. Run this flow through that runner for the full crash gate;
#     run it directly for a quick interactive smoke.
#
# Zoom QA (#1571):
#   Maestro has no pinch gesture, so 3D camera zoom cannot be driven by touch.
#   It is driven by a deep-link param instead: the demo registry (DeepLinkRouter
#   / the intent extras) exposes a `camera_distance` extra (any Bundle type —
#   Maestro delivers a String, `adb --ef` a Float, #2652) and a
#   `sceneview://demo/<id>?cameraDistance=<f>` query parameter that override the
#   3D hero-orbit camera distance. flows/demo.yaml has an optional zoom section
#   (gated on the CAMERA_DISTANCE env var) that re-launches a demo at a near +
#   far framing; 3d-basics.yaml sets CAMERA_DISTANCE on model-viewer so this
#   master flow exercises zoom on exactly one representative 3D demo.
#
# AR demos require the ARCore-friendly emulator from
# `.claude/scripts/setup-ar-emulator.sh`.
appId: io.github.sceneview.demo
---
- runFlow: 3d-basics.yaml
- runFlow: lighting.yaml
- runFlow: content.yaml
- runFlow: interaction.yaml
- runFlow: advanced.yaml
- runFlow: ar.yaml
