# Reusable Maestro subflow — exercises ONE SceneView demo like a real user.
#
# Called by the per-category flows and by catalog.yaml via `runFlow` with an
# `env:` block. It never appears in a flow runner by itself.
#
# Required parameters (passed by the caller):
#   DEMO_ID    Stable demo id from ALL_DEMOS (e.g. "model-viewer", "ar-pose").
#   DEMO_NAME  Human label, used only for screenshot file naming / readable logs.
#
# Optional parameters:
#   CAMERA_DISTANCE  Camera-to-model distance (zoom level), in metres. When the
#                    caller sets it (non-empty), an extra section at the end of
#                    this subflow re-launches the demo twice more — once near,
#                    once far — to exercise 3D camera zoom, which Maestro cannot
#                    do by pinch (#1571). Omit it for the plain single-screenshot
#                    sweep — the zoom section is typeof-guarded, so an omitted
#                    (undefined) value skips cleanly. Do NOT give it an `env:`
#                    default in this subflow: a subflow-level default MASKS the
#                    caller's value (Maestro subflow env precedence, #2633).
#
# Strategy:
#   - launchApp with the `demo` + `qa_mode` intent extras so we jump straight
#     to the demo screen — no tab navigation, no list scrolling. Maestro's
#     `launchApp` has no `deepLink` property (that key is silently unparsed and
#     aborts the flow on Maestro 1.39); instead `arguments:` are delivered as
#     intent extras on the launch intent — booleans as `--ez`-style boolean
#     extras, and env-interpolated values (`${CAMERA_DISTANCE}`) as **String**
#     extras, NOT `--ef` floats (verified on-emulator, Maestro 2.6.1 — #2652;
#     MainActivity coerces the extra type-agnostically for this reason).
#     `MainActivity` reads `--es demo <id>` (the QA
#     ingress channel, `DeepLinkRouter.validate`) before any URL deep link, so
#     this routes through the very same closed-registry allow-list the public
#     `sceneview://demo/<id>` scheme uses (DeepLinkRouter.parse / .validate).
#   - the `qa_mode` boolean extra freezes auto-rotation / orbit / animations so
#     the single screenshot is deterministic frame-to-frame.
#   - Exercise REAL interaction: drag to orbit the camera, swipe to pan, tap
#     the centre of the viewport (hits demo controls / picks nodes). 3D zoom
#     has no Maestro pinch gesture, so it is driven by the `camera_distance`
#     deep-link param instead — see the optional zoom section below (#1571).
#   - Capture exactly ONE screenshot per demo (no screenshot-by-screenshot
#     loop — that was the slow pattern in the old qa-android-demos.sh). The
#     optional zoom section adds two more (near + far) when CAMERA_DISTANCE set.
#   - Wait for the viewport's own "Scene ready" node BEFORE interacting, and
#     assert it again before capturing (#3444). The scaffold publishes it only
#     once a frame has actually reached the surface, so it is the app's own
#     "there are pixels" signal — liveness alone passed a black demo, and the
#     loading cover swallows touches, so swiping before it lifts orbited nothing.
#   - Assert the app process is still foregrounded afterwards. A crash would
#     drop us out of the app; `assertVisible` on any app element then fails the
#     flow. A FATAL/ANR sweep of logcat is done once, globally, by catalog.yaml.
appId: io.github.sceneview.demo
# NOTE: deliberately NO `env:` default for CAMERA_DISTANCE here. A default
# declared in THIS subflow's own `env:` block MASKS the value the caller passes
# via `runFlow → env:` — that inverted precedence is exactly what silently
# disabled the zoom QA (#1571) for two releases (root cause of #2633, verified
# on Maestro 2.6.1/GraalJS: a child `env:` default wins over the parent's
# `runFlow → env:` value). Callers pass CAMERA_DISTANCE just like DEMO_ID; when
# omitted it is `undefined`, and the optional zoom section below is
# typeof-guarded so it skips cleanly.
---
# Cold-launch straight into the demo. `arguments:` become intent extras on the
# launch intent — `demo` (string, `--es`) drives MainActivity's QA ingress
# channel (DeepLinkRouter.validate against ALL_DEMOS), `qa_mode` (boolean,
# `--ez`) freezes animation for a deterministic screenshot. `stopApp: true`
# guarantees a cold start so the new extras are read in onCreate.
- launchApp:
    appId: io.github.sceneview.demo
    clearState: false
    stopApp: true
    arguments:
      demo: ${DEMO_ID}
      qa_mode: true
      qa_backdrop: true

# --- Wait for real pixels, then interact (#3444) ---------------------------
# Liveness alone let a BLANK demo pass: `materials` renders a black viewport for
# its first ~10-14 s on the QA emulator (Filament refuses frames — 4 presented in
# 6.3 s — while the GPU warms the ToyCar's clearcoat / sheen / transmission
# variants). Nothing here noticed, because the Activity was perfectly alive the
# whole time, and the screenshot below landed in that window.
#
# The app now states the difference honestly: `SceneView(onFrame = …)` fires only
# for a frame that actually reached the surface, and the viewport names its own
# state — "Scene loading" while the cover is up, "Scene ready" once there are
# real pixels. Waiting for the POSITIVE node is what makes this a gate: waiting
# for the cover to be *absent* passed in the instant between `launchApp` and the
# first composition, and the flow then swiped at a covered viewport and captured
# a black frame anyway (measured on emulator-5554 — that run is why this is not
# a `notVisible` step). It also has to come BEFORE the swipes: the cover swallows
# touches, so interacting first orbited nothing.
#
# AR demos pass `firstFrameRendered = null` (their viewport is the camera feed),
# so they publish "Scene ready" as soon as they compose and this passes at once.
- extendedWaitUntil:
    visible: "Scene ready"
    timeout: 30000
    label: "Wait for the scene's first presented frame"

# Settle the cover's cross-fade before touching the viewport.
- waitForAnimationToEnd:
    timeout: 3000

# --- Real user interaction -------------------------------------------------
# Orbit the camera: drag across the viewport. Two opposite drags so we exercise
# the manipulator in both directions and return roughly to the start framing.
- swipe:
    start: 30%, 55%
    end: 70%, 55%
    duration: 600
- swipe:
    start: 70%, 55%
    end: 30%, 55%
    duration: 600

# Vertical drag — tilts the orbit camera / pans 2D-content demos.
- swipe:
    start: 50%, 65%
    end: 50%, 40%
    duration: 600

# Tap the centre of the viewport: in interaction demos this picks a node, in
# control-strip demos it is a harmless empty-space tap. Either way it must not
# crash.
- tapOn:
    point: 50%, 55%

# Give any tap-triggered work (node selection, gesture handlers, AR hit-test)
# a moment to settle before the screenshot.
- waitForAnimationToEnd:
    timeout: 3000

# --- The captured frame is not blank (#3444) -------------------------------
# The wait above already held for a presented frame; assert it at capture time,
# so a demo that stopped presenting fails HERE instead of passing on liveness
# with a black PNG.
- assertVisible: "Scene ready"

# --- One screenshot per demo ----------------------------------------------
# Maestro writes screenshots to its output dir; the file name keys off DEMO_ID
# so a category run produces one PNG per demo with no overwrites.
- takeScreenshot: "demo-${DEMO_ID}"

# --- Liveness assertion ----------------------------------------------------
# If the demo had crashed, the process would be gone and we'd be on the
# launcher / a system dialog — the back button's content description would not
# be present. This is the per-demo crash gate.
- assertVisible:
    id: "io.github.sceneview.demo:id/decor_content_parent"
    optional: true
# Belt-and-braces: the demo scaffold always renders a "Navigate back" button.
# Its presence proves the demo Activity is still foregrounded and composed.
- assertVisible: "Navigate back"

# --- Navigate back ---------------------------------------------------------
# Return to the demo list so a subsequent flow step starts from a known state.
- tapOn: "Navigate back"
- waitForAnimationToEnd:
    timeout: 2000

# --- Optional: 3D camera zoom QA (#1571) -----------------------------------
# Maestro has no pinch gesture, so 3D camera zoom is driven by a deep-link
# param instead. When the caller sets CAMERA_DISTANCE (non-empty), re-launch
# the demo at a NEAR framing then a FAR framing — the `camera_distance` extra
# (delivered by Maestro as a String; coerced type-agnostically by MainActivity
# → DeepLinkRouter.coerceCameraDistanceExtra, #2652) feeds
# DemoSettings.cameraDistance, and the shared hero-orbit camera frames the
# model at that distance. Each launch is a cold start (stopApp: true) so the
# extra is read fresh in onCreate. Two extra screenshots (-zoom-near /
# -zoom-far) let a visual diff confirm the scene reframes.
#
# The gate is typeof-guarded, NOT a bare `${CAMERA_DISTANCE != ""}`. Most
# callers never set CAMERA_DISTANCE, so it is `undefined` here; under Maestro
# 2.6.1/GraalJS `undefined != ""` evaluates to TRUE (it does not throw), so a
# bare condition would fire the zoom for EVERY demo. The `typeof` guard
# short-circuits on the undefined case so the section skips cleanly, and fires
# only when a caller actually passed a non-empty distance (#2633 / #1571).
- runFlow:
    when:
      true: ${typeof CAMERA_DISTANCE !== 'undefined' && CAMERA_DISTANCE !== ''}
    commands:
      # Near framing — a small camera distance zooms IN on the model.
      - launchApp:
          appId: io.github.sceneview.demo
          clearState: false
          stopApp: true
          arguments:
            demo: ${DEMO_ID}
            qa_mode: true
            qa_backdrop: true
            camera_distance: ${CAMERA_DISTANCE}
      - waitForAnimationToEnd:
          timeout: 6000
      # Cold-start render settle (#2652). Each zoom relaunch is a cold start,
      # and ~6 s is NOT enough for engine warm-up + model + IBL load on the
      # emulator — the base screenshot above only renders because ~12 s of
      # orbit swipes incidentally elapse before it. Worse, `qa_mode` freezes
      # scene animation, so `waitForAnimationToEnd` returns as soon as the UI
      # is static — a frozen BLACK viewport is "settled" to it. Without a real
      # settle both zoom captures land on that black cold-start viewport,
      # byte-identical, and the near-vs-far diff proves nothing.
      #
      # No swipes here, deliberately: a drag hands the camera to the ORBIT
      # fallback manipulator for ~3 s (HeroOrbitCameraManipulator
      # resumeAfterMillis), which would race the screenshot with a
      # non-canonical angle. Zero interaction keeps the frozen-QA framing
      # (staticYaw 45°, radius = camera_distance) — the near/far diff then
      # isolates exactly one variable: the orbit radius.
      #
      # 1) Wait for the demo's model-load scrim text to clear — the explicit
      #    "model instance is now in the scene" signal (model-viewer shows
      #    "Loading model…"; other demos "Loading helmet…", "Streaming…", …).
      #    Demos without a scrim (or already loaded) pass through instantly.
      #    `optional`: a wedged scrim must not abort the zoom section — the
      #    screenshot then shows the wedged state honestly.
      - extendedWaitUntil:
          notVisible: "(Loading|Streaming).*"
          timeout: 20000
          optional: true
          label: "Zoom-near: wait for model-load scrim to clear"
      # 2) Wait for a frame that actually reached the surface (#3444). The
      #    scrim clears when the model INSTANCE exists, not when a lit frame is
      #    presented — IBL load and shader compilation still follow, which is
      #    why this step used to be a fixed 9 s guess (a wait on a marker that
      #    never exists, `optional` turning the timeout into a sleep). The
      #    scaffold's "Scene loading" cover now lifts exactly on that lit
      #    frame, so the guess becomes a measurement: the leg waits no longer
      #    than it must, and a zoom capture with nothing on screen fails
      #    instead of being taken.
      - extendedWaitUntil:
          visible: "Scene ready"
          timeout: 30000
          label: "Zoom-near: wait for the first presented frame"
      # 3) Settle any scrim cross-fade still in flight (mirrors the base
      #    path's pre-screenshot settle).
      - waitForAnimationToEnd:
          timeout: 3000
      - assertVisible: "Navigate back"
      - takeScreenshot: "demo-${DEMO_ID}-zoom-near"
      - tapOn: "Navigate back"
      - waitForAnimationToEnd:
          timeout: 2000
      # Far framing — a large camera distance zooms OUT. 40 m is comfortably
      # within DeepLinkRouter.CAMERA_DISTANCE_MAX (100 m); the model shrinks
      # but stays framed, proving the orbit-radius override took effect.
      - launchApp:
          appId: io.github.sceneview.demo
          clearState: false
          stopApp: true
          arguments:
            demo: ${DEMO_ID}
            qa_mode: true
            qa_backdrop: true
            camera_distance: "40"
      - waitForAnimationToEnd:
          timeout: 6000
      # Same cold-start render settle as the near framing above (#2652).
      - extendedWaitUntil:
          notVisible: "(Loading|Streaming).*"
          timeout: 20000
          optional: true
          label: "Zoom-far: wait for model-load scrim to clear"
      - extendedWaitUntil:
          visible: "Scene ready"
          timeout: 30000
          label: "Zoom-far: wait for the first presented frame"
      - waitForAnimationToEnd:
          timeout: 3000
      - assertVisible: "Navigate back"
      - takeScreenshot: "demo-${DEMO_ID}-zoom-far"
      - tapOn: "Navigate back"
      - waitForAnimationToEnd:
          timeout: 2000
