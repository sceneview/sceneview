# Maestro flow — the AR demos (33 legs).
#
# Since #2239 the app splits these across four catalogue sections (AR Placement,
# AR Tracking, AR Understanding, AR Anchors); this file stays one QA grouping —
# see the note in catalog.yaml.
#
# `ar-instant-placement` was folded into `ar-placement` (#3405) — its subject is a
# mode of that demo now, and its deep link resolves through DEMO_ID_ALIASES.
#
# `ar-terrain` and `ar-rooftop` were folded into `ar-geospatial-anchors` (#2239).
# Both legs are KEPT: each drives its retired id, and ALIAS_INITIAL_TAB lands them
# on the Terrain and Rooftop modes respectively, so both capabilities keep their
# own QA leg.
#
# Run a fast subset of the device-QA harness:
#   maestro test .maestro/android/ar.yaml
#
# AR demos need the ARCore-friendly emulator from
# `.claude/scripts/setup-ar-emulator.sh` (virtualscene back camera, host GPU,
# Google Play Services for AR installed). They launch a live `ARSceneView`;
# the deep-link flow still exercises tap + drag on the camera surface and
# asserts the process stays alive — AR tracking quality itself is covered by
# the ARCore MP4 replay harness (umbrella #1560, slice #1565), not here.
#
# Each demo is exercised by the reusable flows/demo.yaml subflow. Demo ids
# mirror ALL_DEMOS in samples/android-demo .../DemoRegistry.kt.
appId: io.github.sceneview.demo
---
# The AR View tab's LIVE session (consumer entry, not a deep-linked demo) —
# launcher → Start AR Camera → unified tap-to-place overlay → back-arrow exit.
# Closes the QA gap that let #2476 ship (#2482 PR 4/4).
- runFlow:
    file: flows/ar-view-live.yaml
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-placement
      DEMO_NAME: AR Placement
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-image
      DEMO_NAME: AR Image
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-face
      DEMO_NAME: AR Face
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-cloud-anchor
      DEMO_NAME: AR Cloud Anchor
# Cloud Anchors gets a second, state-driven pass on top of the generic liveness
# sweep (#3421): its host / resolve states need a live Cloud project and a second
# device, so none of them are reachable on an emulator without `--es qa_state`.
- runFlow:
    file: flows/ar-cloud-anchor.yaml
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-streetscape
      DEMO_NAME: AR Streetscape
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-pose
      DEMO_NAME: AR Pose
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-rerun
      DEMO_NAME: AR Rerun Debug
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-record-playback
      DEMO_NAME: AR Record & Playback
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: ar-depth-occlusion
      DEMO_NAME: AR Depth Occlusion
