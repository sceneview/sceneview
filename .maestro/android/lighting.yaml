# Maestro flow — "Lighting & Environment" demo category.
#
# Run a fast subset of the device-QA harness:
#   maestro test .maestro/android/lighting.yaml
#
# Each demo is exercised by the reusable flows/demo.yaml subflow. Demo ids
# mirror ALL_DEMOS in samples/android-demo .../DemoRegistry.kt; DEMO_NAME is
# only a label for the screenshot file names and the log.
#
# Two live cards carry the subject since #3496: `lighting` (the showcase — three
# rigs over one stage) and `lighting-lab` (the workbench — every knob on one
# frame). The retired-id legs below are KEPT ON PURPOSE: they are what exercises
# `DEMO_ID_ALIASES` + `ALIAS_INITIAL_TAB`, and each one lands on the half that
# now hosts its subject — `dynamic-sky` on the Sun rig of `lighting`,
# `environment` on its Image rig, `fog` on the lab. Deleting a leg would delete
# the coverage, not the redundancy.
appId: io.github.sceneview.demo
---
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: lighting
      DEMO_NAME: Lighting
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: dynamic-sky
      DEMO_NAME: Lighting Sun Rig
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: lighting-lab
      DEMO_NAME: Lighting Lab
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: fog
      DEMO_NAME: Lighting Lab Fog
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: environment
      DEMO_NAME: Lighting Image Rig
# Follows the demo's move out of the AR category (#2851): the contact shadow lives in
# `sceneview`, not `arsceneview`, and the screen is a plain non-AR studio scene. Verified
# absent from every other flow before adding it here — ar.yaml never carried it (34 header,
# 34 entries) — so this is the demo's first automated coverage, not a relocation.
- runFlow:
    file: flows/demo.yaml
    env:
      DEMO_ID: contact-shadow-preview
      DEMO_NAME: Contact Shadow Preview
