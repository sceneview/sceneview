# Reusable Maestro subflow — smoke for a deep-link id that has NO iOS
# destination wired up.
#
# Since #3231 such an id is also NOT in `DemoDeepLinkRegistry.allowedIds` and
# has no Samples card: a showcase app does not present a card that opens a
# "Coming soon" dead end. The deep link still resolves — `SceneViewDemoApp
# .onOpenURL` forwards the unregistered candidate to `DemoDeepLinkRegistry
# .destination(for:)`, which answers with the `DeepLinkPlaceholder` view, a
# friendly "this demo isn't available in the iOS app yet" screen. That fallback
# is what keeps website / README QR codes for Android-only demos from 404-ing,
# so this subflow is now the only thing guarding the cross-platform
# `sceneview://demo/<id>` contract for those ids.
#
# This subflow proves the router + placeholder path itself does not crash:
# launch, fire the deep link, assert the placeholder rendered (its "Demo:"
# title is keyed on the id, so it doubles as a routing assertion).
#
# Required parameters (passed by the caller):
#   DEMO_ID    Stable deep-link id with no iOS destination.
#
# When one of these ids gains a real iOS destination, move it out of the
# placeholder set into the matching per-category flow with a real ASSERT_TEXT.
appId: io.github.sceneview.demo
---
- launchApp:
    appId: io.github.sceneview.demo
    stopApp: true
    clearState: false

- openLink: "sceneview://demo/${DEMO_ID}"

# The placeholder renders `Text("Demo: <id>")` — keyed on the id, so this is
# both a liveness check and a routing assertion.
- extendedWaitUntil:
    visible: "Demo: ${DEMO_ID}"
    timeout: 8000

- takeScreenshot: "placeholder-${DEMO_ID}"

- assertVisible: "Demo: ${DEMO_ID}"
