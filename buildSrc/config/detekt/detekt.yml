# Detekt configuration for SceneView
# Builds upon the default config — only overrides are listed here.
#
# This file targets detekt 2.x property names. Several property names changed
# from 1.23.x (e.g. functionThreshold -> allowedFunctionParameters,
# threshold -> allowedComplexity / allowedLines, UnusedPrivateMember split into
# UnusedPrivateClass / UnusedPrivateFunction / UnusedPrivateProperty).
# See #1740.
#
# WHAT DETEKT IS FOR HERE
# -----------------------
# Detekt runs to catch likely bugs — the `potential-bugs`, `coroutines`,
# `exceptions`, `empty-blocks` and `performance` rule sets, plus the dead-code
# rules in `style` (unused private members, unused imports). The 30-day audit
# that ended on 2026-10-19 counted ~40 red branches and zero real catches, all
# on formatting, naming and size/complexity thresholds (MaxLineLength alone 19
# times). Those rules are off: they cost a CI round-trip and caught nothing.
# Do not re-enable one without a bug it would have caught.

complexity:
  # Size and complexity thresholds (LongMethod, CyclomaticComplexMethod,
  # LongParameterList, TooManyFunctions, LargeClass, ComplexCondition,
  # NestedBlockDepth, ...) — none of them is a bug signal.
  active: false

naming:
  # Naming conventions (MatchingDeclarationName, TopLevelPropertyNaming,
  # VariableNaming, FunctionNaming, ...) — pure style.
  active: false

style:
  MagicNumber:
    # 3D code is full of legitimate numeric constants (coordinates, angles, etc.)
    active: false
  # UnusedPrivateMember was split in detekt 2.x; we keep all three sub-rules
  # active with the same _.*|serialVersionUID exemption that the 1.x config had.
  UnusedPrivateFunction:
    active: true
    allowedNames: '_.*'
  UnusedPrivateProperty:
    active: true
    allowedNames: '_.*|serialVersionUID|ignored|expected'
  # Pure formatting / shape rules — off (see the header).
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  MayBeConstant:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  ProtectedMemberInFinalClass:
    active: false
  UtilityClassWithPublicConstructor:
    active: false
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false

potential-bugs:
  HasPlatformType:
    active: true

performance:
  SpreadOperator:
    # Acceptable in build/config code, not hot paths
    active: false

exceptions:
  TooGenericExceptionCaught:
    # Filament JNI can throw generic exceptions that need catching
    active: false
