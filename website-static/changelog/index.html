<!DOCTYPE html>
<!--
  Redirect stub for an old root URL that search engines still list and that
  returned HTTP 404 (12/11/2026: agents searching for SceneView landed on it).
  Same pattern as /migration/: noindex + canonical, so engines move to the
  MkDocs page. MkDocs only owns /docs/, so nothing here shadows its output.
-->
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog — SceneView</title>
  <meta name="description" content="The changelog has moved to /docs/changelog/.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://sceneview.github.io/docs/changelog/">
  <meta http-equiv="refresh" content="0; url=/docs/changelog/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: dark light; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0D2137; color: #f0f4f8;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; line-height: 1.6;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #b8c7d9; font-size: 0.95rem; }
    a { color: #8ab4f8; }
  </style>
</head>
<body>
  <main>
    <h1>The changelog has moved</h1>
    <p>It now lives at <a href="/docs/changelog/">sceneview.github.io/docs/changelog/</a>.</p>
  </main>
</body>
</html>
