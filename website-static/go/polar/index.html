<!DOCTYPE html>
<!--
  Redirect stub for `/go/polar/`. The interstitial that used to live here was
  written when sponsorship ran through a third platform, and its copy promised
  paying supporters "priority features" and "premium support" — commitments
  this project does not make. Support now has a single entry point,
  `/go/sponsor/`, which sends people to Open Collective, with GitHub Sponsors
  offered as the alternative.

  The old URL was live and has been shared outside the site, so it keeps
  answering 200 instead of starting to 404. `noindex, follow` plus a canonical
  link so search engines consolidate on `/go/sponsor/`; sitemap.xml lists
  `/go/sponsor` only and never listed this path.

  No script, so the GA4 loader and the `go_redirect` event are gone with the
  interstitial — a stub is not a funnel step — and the content-security policy
  below is the same one `/claude-3d.html` carries: no `script-src` at all, so
  `default-src 'self'` forbids inline script. Every other page on the site
  reads `localStorage['sceneview-theme']` from a bootstrap in `<head>`, but
  paying for that here means allowing `'unsafe-inline'` on a page that exists
  to be left within one frame. `color-scheme` plus `prefers-color-scheme` gets
  the background right for the system theme without a byte of JavaScript.
-->
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support SceneView</title>
  <meta name="description" content="The SceneView support page has moved to /go/sponsor/.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://sceneview.github.io/go/sponsor">
  <meta http-equiv="refresh" content="0; url=/go/sponsor/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* `color-scheme` lets the UA paint the canvas, scrollbars and any form
       control for the active theme; the @media block comes after the :root
       defaults it overrides. Ratios measured on the rendered pixel, both
       themes, 375 / 768 / 1280px. */
    :root {
      color-scheme: dark light;
      --bg: #0D2137;
      --fg: #f0f4f8;   /* 14.73:1 */
      --muted: #b8c7d9; /* 9.47:1 */
      --link: #8ab4f8;  /* 7.73:1 */
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f8fc;
        --fg: #0d2137;   /* 15.29:1 */
        --muted: #45586c; /* 6.88:1 */
        --link: #005bc1;  /* 6.04:1 */
      }
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; line-height: 1.6;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Support for SceneView now lives at <a href="/go/sponsor/">sceneview.github.io/go/sponsor</a>.</p>
  </main>
</body>
</html>
