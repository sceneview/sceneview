<!DOCTYPE html>
<!--
  Redirect stub for `/go/polar/`. The interstitial that used to live here was
  written when sponsorship ran through a third platform, and its copy promised
  paying supporters "priority features" and "premium support" — commitments
  this project does not make. Support now has a single entry point,
  `/go/sponsor/`, which sends people to Open Collective, with GitHub Sponsors
  offered as the alternative.

  The old URL was live and has been shared outside the site, so it keeps
  answering 200 instead of starting to 404. `noindex, follow` plus a canonical
  link so search engines consolidate on `/go/sponsor`; sitemap.xml lists
  `/go/sponsor` only and never listed this path.

  The GA4 loader and the `go_redirect` event are deliberately gone: a stub is
  not a funnel step, and dropping them lets the policy below be the narrowest
  on the site.
-->
<html lang="en">
<head>
  <!-- `script-src 'self' 'unsafe-inline'` is here for exactly one thing: the
       theme bootstrap below. Without it this stub would be the only page on the
       site that cannot read the visitor's stored theme, and it would render dark
       on a light system. No CDN, no analytics origin, no 'unsafe-eval' — the
       stub loads no external script at all. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sceneview-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support SceneView</title>
  <meta name="description" content="The SceneView support page has moved to /go/sponsor.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://sceneview.github.io/go/sponsor">
  <meta http-equiv="refresh" content="0; url=/go/sponsor">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* The @media block is the no-JS path and comes after the :root defaults it
       overrides; `:not([data-theme="dark"])` leaves a stored dark choice alone,
       and the explicit [data-theme="light"] rule after it wins the other way.
       Ratios measured on the rendered pixel, both themes, 375 / 768 / 1280px. */
    :root {
      color-scheme: dark light;
      --bg: #0D2137;
      --fg: #f0f4f8;   /* 14.7:1 */
      --muted: #b8c7d9; /* 9.49:1 */
      --link: #8ab4f8;  /* 7.62:1 */
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f5f8fc;
        --fg: #0d2137;   /* 15.3:1 */
        --muted: #45586c; /* 6.96:1 */
        --link: #005bc1;  /* 5.97:1 */
      }
    }
    :root[data-theme="light"] {
      --bg: #f5f8fc;
      --fg: #0d2137;
      --muted: #45586c;
      --link: #005bc1;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; line-height: 1.6;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Support for SceneView now lives at <a href="/go/sponsor">sceneview.github.io/go/sponsor</a>.</p>
  </main>
</body>
</html>
