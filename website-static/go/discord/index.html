<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://cdn.jsdelivr.net https://api.sketchfab.com https://media.sketchfab.com; frame-src https://app.rerun.io; worker-src 'self' blob:; base-uri 'self'; object-src 'none'">
  <script>
    // Same bootstrap as every other page on the site: the stored choice first,
    // then the system preference, applied before first paint so an interstitial
    // that lives for 700ms never flashes the wrong theme.
    (function() {
      try {
        var t = localStorage.getItem('sceneview-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Site analytics — GA4 loader shared by every static page (G-HX1JWGSMTH).
       Synchronous on purpose: /go/* interstitials call gtag() right after it. -->
  <script src="/assets/analytics.js"></script>
  <title>SceneView Discord</title>
  <meta name="description" content="Join the SceneView Discord community — chat with developers, ask questions, share your creations.">
  <meta http-equiv="refresh" content="1;url=https://discord.gg/UbNDDBTNqb">
  <meta property="og:title" content="SceneView Discord">
  <meta property="og:description" content="Join the SceneView community on Discord.">
  <meta property="og:url" content="https://sceneview.github.io/go/discord">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Theme ─────────────────────────────────────────────────────────────
       This page had no theme at all: hardcoded dark, on a site where every
       other page follows localStorage['sceneview-theme'] and then
       prefers-color-scheme. The bootstrap in <head> sets data-theme before
       first paint; the @media block below is the no-JS path and is placed
       AFTER the :root defaults it overrides, because both have the same
       specificity and source order is what decides. `:not([data-theme="dark"])`
       keeps a stored dark choice winning on a light system, and the explicit
       [data-theme="light"] rule after it wins the other way.

       Every ratio in the comments is measured on the rendered pixel at
       375 / 768 / 1280px, in both themes — not computed from the declared
       colour, which is the same mistake the old rgba() borders made. */
    :root {
      color-scheme: dark light;
      --go-bg: #0D2137;
      --go-fg: #f0f4f8;          /* 14.7:1 */
      --go-faint: #94a7bb;       /* 6.57:1 — was #4a5e73, measured 2.42:1 */
      --go-link: #8ab4f8;        /* 7.73:1 — was #5e7a94, measured 3.59:1 */
      --go-ok: #4ade80;          /* 9.28:1 */
      --go-edge: #626f7c;        /* 3.15:1 — was rgba(255,255,255,0.12), 1.4:1 */
      --go-panel: rgba(255,255,255,0.04);
      --go-chip: rgba(26,115,232,0.12);
      --go-code-ink: #a6e3a1;   /* 10.9:1 on --go-panel */
      --go-muted: #7b8fa6;       /* 4.88:1 */
      --go-glow: rgba(88,101,242,0.15);
      /* #5865f2 measured 3.55:1 as heading text on the dark background;
         it stays as the button fill, where the white label reads 4.58:1. */
      --go-head-a: #7289da; --go-head-b: #9aa3f7;
      --go-cta-a: #5865f2; --go-cta-b: #4752c4;
      /* 2px, measured on composited pixels against the page behind it: 7.24:1.
         The dark CTA fill sits 1.87-2.90:1 against the dark page on ten of
         these twelve pages, so the button's own boundary failed 1.4.11 in
         dark; the fill cannot fix that alone, because a white label wants a
         dark fill and the boundary wants a light one. This is a tint of the
         button's own hue, so no brand colour moves. The light theme keeps it
         transparent — there the fill already carries the boundary at
         4.79-7.51:1 — and the border box keeps both themes the same size. */
      --go-cta-edge: #a3aaf2;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --go-bg: #f5f8fc;
        --go-fg: #0d2137;          /* 15.3:1 */
        --go-muted: #45586c;       /* 6.88:1 */
        --go-faint: #56697d;       /* 5.33:1 */
        --go-link: #005bc1;        /* 6.04:1 */
        --go-ok: #12703a;          /* 5.72:1 */
        --go-edge: #848e98;        /* 3.13:1 */
        --go-panel: rgba(13,33,55,0.05);
        --go-chip: rgba(0,91,193,0.10);
        --go-code-ink: #146c31;   /* 5.5:1 on --go-panel */
        --go-glow: rgba(88,101,242,0.10);
        --go-head-a: #3a45b5; --go-head-b: #2f38a0;
        --go-cta-edge: transparent;
      }
    }

    :root[data-theme="light"] {
        --go-bg: #f5f8fc;
        --go-fg: #0d2137;          /* 15.3:1 */
        --go-muted: #45586c;       /* 6.88:1 */
        --go-faint: #56697d;       /* 5.33:1 */
        --go-link: #005bc1;        /* 6.04:1 */
        --go-ok: #12703a;          /* 5.72:1 */
        --go-edge: #848e98;        /* 3.13:1 */
        --go-panel: rgba(13,33,55,0.05);
        --go-chip: rgba(0,91,193,0.10);
        --go-code-ink: #146c31;   /* 5.5:1 on --go-panel */
        --go-glow: rgba(88,101,242,0.10);
        --go-head-a: #3a45b5; --go-head-b: #2f38a0;
        --go-cta-edge: transparent;
    }

    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--go-bg); color: var(--go-fg); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    body::before { content: ''; position: fixed; top: -40%; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, var(--go-glow) 0%, transparent 70%); pointer-events: none; }
    .page { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 480px; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--go-head-a), var(--go-head-b)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .desc { color: var(--go-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 34px; border: 2px solid var(--go-cta-edge); border-radius: 16px; font-size: 1rem; font-weight: 700; text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--go-cta-a), var(--go-cta-b)); box-shadow: 0 4px 20px rgba(88,101,242,0.35); transition: transform 0.2s, box-shadow 0.2s; }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(88,101,242,0.45); }
    .note { color: var(--go-ok); font-size: 0.8rem; margin-top: 1rem; }
    .fallback { margin-top: 2rem; color: var(--go-faint); font-size: 0.8rem; }
    .fallback a { color: var(--go-link); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div class="icon">&#128172;</div>
    <h1>SceneView Discord</h1>
    <p class="desc">Chat with developers, ask questions, share your creations</p>
    <a class="cta" href="https://discord.gg/UbNDDBTNqb">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
      Join Discord
    </a>
    <p class="note">Redirecting...</p>
    <p class="fallback">Not working? <a href="https://discord.gg/UbNDDBTNqb">Click here</a> or go <a href="/go/">back</a></p>
  </div>
  <script>
    // Attribute the /go/ hub before leaving. `go_redirect` is what turns
    // "someone hit /go/discord" into a funnel step in GA4 — the interstitial used to
    // navigate away without ever reporting itself.
    //
    // Ordering matters: the shared loader in <head> defines `gtag` synchronously, so the
    // event is queued here, and `event_callback` fires the redirect the moment the hit is
    // on the wire (`transport_type: 'beacon'` → navigator.sendBeacon, which survives the
    // navigation). `event_timeout` bounds the wait when the tag is blocked or slow, the
    // setTimeout below bounds it when gtag never loads at all, and the 1s
    // `<meta http-equiv="refresh">` in <head> is the final no-JS fallback. `redirect()`
    // is idempotent, so whichever path wins, the visitor navigates exactly once.
    var DESTINATION = 'https://discord.gg/UbNDDBTNqb';
    var redirected = false;
    function redirect() {
      if (redirected) return;
      redirected = true;
      window.location.href = DESTINATION;
    }
    if (typeof gtag === 'function') {
      gtag('event', 'go_redirect', {
        target: 'discord',
        destination: DESTINATION,
        transport_type: 'beacon',
        event_timeout: 600,
        event_callback: redirect
      });
    }
    setTimeout(redirect, 700);
  </script>
</body>
</html>
