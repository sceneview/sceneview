<!DOCTYPE html>
<!--
  Redirect stub for `/claude-3d.html`. The page it used to serve was written
  around a single assistant; it is now `/ai-3d.html`, which shows the same
  demos with a vendor-neutral chat window. The old URL was live, listed in
  sitemap.xml and linked from outside, so it keeps answering 200 instead of
  starting to 404.

  `noindex, follow` + a canonical link so search engines consolidate on
  `/ai-3d.html` rather than indexing this stub. sitemap.xml lists the new URL
  only.
-->
<html lang="en">
<head>
  <!-- `script-src 'self' 'unsafe-inline'` is here for exactly one thing: the
       theme bootstrap below. Without it the stub was the only page on the site
       that could not read the visitor's stored theme, and it rendered dark on a
       light system. It is still the narrowest policy of any page here — no CDN,
       no analytics origin, no 'unsafe-eval' — and the stub loads no external
       script at all. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('sceneview-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered 3D — SceneView</title>
  <meta name="description" content="The AI-powered 3D page has moved to /ai-3d.html.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://sceneview.github.io/ai-3d.html">
  <meta http-equiv="refresh" content="0; url=/ai-3d.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* The @media block is the no-JS path and comes after the :root defaults it
       overrides; `:not([data-theme="dark"])` leaves a stored dark choice alone,
       and the explicit [data-theme="light"] rule after it wins the other way.
       Ratios measured on the rendered pixel, both themes, 375 / 768 / 1280px. */
    :root {
      color-scheme: dark light;
      --bg: #0D2137;
      --fg: #f0f4f8;   /* 14.7:1 */
      --muted: #b8c7d9; /* 9.49:1 */
      --link: #8ab4f8;  /* 7.62:1 */
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f5f8fc;
        --fg: #0d2137;   /* 15.3:1 */
        --muted: #45586c; /* 6.96:1 */
        --link: #005bc1;  /* 5.97:1 */
      }
    }
    :root[data-theme="light"] {
      --bg: #f5f8fc;
      --fg: #0d2137;
      --muted: #45586c;
      --link: #005bc1;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; line-height: 1.6;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>The AI-powered 3D demos now live at <a href="/ai-3d.html">sceneview.github.io/ai-3d.html</a>, for every AI coding assistant.</p>
  </main>
</body>
</html>
