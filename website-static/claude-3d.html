<!DOCTYPE html>
<!--
  Redirect stub for `/claude-3d.html`. The page it used to serve was written
  around a single assistant; it is now `/ai-3d.html`, which shows the same
  demos with a vendor-neutral chat window. The old URL was live, listed in
  sitemap.xml and linked from outside, so it keeps answering 200 instead of
  starting to 404.

  `noindex, follow` + a canonical link so search engines consolidate on
  `/ai-3d.html` rather than indexing this stub. sitemap.xml lists the new URL
  only.

  No script, and the content-security policy stays exactly as it was: the
  theming is pure CSS. Every other page on the site reads
  `localStorage['sceneview-theme']` from a bootstrap in `<head>`, but paying
  for that here means allowing `'unsafe-inline'` in `script-src` on a page
  that exists to be left within one frame. `color-scheme` plus
  `prefers-color-scheme` gets the background right for the system theme
  without a single byte of JavaScript; a visitor whose stored site choice
  differs from their system one sees the system one, for as long as a 0s
  redirect lasts.
-->
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; object-src 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered 3D — SceneView</title>
  <meta name="description" content="The AI-powered 3D page has moved to /ai-3d.html.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://sceneview.github.io/ai-3d.html">
  <meta http-equiv="refresh" content="0; url=/ai-3d.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* `color-scheme` lets the UA paint the canvas, scrollbars and any form
       control for the active theme; the @media block comes after the :root
       defaults it overrides. Ratios measured on the rendered pixel, both
       themes, 375 / 768 / 1280px. */
    :root {
      color-scheme: dark light;
      --bg: #0D2137;
      --fg: #f0f4f8;   /* 14.7:1 */
      --muted: #b8c7d9; /* 9.47:1 */
      --link: #8ab4f8;  /* 7.73:1 */
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f8fc;
        --fg: #0d2137;   /* 15.3:1 */
        --muted: #45586c; /* 6.88:1 */
        --link: #005bc1;  /* 6.04:1 */
      }
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; line-height: 1.6;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>The AI-powered 3D demos now live at <a href="/ai-3d.html">sceneview.github.io/ai-3d.html</a>, for every AI coding assistant.</p>
  </main>
</body>
</html>
