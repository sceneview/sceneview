######################
# MavenCentral Publish
######################
GROUP=io.github.sceneview
VERSION_NAME=4.34.0

POM_DESCRIPTION=3D and AR SDK for Android — Jetpack Compose, Filament, ARCore

POM_URL=https://github.com/sceneview/sceneview
POM_SCM_URL=https://github.com/sceneview/sceneview
POM_SCM_CONNECTION=scm:git:git://github.com:sceneview/sceneview.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com:sceneview/sceneview.git

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=ThomasGorisse
POM_DEVELOPER_NAME=Thomas Gorisse
POM_DEVELOPER_URL=https://github.com/ThomasGorisse

SONATYPE_CONNECT_TIMEOUT_SECONDS=180
#SONATYPE_CLOSE_TIMEOUT_SECONDS=900

######################
# Build Performance
######################
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

######################
# Kotlin
######################
kotlin.code.style=official
# Incremental compilation for faster builds
kotlin.incremental=true

######################
# Android
######################
android.useAndroidX=true
# AGP 9 ships Kotlin support built in and, by default, forbids
# `org.jetbrains.kotlin.android`. We opt OUT of that (#3440) and keep the Kotlin
# Gradle plugin, because built-in Kotlin applies no Kotlin PLUGIN ID — only an
# internal `KotlinBaseApiPlugin` — and two gates key on those ids:
#
#   * binary-compatibility-validator 0.18.x (latest) hooks on exactly
#     "kotlin", "kotlin-android" and "kotlin-multiplatform". Under built-in
#     Kotlin it registers NO tasks for :sceneview / :arsceneview, so
#     `./gradlew apiCheck` still exits 0 having validated nothing — the
#     published Android libraries' `.api` gate becomes a false green (measured:
#     `:sceneview:tasks --all` listed zero `api*` tasks).
#   * this build's own detekt wiring (root build.gradle) applies `dev.detekt`
#     via `plugins.withId("org.jetbrains.kotlin.android")`, so :sceneview and
#     :arsceneview would lose `detekt` the same silent way.
#
# REMOVE THIS LINE when binary-compatibility-validator registers its tasks under
# AGP's built-in Kotlin (or is replaced by KGP's own `abiValidation`), and switch
# the root build's detekt hook to `com.android.base` in the same change. Verify by
# checking that `./gradlew :sceneview:tasks --all` still lists `apiCheck` and
# `detekt` afterwards — their ABSENCE is what makes this a silent failure.
android.builtInKotlin=false
# Paired with the line above, and not independently meaningful: the Kotlin Gradle
# plugin refuses to apply on AGP 9's new DSL ("class LibraryExtensionImpl cannot
# be cast to BaseExtension"), so opting out of built-in Kotlin means opting out of
# the new DSL too. Both come back in the same change.
android.newDsl=false
# Non-transitive R classes reduce APK size and improve build speed
android.nonTransitiveRClass=true
android.nonFinalResIds=true

######################
# Filament Plugin
######################
# See the FilamentPlugin.groovy file for the description of these properties
filamentPluginEnabled=false
# This value must point to your Filament desktop tools uncompressed dir, downloaded from here:
# https://github.com/google/filament/releases
com.google.android.filament.tools-dir=../../filament/out/release/filament
com.google.android.filament.exclude-vulkan=true
