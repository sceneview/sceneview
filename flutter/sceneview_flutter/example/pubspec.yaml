name: flutter_sceneview_example
description: Example app for the flutter_sceneview plugin.
version: 3.6.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_sceneview:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # No `assets:` block on purpose. This example is SOURCE-ONLY: it ships
  # `lib/main.dart` to illustrate the API and has no `android/` or `ios/`
  # runner, so it is not a buildable app (`flutter build apk` here stops at
  # "Your app is using an unsupported Gradle project"). It used to declare
  # `models/` and `environments/`, neither of which exists on disk — that is
  # a hard `flutter build` failure ("unable to find directory entry in
  # pubspec.yaml") and two `asset_directory_does_not_exist` analyzer
  # warnings. The paths in `main.dart` are illustrative; a consuming app
  # declares its own asset directories.
