group 'io.github.sceneview.flutter'
version '4.33.0'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Required by Kotlin 2.0+ whenever `compose true` is enabled in an
        // Android module — this replaces the composeOptions.kotlinCompilerExtensionVersion
        // setting used in Kotlin 1.9 and earlier.
        // https://d.android.com/r/studio-ui/compose-compiler
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'io.github.sceneview.flutter'
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 24
    }

    buildFeatures {
        compose true
    }

    // composeOptions.kotlinCompilerExtensionVersion is intentionally absent:
    // with Kotlin 2.0+ the Compose Compiler Gradle plugin (applied above)
    // selects and pins a compatible compiler version automatically.

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // SceneView — 3D and AR rendering.
    // This consumes the PUBLISHED Maven Central artifact, so it must lag to the
    // last released version — it cannot point at the in-flight release (4.7.0
    // is not on Maven Central until this release PR is published).
    implementation 'io.github.sceneview:sceneview:4.6.2'
    implementation 'io.github.sceneview:arsceneview:4.6.2'

    // Local JVM unit tests (#3062). Until this existed, the plugin's pure-Kotlin
    // derivations — the tap payload's `nodeName` above all — were exercised by
    // NOTHING: `flutter test` only ever compiles the Dart tree, and
    // `flutter build apk` compiles this module's `main` and never its tests. A
    // string derivation that silently reports the wrong value is exactly the
    // class a compiler cannot catch, and #3071 was one. These run on the JVM,
    // with no device and no emulator.
    testImplementation 'junit:junit:4.13.2'
}
