# parity-manifest.yml
#
# Android <-> iOS demo-catalog parity ledger (#2801, part of the iOS-parity
# tracker #2798). One row per Android canonical demo id — the ids in
# `GeneratedDemos.all` (collated by `samples/android-demo/scripts/collate-demos.sh`
# from `samples/android-demo/src/main/java/io/github/sceneview/demo/fragments/*Fragment.kt`,
# NOT `DemoRegistry.kt`, which only declares the schema).
#
# Location: repo root (not `samples/ios-demo/`) because this ledger compares
# TWO platforms — Android's canonical id set against iOS's registry — so it
# is not an iOS-only artifact. It sits alongside other cross-cutting,
# machine-readable root files (`llms.txt`, `smithery.yaml`).
#
# Retired Android ids are DROPPED from this ledger rather than kept with a
# marker: the left-hand column is "Android's canonical id set", and an id that
# is no longer canonical has no row to be in. `ar-instant-placement` left this
# way (#3405 — folded into `ar-placement`, where it is a placement *mode*; the
# deep link still resolves through `DeepLinkRouter.DEMO_ID_ALIASES`). iOS still
# ships its own `ar-instant-placement` screen; aligning it with the Android fold
# is tracked separately.
#
# `iosStatus` is a mechanically-checked CURRENT-STATE fact, not an aspiration:
#   - working:      the id is a member of iOS's `DemoDeepLinkRegistry.allowedIds`
#                    AND resolves to a real (non-placeholder) destination —
#                    either its own scene, or (L0.6, #2804) an alias to
#                    another id's scene (an umbrella id routed to the most
#                    representative pre-regroup granular scene).
#   - stub:         the id is a member of `allowedIds` but currently falls
#                    through to the honest placeholder (a `*Scene.swift` file
#                    exists but is `@available false`). NO ROW USES THIS
#                    TODAY, by design: such a Scene puts a card in the iOS
#                    Samples tab that opens a "Coming soon" screen, i.e. a
#                    dead end in a showcase app. #3231 deleted all 21 of them.
#                    Prefer `android-only` — same honesty, no dead card.
#   - android-only: the id is NOT a member of `allowedIds` at all today —
#                    either a genuinely platform-exclusive capability (no
#                    ARKit equivalent, never planned) or a demo iOS simply
#                    hasn't reserved an id for yet. The deep link still lands
#                    on `DeepLinkPlaceholder` via the unregistered-id path, so
#                    this is not a 404.
# `reason` is required for every non-`working` row (one line, honest, cites
# the tracking issue). It is ALSO allowed (optional) on a `working` row as a
# CAPABILITY CAVEAT — the id resolves to a real screen (so it is honestly
# `working`), yet a runtime capability behind that screen cannot execute in the
# demo build (e.g. `ar-cloud-anchor` #2864, whose Host / Resolve need an SDK the
# demo target does not link). Do NOT delete a `reason` from a `working` row
# assuming it is stale — read the issue it cites first. `androidStatus` mirrors
# Android's own `DemoStatus`
# (Working/KnownIssue/ComingSoon/InReview) for CONTEXT ONLY — it does not
# constrain `iosStatus`, and nothing in the gate relates the two.
#
# This paragraph used to assert that the #2798 audit had found a strict
# correlation — every non-`Working` Android demo landing in iOS's
# `stub`/`android-only` bucket, "with zero exceptions". That was a snapshot of
# one afternoon, never an invariant, and it is now plainly false: a row earns
# `iosStatus: working` the moment iOS resolves it to a real destination,
# whatever Android's own status is. Three ids are live counter-examples
# (`ar-cloud-anchor` and `ar-depth-collider`, both `KnownIssue`, and
# `wall-placement`, `InReview`) — each genuinely ported, each carrying the
# matching iOS `@status` badge, so calling any of them `stub` would be a lie.
# Do not enforce the correlation, and never "fix" a row to restore it.
#
# ─── CURRENT STATE — measured, not narrated ────────────────────────────────
# Every tally in this file lives HERE and in the per-section banners below.
# Do NOT append a new "and now it is X/Y" paragraph when a port lands: that is
# exactly how this header came to carry four mutually contradictory counts at
# once (22/18/13, then 28/25, then 29/24, then 30/23) while the real numbers
# were something else again. Update these two places in the same PR, and let
# CI check you — `check-demo-id-parity.sh` now recounts the rows itself and
# FAILS on any banner that disagrees, so a stale tally can no longer pass.
#
# Recount, never hand-edit:
#   python3 -c "import yaml,collections; print(collections.Counter(
#     r['iosStatus'] for r in yaml.safe_load(open('parity-manifest.yml'))['demos']))"
#
# Measured 2026-08-23, after #3275 retired the `placement-reticle-preview` card
# from the Android catalogue (a non-AR developer preview of the placement
# visuals, absorbed by the canonical tap-to-place experience — #2482). The iOS
# scene still exists and still opens, so iOS is now one card ahead here; that is
# an iOS-side retirement, tracked separately, not a parity regression to "fix"
# by putting the Android card back. Previous reading: 2026-08-17, after #3231
# deleted every coming-soon card from the iOS demo — 54 Android ids,
# 34 working / 0 stub / 20 android-only.
# Re-measured 2026-09-03, after #3405 folded `ar-instant-placement` into
# `ar-placement` (one AR placement flow, with instant placement as a mode).
# Counted, not carried over — the 2026-08-23 reading above said "53 fragments"
# while there were 54, so do not trust an inherited number here.
#   - Android: 53 fragments — 42 Working / 5 KnownIssue / 2 ComingSoon / 4 InReview.
#   - This ledger carries 52 of those 53. `gesture-feedback-preview` has no row
#     and never had one — a pre-existing gap, not something #3405 removed.
#
# Re-measured again 2026-09-03, after #2239's catalogue-regroup slice: `fog` ->
# `lighting-lab`, `gesture-feedback-preview` -> `camera-gestures`, and
# `ar-terrain` + `ar-rooftop` -> the new `ar-geospatial-anchors`. Counted, not
# inherited:
#   - Android: 50 fragments — 41 Working / 4 KnownIssue / 2 ComingSoon /
#     3 InReview.
#   - This ledger carries 50 of those 50: the `fog` and `ar-rooftop` rows were
#     dropped (retired ids are dropped, not marked), the `ar-terrain` row became
#     `ar-geospatial-anchors`, and the long-standing `gesture-feedback-preview`
#     gap closed by itself when that id was retired.
#   - Of the 50 rows: 31 working, 0 stub, 19 android-only.
#   - iOS is untouched by the regroup: `allowedIds` still resolves every retired
#     Android id, because the ids retired here were never iOS-side ids.
#   - iOS: `DemoDeepLinkRegistry.allowedIds` = 56 (48 generated ∪ 8 legacy/
#     umbrella aliases ∪ 0 residual ids). Every one of the 56 opens a real
#     screen — the catalogue no longer carries an id that resolves to a
#     "Coming soon" card.
#   - Of the 52 rows: 32 working, 0 stub, 20 android-only.
#
# Re-measured 2026-09-06, after #3463 folded `ar-streetscape` into the
# `ar-scene-mesh` card (now titled "Scene Geometry", Mesh / Streetscape modes).
# Counted from the fragments and from this file, not carried over — and the two
# disagreed on more than the merge:
#   - Android: 49 fragments — 40 Working / 3 KnownIssue / 2 ComingSoon /
#     4 InReview. `ar-scene-mesh` is the one that moved to KnownIssue: it keeps
#     the badge its absorbed half carried.
#   - This ledger carries 49 of those 49. The `ar-streetscape` row was dropped
#     (retired ids are dropped, not marked).
#   - Of the 49 rows: 31 working, 0 stub, 18 android-only. The banners below
#     said 32 / 0 / 20 before this pass and had said so since before #3405 —
#     the two paragraphs above were both wrong, in different directions, which
#     is what "recount, never inherit" is for. No script recounts them today:
#     `check-demo-id-parity.sh`, named further down as the CI guard, does not
#     exist in the repository.
#   - `ar-cloud-anchor`'s `androidStatus` was corrected here too (KnownIssue →
#     InReview): #3451 rebuilt that screen and moved the fragment to InReview
#     without touching this row.
#
# How it got here — STRUCTURE, deliberately without counts (the banners below
# are the live numbers). L0.6 (#2804, closes #2769) made every Android id
# resolve to SOMETHING honest on iOS (a real screen, an alias to an existing
# equivalent screen, or a clearly-labeled coming-soon/Android-only card),
# never a silent no-op:
#   - Job A: the 6 `#2239`-umbrella ids got a `legacyAliases` entry to their
#     most-representative pre-regroup granular scene (real content, not a
#     coming-soon card) → promoted from `android-only` to `working`.
#   - Job B / Job C: 18 ids with no iOS equivalent got a dedicated stub Scene
#     file with an honest `comingSoonTitle` → `android-only` became `stub`.
#     REVERSED by #3231: an honest label on a card that opens nothing is still
#     a dead end, and 21 of them were the iOS demo's most visible defect. The
#     stubs are gone, the ids are `android-only` again, and the deep links
#     resolve exactly as they did — through `DeepLinkPlaceholder`.
#   - Wave A (#2798) then genuinely ported six AR demos to iOS, promoting
#     their rows from `stub` to `working`. Two of them (`ar-depth-collider`,
#     `ar-cloud-anchor`) are `KnownIssue` on Android and a third
#     (`wall-placement`) is `InReview` — which is what broke the "zero
#     exceptions" correlation described above. Not special cases: any
#     non-`Working` Android id lands in iOS's `working` bucket once its port
#     is real, exactly like a `Working` one.
#
# Checked by `.claude/scripts/check-demo-id-parity.sh` (`ci.yml` ->
# `repo-hygiene`, ubuntu, blocking): fails if a Android id has neither an iOS
# registry entry nor a row here, if a row's `iosStatus` disagrees with the
# live registry, or if a row here no longer corresponds to a live Android id.
# It also recounts the section banners below — their tallies are comments,
# which `yaml.safe_load` never sees, so before that check they drifted freely
# behind a green CI (four contradictory counts in this very header, and four
# rows flipped to `working` in place without leaving the `stub` section).
# A banner whose count disagrees with its bucket, or a row filed under the
# wrong section, now FAILS.
# Update this file (status + reason) in the SAME PR that changes either
# platform's registry — that's what keeps it honest.

demos:
