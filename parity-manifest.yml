  - id: cosmos
    androidStatus: Working
    iosStatus: working
    reason: >-
      Capability caveat: the bloom runs through RealityKit custom
      post-processing, iOS 26+ only; on iOS 18-25 the scenes draw without it.
    category: CREATE
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/CosmosDemo.kt
    ios: [cosmos]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosDemo.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosMeshes.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosGlow.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosSystem.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosWorld.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosSpacetime.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/CosmosSpacetimeScene.swift
    contract: >-
      Four procedural, real-time scenes in additive HDR light plus bloom: a
      four-arm spiral galaxy of 60 000 camera-facing star sprites with
      alpha-blended dust lanes, built in layers so it shows within a second, a plasma
      star (noise-shaded sphere, Fresnel limb, magnetic loops), a looping
      burst of ~460 charged-particle tracks, and a vortex flow field of
      streamlines with travelling pulses. The Star scene opens on a whole
      system: a ringed world orbits the star, lit by it (terminator,
      atmosphere rim, ring shadow on the planet, planet shadow on the rings,
      fading orbit trail); tapping the planet or the star flies the camera
      there on ease-expressive, round the star (#4192). Whenever the star is
      on screen, a Starlight | Spacetime pill above the dock lays the system
      down on a spacetime sheet: the camera rises, the glow drops away, five
      more worlds and two moons fall into wells the masses carve in a lit
      fabric (Plummer wells, horizon and sphere shadows, the ringed
      world's ring shadow), and a drag orbits the camera within 30-70 degrees
      of pitch; `?tab=spacetime` deep-links to it. Dock picks a scene;
      an optional tour cycles them and flies to the planet once; Bloom
      slider; no video, no texture.
    parity: diverges
    evidence: >-
      Same meshes, seeds, cameras, captions and dock. No custom shader on iOS
      (UnlitMaterial additive quads, camera-facing on the CPU). Motion is
      rebuilt without a shader: ribbon dashes travel by scrolling a repeating
      dash atlas through textureCoordinateTransform (dash colours quantized
      per octave to fit one 8192-texel atlas), stars twinkle through eight
      phase groups with one material each, and the star surface churns by
      cross-fading 512x256 plasma frames baked in the background every 1.5 s
      of scene time (held in Low Power Mode or at a serious thermal state).
      The ringed world (#4192) shares CosmosSystem's constants, poses, eased
      flight and tap hit test with Android (unit-tested); its planet and
      ring shaders are evaluated on the CPU into a 1024x512 planet map and a
      256x1024 ring map, re-baked off the main thread at up to 8 Hz while
      the orbit or the camera moves; the star's halo turns and its limb and
      corona resize as the camera flies. The Flow landscape quarter-turn is ported and rebuilt when the viewport
      crosses square; captured in a macOS window, where only the brightest
      light shows (the dim light is lost on macOS in Galaxy and Flow; cause
      not yet traced). Remaining gaps: the flow nuclei do
      not churn, the galaxy is built in one pass, the Settings sheet has no
      "Settings" title (DemoChrome has no parameter for it), and the bloom is
      added in display space with a baked filmic roll-off standing in for
      Filament's tone map. Spacetime: Android shades the sheet per pixel
      (cosmos_spacetime.mat), its hollow's shadow sampled from a horizon map
      baked once on the CPU (512², CosmosSpacetime.horizonMap); iOS bakes the
      same map (same march, same 512² over ±4, unit-tested within 1/255) and
      reads it per fragment through a premultiplied overlay part of the sheet
      mesh (UnlitMaterial, no tone map), so the hollow's shadow edge matches
      Android's; the sphere and ring shadows, the ambient occlusion and the
      spot stay per vertex, and iOS has no drag to orbit the Spacetime camera.
      Known gap: the star reads paler in Spacetime on iOS, a flat disc with
      no bloom halo round it, where Android's star keeps its glow over the
      sheet; and the ringed world's rings stay translucent grey in Spacetime
      where Android's read near-opaque white (ring peak luma 130 on iOS at
      CosmosWorldLook.spacetimeRingGain 1.8, 120 at 1.45, 188 on Android, same
      QA frame, #4256): the gain is rolled off by the CPU filmic and the
      ring's opacity tops out at 0.62, so a larger gain cannot close it.
