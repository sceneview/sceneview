  # ─── stub (0) — an id in iOS's registry that falls to the placeholder ────
  # Deliberately empty, and meant to stay that way. A `stub` row means the
  # iOS catalogue lists a card that opens a "Coming soon" screen — a dead end
  # in a showcase app, and the most visible defect it can ship. #3231 deleted
  # all 21 of them; every id below moved to `android-only`, which is the
  # honest bucket for "iOS has no screen for this". The status stays a legal
  # value (`check-demo-id-parity.sh` still enforces it) so a future id that
  # must be *accepted* without having a screen has somewhere to go.

  # ─── android-only (18) — iOS has no screen, and no catalogue entry ───────
  # Not a 404: `SceneViewDemoApp.onOpenURL` forwards an unregistered id to
  # `DemoDeepLinkRegistry.destination(for:)`, which answers with the honest
  # `DeepLinkPlaceholder`. The cross-platform QR-code contract holds; what
  # these ids no longer get is a Samples card that leads nowhere.
  - id: ar-collaborative
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — a CollaborativeSession SDK + demo is not ported (Phase 2
      Wave B, #2798). Its coming-soon Scene stub was deleted in #3231.
  - id: ar-depth-of-field
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — depth-of-field post-process not ported (Phase 2 Wave B,
      #2798). Its coming-soon Scene stub was deleted in #3231.
  - id: ar-depth-visualization
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — depth visualization and the SDK depth API it needs are
      not ported (Phase 2 Wave B, #2798). Its coming-soon Scene stub was
      deleted in #3231.
  - id: ar-fog
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — the AR-specific fog demo (#1717) is not ported; distinct
      from the non-AR `fog` id, which IS working on iOS. Its coming-soon Scene
      stub was deleted in #3231.
  - id: ar-geospatial-anchors
    androidStatus: KnownIssue
    iosStatus: android-only
    reason: >-
      Platform-locked: ARCore Geospatial terrain and rooftop anchors are a
      Google-backend service with no ARKit equivalent — not a port target.
      Android itself is KnownIssue. #2239 merged the former `ar-terrain` and
      `ar-rooftop` rows into this one card (Terrain / Rooftop modes); both
      retired ids still resolve through DEMO_ID_ALIASES, and per this ledger's
      own rule a retired id is DROPPED here rather than kept with a marker.
      Their coming-soon Scene stubs, and the `ar-terrain-anchors` /
      `ar-rooftop-anchors` rename aliases that pointed at them, were deleted in
      #3231.
  - id: ar-hand-tracking
    androidStatus: ComingSoon
    iosStatus: android-only
    reason: >-
      No iOS screen — Android itself is ComingSoon (headset hand-tracking SDK
      work), and the Apple equivalent is visionOS-only. Its coming-soon Scene
      stub was deleted in #3231.
  - id: ar-image-stabilization
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      Platform-locked: ARCore's Electronic Image Stabilization (EIS) toggle has
      no public ARKit equivalent — not a port target (#2798). Its Android-only
      Scene stub was deleted in #3231.
  - id: ar-measure
    androidStatus: InReview
    iosStatus: android-only
    reason: >-
      Landed on Android only (#531). NOT platform-locked — ARKit raycasting
      plus scene reconstruction covers every brick this demo needs, so an iOS
      port is expected rather than excluded; iOS simply has no id reserved for
      it yet. Porting it is tracked by the iOS-parity epic #894 / #2798.
  - id: ar-ml-object-label
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — Vision/CoreML object labeling not ported (Phase 3,
      #2798). Its coming-soon Scene stub was deleted in #3231.
  - id: ar-plane-renderer-v2
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — needs LiDAR-backed plane rendering, added to Android
      after iOS stopped tracking the catalog. Its coming-soon Scene stub was
      deleted in #3231.
  - id: ar-raw-depth-point-cloud
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — raw depth point cloud not ported (Phase 2 Wave B,
      #2798). Its coming-soon Scene stub was deleted in #3231.
  - id: ar-scene-semantics
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — scene semantics not ported (Phase 3, #2798). Its
      coming-soon Scene stub was deleted in #3231.
  - id: ar-xr-face
    androidStatus: ComingSoon
    iosStatus: android-only
    reason: >-
      No iOS screen — Android itself is ComingSoon (headset face-tracking SDK
      work), and the Apple equivalent is visionOS-only. Its coming-soon Scene
      stub was deleted in #3231.
  - id: contact-shadow-preview
    androidStatus: InReview
    iosStatus: android-only
    reason: >-
      No iOS screen — added to Android after iOS stopped tracking the catalog
      (#2817, contact-shadow sub-task C of #2740; Android itself is InReview).
      Its coming-soon Scene stub was deleted in #3231.
  - id: point-and-ask
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — a port would use Apple's Foundation Models (#2648)
      rather than Gemini Nano. Its coming-soon Scene stub was deleted in #3231.
  - id: secondary-camera
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — picture-in-picture camera view not implemented. Its
      coming-soon Scene stub was deleted in #3231.
  - id: splat-preview
    androidStatus: Working
    iosStatus: android-only
    reason: >-
      No iOS screen — blocked on an iOS SplatNode renderer, tracked as
