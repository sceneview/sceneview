      live — but the demo target does NOT link Google's `arcore-ios-sdk`, so
      Host / Resolve stay disabled behind a "Preview" badge and the billed
      GARSession round-trip cannot run. A missing DEPENDENCY, not a missing key
      (Android ships it; ARCORE_API_KEY is set). Vendoring arcore-ios-sdk is
      NOT planned — see #2864 for the reopen conditions.
