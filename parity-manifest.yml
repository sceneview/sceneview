# ─── App shell, what a decision-maker sees before any demo: 6 ───────────
# Same fields as the rows; `surface` names the screen, not a deep-link id.
shell:
  - surface: showcase
    category: SHELL
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/ui/home/HomeScreen.kt
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Tabs/ShowcaseTab.swift
      - samples/ios-demo/SceneViewDemo/Views/Home/HomeHero.swift
      - samples/ios-demo/SceneViewDemo/Views/Home/HomeListRow.swift
      - samples/ios-demo/SceneViewDemo/Views/Home/HomeFilter.swift
    contract: >-
      Header (search + What's new) that turns to frosted glass once the
      list scrolls under it (surface 72 % / 78 % over a 24dp blur, API 31+),
      2-page featured pager (FEATURED_PAGER_IDS: Models live, Cosmos), then
      a list of picture cards: "Featured" as 2:1 banners dissolving downward
      (FEATURED_IDS minus the pager's pages: AR placement, AR Rerun,
      Materials; a demo is pushed once above the chips, pager then Featured
      then the What's-new row, homeTopSections, #4304), the What's-new row
      opening the What's-new sheet over the whole catalogue (never the
      filter chip), Browse-online row, 5 chips (the selected chip toggles
      back to All, Back clears the filter, a filtered list ends on "Show
      all N samples", #4304), section headers, one card per demo (under
      "All" a Featured banner is not listed again, HomeTopSections.catalogue;
      a chip or a search lists every match) with its capture
      over the leading half dissolving sideways into an ambient ground
      taken from the picture (HomeAmbient, luminance 0.035 dark / 0.84
      light), 20dp corners, 10dp apart, New/Updated chip on the title line,
      one column on a phone
    parity: diverges
    evidence: >-
      Featured order, 5 section chips and section headers match since #3907
      (ShowcaseTab.swift, HomeCatalogue in HomeFilter.swift); Featured skips
      ar-splat-room (#4075), which has no iOS screen. The grouped list
      matches since home-rows-fused-ambient (HomeListRow.swift: fused rows
      and Featured banners, HomeAmbient with Android's arithmetic and test
      cases, Theme.swift row tokens equal to SceneViewTokens.Home, 340pt
      iPad columns, Browse-online row under Featured), from the same
      captures (12 imagesets shared with Android, tools/demo-previews/README.md).
      The header turns to glass once scrolled (ShowcaseTab.swift
      HeaderGround: iOS 26 Liquid Glass, ultraThinMaterial before) since
      #4208. Still diverges: single HomeHero instead of the pager; the hero
      (heroDemoId model-viewer, ShowcaseTab.swift) comes back as a Featured
      banner because `featured` draws every HomeCatalogue.featuredIds, and
      the banners are listed again in the sections, where Android shows a
      demo once (#4312); the What's-new row (no picture on iOS) still
      selects the filter (openWhatsNew) instead of opening the sheet
      (#4312); the What's-new chip toggles but a section chip does not, and
      a filtered list has no "Show all N samples" (#4312); and six broken
      demos are kept off the home (HomeCatalogue.hiddenFromHome)
