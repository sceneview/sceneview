# parity-manifest.yml
#
# Android <-> iOS demo-catalog parity ledger (#2801, part of the iOS-parity
# tracker #2798). One row per Android canonical demo id — the ids in
# `GeneratedDemos.all` (collated by `samples/android-demo/scripts/collate-demos.sh`
# from `samples/android-demo/src/main/java/io/github/sceneview/demo/fragments/*Fragment.kt`,
# NOT `DemoRegistry.kt`, which only declares the schema).
#
# Location: repo root (not `samples/ios-demo/`) because this ledger compares
# TWO platforms — Android's canonical id set against iOS's registry — so it
# is not an iOS-only artifact. It sits alongside other cross-cutting,
# machine-readable root files (`llms.txt`, `smithery.yaml`).
#
# Retired Android ids are DROPPED from this ledger rather than kept with a
# marker: the left-hand column is "Android's canonical id set", and an id that
# is no longer canonical has no row to be in. `ar-instant-placement` left this
# way (#3405 — folded into `ar-placement`; the Android deep link still resolves
# through `DeepLinkRouter.DEMO_ID_ALIASES`). Slice 5 also removes the redundant
# iOS automatic-placement entries: `ar-placement` is its sole placement route.
# `placement-scene` kept its row until Android samples step 0 folded that
# SDK-wrapper card into `ar-placement` too (its One call mode); its row is
# dropped the same way.
#
# `iosStatus` is a mechanically-checked CURRENT-STATE fact, not an aspiration:
#   - working:      the id is a member of iOS's `DemoDeepLinkRegistry.allowedIds`
#                    AND resolves to a real (non-placeholder) destination —
#                    either its own scene, or (L0.6, #2804) an alias to
#                    another id's scene (an umbrella id routed to the most
#                    representative pre-regroup granular scene).
#   - stub:         the id is a member of `allowedIds` but currently falls
#                    through to the honest placeholder (a `*Scene.swift` file
#                    exists but is `@available false`). NO ROW USES THIS
#                    TODAY, by design: such a Scene puts a card in the iOS
#                    Samples tab that opens a "Coming soon" screen, i.e. a
#                    dead end in a showcase app. #3231 deleted all 21 of them.
#                    Prefer `android-only` — same honesty, no dead card.
#   - android-only: the id is NOT a member of `allowedIds` at all today —
#                    either a genuinely platform-exclusive capability (no
#                    ARKit equivalent, never planned) or a demo iOS simply
#                    hasn't reserved an id for yet. The deep link still lands
#                    on `DeepLinkPlaceholder` via the unregistered-id path, so
#                    this is not a 404.
# `reason` is required for every non-`working` row (one line, honest, cites
# the tracking issue). It is ALSO allowed (optional) on a `working` row as a
# CAPABILITY CAVEAT — the id resolves to a real screen (so it is honestly
# `working`), yet a runtime capability behind that screen cannot execute in the
# demo build (e.g. `ar-cloud-anchor` #2864, whose Host / Resolve need an SDK the
# demo target does not link). Do NOT delete a `reason` from a `working` row
# assuming it is stale — read the issue it cites first. `androidStatus` mirrors
# Android's own `DemoStatus`
# (Working/KnownIssue/ComingSoon/InReview) for CONTEXT ONLY — it does not
# constrain `iosStatus`, and nothing relates the two.
#
# This paragraph used to assert that the #2798 audit had found a strict
# correlation — every non-`Working` Android demo landing in iOS's
# `stub`/`android-only` bucket, "with zero exceptions". That was a snapshot of
# one afternoon, never an invariant, and it is now plainly false: a row earns
# `iosStatus: working` the moment iOS resolves it to a real destination,
# whatever Android's own status is. The three ids that used to prove it
# (`ar-cloud-anchor`, `ar-depth-collider`, `wall-placement`) have since all
# gone `Working` or been retired on Android, so this file no longer carries a
# standing counter-example — which is precisely why the rule is written down
# rather than left to be re-derived from the rows.
# Do not enforce the correlation, and never "fix" a row to restore it.
#
# ─── CURRENT STATE — measured, not narrated ────────────────────────────────
# Current ledger (2026-10-03, after iOS and Android samples step 0): 43 rows, 31 working / 0 stub / 12 android-only.
# (2026-10-02, iOS samples step 0: 49 -> 35 iOS cards, `secondary-camera` included. Every
#  absorbed iOS card is now a mode of the card that absorbed it and its id an alias, so no
#  row changes status; the `ios:` lists name the 35 scene ids only. iOS allowedIds:
#  35 scenes + 22 aliases = 57.)
# (Android samples step 0, 51 -> 43 rows: five android-only ids retired into the cards that
#  absorbed them — `placement-scene`, `ar-collaborative`, `video-recording`,
#  `ar-hand-tracking`, `ar-xr-face` — DROPPED per the ledger rule; +1 android-only `ar-xr`.
#  Four working ids retired the same way and DROPPED: `ar-pose` (Free pose mode of
#  `ar-placement`), `ar-record-playback` (Session MP4 mode of `ar-rerun`),
#  `double-pendulum` (Pendulum mode of `rolling-balls`) and `secondary-camera` (PiP mode
#  of `camera-gestures`); on iOS the first three are aliases of those same cards, and the
#  `secondary-camera` scene is listed in `camera-gestures`' `ios:`.)
# (android-only -> working: `splat-preview`, drawn as a point cloud on iOS — no splat renderer yet.)
# (+1 android-only: `ar-splat-room`, #4023 — a dollhouse of your Rerun recording since #4075.)
# (+1 working: `cosmos` — iOS port with SceneViewSwift `.bloom`, iOS 26+ for the glow.)
# (android-only -> working: `contact-shadow-preview` — procedural contact-shadow quads.)
# (android-only -> working: `secondary-camera` — two SceneViews over one shared state, cloned helmet.)
# The duplicate iOS one-call placement row was removed by explicit product decision;
# Android keeps that SDK-wrapper screen as the One call mode of `ar-placement` (step 0).
# Historical recounts below retain their measurement dates.
# Every tally in this file lives HERE and in the per-section banners below.
# Do NOT append a new "and now it is X/Y" paragraph when a port lands: that is
# exactly how this header came to carry four mutually contradictory counts at
# once (22/18/13, then 28/25, then 29/24, then 30/23) while the real numbers
# were something else again. Update these two places in the same PR — BY HAND.
# CI recounts them since #3650 — but ADVISORY only: the `demo-parity` job
# warns with the right number and stays green, so a stale tally still merges
# if you ignore it. Recount before you touch a row; if you forget, read the
# job's warning and fix the banner in a follow-up.
#
# Recount, never hand-edit:
#   python3 -c "import yaml,collections; print(collections.Counter(
#     r['iosStatus'] for r in yaml.safe_load(open('parity-manifest.yml'))['demos']))"
#
# Measured 2026-08-23, after #3275 retired the `placement-reticle-preview` card
# from the Android catalogue (a non-AR developer preview of the placement
# visuals, absorbed by the canonical tap-to-place experience — #2482). The iOS
# scene still exists and still opens, so iOS is now one card ahead here; that is
# an iOS-side retirement, tracked separately, not a parity regression to "fix"
# by putting the Android card back. Previous reading: 2026-08-17, after #3231
# deleted every coming-soon card from the iOS demo — 54 Android ids,
# 34 working / 0 stub / 20 android-only.
# Re-measured 2026-09-03, after #3405 folded `ar-instant-placement` into
# `ar-placement` (one AR placement flow, with instant placement as a mode).
# Counted, not carried over — the 2026-08-23 reading above said "53 fragments"
# while there were 54, so do not trust an inherited number here.
#   - Android: 53 fragments — 42 Working / 5 KnownIssue / 2 ComingSoon / 4 InReview.
#   - This ledger carries 52 of those 53. `gesture-feedback-preview` has no row
#     and never had one — a pre-existing gap, not something #3405 removed.
#
# Re-measured again 2026-09-03, after #2239's catalogue-regroup slice: `fog` ->
# `lighting-lab`, `gesture-feedback-preview` -> `camera-gestures`, and
# `ar-terrain` + `ar-rooftop` -> the new `ar-geospatial-anchors`. Counted, not
# inherited:
#   - Android: 50 fragments — 41 Working / 4 KnownIssue / 2 ComingSoon /
#     3 InReview.
#   - This ledger carries 50 of those 50: the `fog` and `ar-rooftop` rows were
#     dropped (retired ids are dropped, not marked), the `ar-terrain` row became
#     `ar-geospatial-anchors`, and the long-standing `gesture-feedback-preview`
#     gap closed by itself when that id was retired.
#   - Of the 50 rows: 31 working, 0 stub, 19 android-only.
#   - iOS is untouched by the regroup: `allowedIds` still resolves every retired
#     Android id, because the ids retired here were never iOS-side ids.
#   - iOS: `DemoDeepLinkRegistry.allowedIds` = 56 (48 generated ∪ 8 legacy/
#     umbrella aliases ∪ 0 residual ids). Every one of the 56 opens a real
#     screen — the catalogue no longer carries an id that resolves to a
#     "Coming soon" card.
#   - Of the 52 rows: 32 working, 0 stub, 20 android-only.
#
# Re-measured 2026-09-06, after #3463 folded `ar-streetscape` into the
# `ar-scene-mesh` card (now titled "Scene Geometry", Mesh / Streetscape modes).
# Counted from the fragments and from this file, not carried over — and the two
# disagreed on more than the merge:
#   - Android: 49 fragments — 40 Working / 3 KnownIssue / 2 ComingSoon /
#     4 InReview. `ar-scene-mesh` is the one that moved to KnownIssue: it keeps
#     the badge its absorbed half carried.
#   - This ledger carries 49 of those 49. The `ar-streetscape` row was dropped
#     (retired ids are dropped, not marked).
#   - Of the 49 rows: 31 working, 0 stub, 18 android-only. The banners below
#     said 32 / 0 / 20 before this pass and had said so since before #3405 —
#     the two paragraphs above were both wrong, in different directions, which
#     is what "recount, never inherit" is for. No script recounted them at the
#     time: `check-demo-id-parity.sh` was absent from the repository then, and
#     came back (advisory) only with #3650.
#   - `ar-cloud-anchor`'s `androidStatus` was corrected here too (KnownIssue →
#     InReview): #3451 rebuilt that screen and moved the fragment to InReview
#     without touching this row.
#
# Re-measured 2026-09-16 (recount pass, no merge of its own). Counted from the
# fragment files, the two collators' output and this file — the three
# disagreed again, in three different ways:
#   - Android: 48 fragments (49 `*Fragment.kt` files minus the `DemoFragment`
#     base class) — 42 Working / 2 KnownIssue / 2 ComingSoon / 2 InReview.
#     `collate-demos.sh` reports the same 48.
#   - iOS: 48 `*Scene.swift` scenes, none `@available false`, plus 8 legacy /
#     umbrella aliases and 0 residual ids = 56 accepted deep-link ids.
#   - This ledger carried 49 rows; one of them, `wall-placement`, is no longer
#     a canonical Android id — #3603 folded it into `ar-placement` and left an
#     alias behind. Dropped here, per this file's own retired-id rule. The
#     ledger now carries 48 of 48: 30 working, 0 stub, 18 android-only, and
#     the banner below said 31 working.
#   - Two `androidStatus` values were stale, both in the same direction (the
#     fragment had been promoted without the row following): `ar-cloud-anchor`
#     InReview → Working, `ar-depth-collider` KnownIssue → Working.
#   - The structural gap this recount makes visible, and which no row can
#     express: **22 of iOS's 48 Samples cards carry an id Android RETIRED** —
#     the #1444 / #2239 / #3405 regroup keys (`animation`, `physics`, `text`,
#     `image`, `video`, `billboard`, `custom-mesh`, `shape`, `collision`,
#     `camera-controls`, `gesture-editing`, `dynamic-sky`, `environment`,
#     `movable-light`, `reflection-probes`, `multi-model`, `scene-gallery`,
#     `texture-streaming`, `occlusion-material`, `fog`, `ar-instant-placement`,
#     `wall-placement`). Plus `placement-reticle-preview`, retired by #3275
#     with no Android alias at all, so that deep link resolves on iOS and
#     falls through on Android. This ledger's left-hand column is Android's
#     canonical id set, so an iOS-only surplus card has nowhere to be recorded
#     here; it is tracked in the backlog issues filed 2026-09-16 instead.
#
# How it got here — STRUCTURE, deliberately without counts (the banners below
# are the live numbers). L0.6 (#2804, closes #2769) made every Android id
# resolve to SOMETHING honest on iOS (a real screen, an alias to an existing
# equivalent screen, or a clearly-labeled coming-soon/Android-only card),
# never a silent no-op:
#   - Job A: the 6 `#2239`-umbrella ids got a `legacyAliases` entry to their
#     most-representative pre-regroup granular scene (real content, not a
#     coming-soon card) → promoted from `android-only` to `working`.
#   - Job B / Job C: 18 ids with no iOS equivalent got a dedicated stub Scene
#     file with an honest `comingSoonTitle` → `android-only` became `stub`.
#     REVERSED by #3231: an honest label on a card that opens nothing is still
#     a dead end, and 21 of them were the iOS demo's most visible defect. The
#     stubs are gone, the ids are `android-only` again, and the deep links
#     resolve exactly as they did — through `DeepLinkPlaceholder`.
#   - Wave A (#2798) then genuinely ported six AR demos to iOS, promoting
#     their rows from `stub` to `working`. Three of them were non-`Working` on
#     Android at the time (`ar-depth-collider`, `ar-cloud-anchor`,
#     `wall-placement`) — which is what broke the "zero exceptions"
#     correlation described above. Not special cases: any non-`Working`
#     Android id lands in iOS's `working` bucket once its port is real,
#     exactly like a `Working` one.
#
# WATCHED, NOT ENFORCED (#3650). `.claude/scripts/check-demo-id-parity.sh`
# runs on every PR as the `demo-parity` job in `ci.yml`. It reads the live
# Android fragments, the live iOS registry and this file, and it reports each
# disagreement as a `::warning` annotation plus a job-summary table. It always
# exits 0, and the job is `continue-on-error` — nothing here can turn a PR red.
#
# That is deliberate, and it is the second attempt. The first version of this
# script WAS a blocking gate (named here, wrongly, as `ci.yml` -> `repo-hygiene`
# — a job that never existed); it was deleted wholesale with the agent harness
# by #3244 (commit 72e5709) and nothing replaced it for three months, during
# which this header went on asserting a guard that was not there. A gate that
# fails an honest Android-first PR gets deleted; a warning gets read. If you
# find yourself wanting to make this blocking again, read #3650 first.
#
# So: a row's `iosStatus` disagreeing with the live iOS registry, a retired
# Android id keeping its row, a banner tally drifting — all three had happened
# by the 2026-09-16 recount below, all three now WARN on the PR that introduces
# them, and all three still merge if nobody reads the warning. The manual pass
# described at the bottom of this block is still the thing that keeps this file
# honest; the job only makes forgetting it visible.
#
# What else verifies something, and is worth running/reading:
#   - `samples/android-demo/scripts/collate-demos.sh --check` — Android's id
#     set (`GeneratedDemos.all`) is the left-hand column of this ledger.
#   - `samples/ios-demo/scripts/collate-ios-demos.sh --check` — iOS's scene id
#     set (`GeneratedScenes.allowedIds`), the generated half of
#     `DemoDeepLinkRegistry.allowedIds`.
#   - `SceneViewDemoTests/DemoRegistryGuardTests` — the iOS-side invariants:
#     no Samples card is a dead end, every legacy alias targets a live scene
#     id, `residualIds` never collides with a live scene, and a pinned set of
#     flagship + android-only ids resolves the way this ledger says.
#     It checks iOS against itself; it does NOT read this file.
# Reconciling the two id sets against these rows is a MANUAL pass. Do it, and
# update this file (status + reason), in the SAME PR that changes either
# platform's registry — that's the only thing keeping it honest.
#
# ─── PARITY — is the iOS screen the Android demo? (2026-09-26, #3907) ───
# `iosStatus` only answers "does the deep link open a real iOS screen?". A
# screen can be `working` and still be another demo. Seven fields per row
# answer the second question, and Android is always the reference:
#   category  Android's DemoCategory: VIEW_3D | CREATE | PLACE_AR |
#             UNDERSTAND | DEV_TOOLS (the Showcase sections, in that order).
#   android   the Android composable the iOS screen must mirror.
#   ios       EVERY iOS scene id covering this demo; [] when none. An Android
#             umbrella (one card, several modes) lists each iOS card that
#             still splits it: those extra cards are the rewrite's delete list.
#   iosFiles  the iOS view file(s) behind those scenes.
#   contract  ONE line, the same for both platforms: what the screen shows and
#             lets the user do, i.e. Android's behaviour.
#   parity    exactly one value; precedence broken > fake > diverges > identical.
#               identical            same subject, modes, controls, behaviour
#                                    and look; only platform-forced gaps.
#               diverges             a real iOS screen, but the content, modes,
#                                    controls, look or card structure differ.
#               missing              no iOS screen, and iPhone ARKit /
#                                    RealityKit could do it.
#               fake                 the iOS screen claims or simulates a
#                                    capability it does not have.
#               broken               the iOS screen exists; its core function
#                                    does not work today.
#               ios-only             an iOS scene with no Android counterpart.
#               not-feasible-on-ios  Android-only because Apple lacks the API
#                                    (the evidence names the gap).
#   evidence  ONE line: the decisive file:line, or baseline defect D<n> from
#             the 2026-09-22 simulator baseline.
# After the rows: `iosOnly:` holds the iOS scenes with no Android counterpart
# (keyed `iosId`), and `shell:` the app frame a decision-maker meets first —
# tabs, demo chrome, deep links (keyed `surface`). Every iOS scene id appears
# exactly once, in one row's `ios:` or in `iosOnly`. Two iOS deep-link ids
# have no scene and so no row: `fog` (a removal notice, see `ar-fog`) and
# `ar-instant-placement`, an Android alias iOS never took (see `shell:`).
#
# Measured 2026-09-26 from the code at b4bff342e, not from captures:
#   48 Android rows: 1 identical, 25 diverges, 13 missing, 2 fake, 1 broken,
#   6 not-feasible-on-ios. iosOnly: 2 ios-only. shell: 6 surfaces, all
#   diverges.
#
# Generated views — never hand-maintain a table of these rows; regenerate.
# Tally plus one Markdown line per row (paste into an issue as is):
#   python3 -c "import yaml,collections as C; d=yaml.safe_load(open('parity-manifest.yml')); R=d['demos']+d['iosOnly']; print(dict(C.Counter(r['parity'] for r in R))); print('| Android | iOS | parity | evidence |'); print('|---|---|---|---|'); [print('|', r.get('id') or '-', '|', ', '.join(r.get('ios') or [r.get('iosId') or '-']), '|', r['parity'], '|', r['evidence'], '|') for r in R]"
# Coverage — every iOS scene listed exactly once (all three lists empty):
#   python3 -c "import yaml,glob,re,collections as C; d=yaml.safe_load(open('parity-manifest.yml')); s={re.search(r'@sceneId\s+(\S+)',open(f).read()).group(1) for f in glob.glob('samples/ios-demo/SceneViewDemo/Views/Demos/Scenes/*Scene.swift')}; n=C.Counter([i for r in d['demos'] for i in r['ios']]+[r['iosId'] for r in d['iosOnly']]); print('unlisted:', sorted(s-set(n)), 'twice:', sorted(k for k,v in n.items() if v>1), 'no scene:', sorted(set(n)-s))"
# `check-demo-id-parity.sh` reads none of these fields, so a stale `parity`
# merges silently: update the row in the same PR that changes either screen.

demos:
  # ─── working (31) — iOS has a real, non-placeholder destination ─────────
  - id: animation-physics
    androidStatus: Working
    iosStatus: working
    category: VIEW_3D
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/AnimationPhysicsDemo.kt
    ios: [animation-physics]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/AnimationDemo.swift
    contract: >-
      Animation (the Physics tab left for `rolling-balls` in #4083): Fox,
      Soldier + 4 streamed models, play/pause/speed/loop, camera
      Hero/Reveal/Vertigo/Tracking/Free
    parity: diverges
    evidence: >-
      iOS (#4236) is the Fox only, offline, on a lit studio stage: Survey/Walk/Run
      clips with a 0.35 s crossfade, play/pause, speed 0.25-2x, Loop/Once
      (khronos_fox_clips.usdz, trimmed AnimationViews). Android-only: the Soldier
      and streamed subjects, scrub, camera shots, brightness and two-clip blend
  - id: rolling-balls
    androidStatus: Working
    iosStatus: working
    category: VIEW_3D
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/RollingBallsDemo.kt
    ios: [rolling-balls]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/RollingBallsDemo.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/Scenes/RollingBallsScene.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/DoublePendulumDemo.swift
    contract: >-
      Rubber/Steel/Foam ball tray on the themed stage sky (light and dark); opening shot of a
      steel cue into a six-ball rubber pyramid; material chips drop one ball;
      Drop, Tilt, Reset on the scene; sheet with counts, Drop 10, Level,
      pitch and roll sliders. Android: a Pendulum mode holds the former
      `double-pendulum` card (samples step 0).
    parity: diverges
    evidence: >-
      #4083: iOS is a Swift port of the Android fixed-step simulation. Captured
      on Pixel_7a and iPhone 17 Pro sim: same opening shot at rest (Bodies 7 ·
      impacts 113 on both), and the same drag tilt (tip toward you: impacts
      151 on both; tip sideways: balls pile in one corner). Both stages follow
      the theme from the same tokens. Diverges in chrome only: iOS puts Drop,
      Tilt, Reset and Settings in one bottom toolbar. Pendulum mode: both
      platforms since step 0 (RollingBallsScene.swift:24-25, `double-pendulum`
      an alias of it); iOS draws grey links, an orange pivot and no bobs
      (DoublePendulumDemo.swift:198-221)
  - id: splat-preview
    androidStatus: Working
    iosStatus: working
    reason: >-
      Capability caveat on a `working` row: iOS opens the same capture but
      draws each point as a small solid dot, not a soft camera-sorted
      gaussian. SceneViewSwift has no SplatNode yet (item 2 of #2646) and
      RealityKit has no point primitive; the screen says so on its visible
      peek line ("points drawn as dots") and in its sheet.
    category: VIEW_3D
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/SplatPreviewDemo.kt
    ios: [splat-preview]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/SplatPreviewDemo.swift
      - samples/ios-demo/SceneViewDemo/Views/Demos/SplatScan.swift
    contract: >-
      Render the bundled raccoon_family.spz as a Gaussian-splat cloud,
      orbitable, with a splat-count slider and a file readout
    parity: diverges
    evidence: >-
      Same file (the Android asset, referenced by the Xcode project), same
      decode (SPZReader, a Swift port of SpzParser's v2/v3 path), same orbit
      home (scanFraming), same copy, same "Points drawn" slider. Diverges in
      the look: a point cloud of 233 808 opaque dots instead of splats.
  - id: ar-body-tracker
    androidStatus: Working
    iosStatus: working
    reason: >-
      Capability caveat on a `working` row: iOS detects a body and follows the
      body anchor's pose, but reads no per-joint data — ARKit's 91-joint
      `ARSkeleton3D` is not surfaced through a SceneView node type. The
      catalogue names it "Body anchor tracking" for that reason. Android
      renders the skeleton.
    category: UNDERSTAND
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/ARBodyTrackerDemo.kt
    ios: [ar-body-tracker]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/ARBodyTrackerDemo.swift
    contract: >-
      The rear camera finds a person and draws a live skeleton (bones and
      joints) over them; an aim banner hides once tracked.
    parity: diverges
    evidence: >-
      ARBodyTrackerDemo.swift:147-151 one 6 cm green sphere at the hip;
      ARSkeleton3D unused; raw ARView, caption without scrim :56; tagged
      skeleton in ArBodyTrackerScene.swift:9
  - id: ar-cloud-anchor
    androidStatus: Working
    iosStatus: working
    reason: >-
      Capability caveat on a `working` row (#2864): iOS resolves this id to a
      REAL scene — plane detection, tap-to-place and the anchor lifecycle are
      live — but the demo target does NOT link Google's `arcore-ios-sdk`, so
      Host / Resolve stay disabled behind a "Preview" badge and the billed
      GARSession round-trip cannot run. A missing DEPENDENCY, not a missing key
      (Android ships it; ARCORE_API_KEY is set). Vendoring arcore-ios-sdk is
      NOT planned — see #2864 for the reopen conditions.
    category: PLACE_AR
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/ARCloudAnchorDemo.kt
    ios: [ar-cloud-anchor]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/Scenes/ArCloudAnchorsScene.swift
    contract: >-
      Dock has Host | Resolve. Host: auto-place the lantern, map the room,
      upload, share the code (clipboard or share sheet). Resolve: paste a code
      and see the anchor in the same spot. Android: a Collaborative mode holds
      the former `ar-collaborative` card, two local peers sharing one placement
      (samples step 0).
    parity: broken
    evidence: >-
      bridge=nil so Host and Resolve are always disabled
      (ArCloudAnchorsScene.swift:98-100,244-247, #2864). Tap-to-place with
      plane overlay (:268-276) vs auto (ARCloudAnchorDemo.kt:168)
  - id: ar-depth-collider
    androidStatus: Working
    iosStatus: working
    category: UNDERSTAND
    android: samples/android-demo/src/main/java/io/github/sceneview/demo/demos/ARDepthColliderDemo.kt
    ios: [ar-depth-collider]
    iosFiles:
      - samples/ios-demo/SceneViewDemo/Views/Demos/Scenes/ArDepthColliderScene.swift
    contract: >-
