# Properties for the standalone RN Android bridge compile gate (see
# settings.gradle.kts). This build does NOT inherit the repo root's
# gradle.properties — it has its own project directory.

android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false

# Deliberately OFF. This build exists to ANSWER one question — "does the bridge
# Kotlin still compile against the published artifacts?" — and a `FROM-CACHE`
# compile task answers it from a previous run's hash instead of from the
# compiler. The build is one small module; a real compile every time costs
# seconds and is the only result the gate is allowed to report.
org.gradle.caching=false

# Deliberately OFF. The build's settings script installs a
# `gradle.lifecycle.beforeProject` resolution-strategy hook, and this build is
# a single tiny module where configuration caching buys nothing.
org.gradle.configuration-cache=false

# AGP 9 ships Kotlin support built in and hard-fails when
# `org.jetbrains.kotlin.android` is also applied. The module under test must KEEP
# that plugin: it is published to npm and compiled inside React Native host apps,
# whose React Native Gradle plugin still supplies AGP 8.x. Turning built-in Kotlin
# off here keeps the gate compiling the module through exactly the plugin set a
# host app gives it, while the harness itself runs on the repo's Gradle 9.7.1
# wrapper (the CI step invokes the root `./gradlew -p tools/rn-android-compile`,
# and Gradle 9.6+ cannot load AGP 8 at all).
# Remove this line, and `org.jetbrains.kotlin.android` from the module, once the
# package's supported React Native floor ships AGP 9.1+.
android.builtInKotlin=false
# Its inseparable other half: KGP refuses to apply on AGP 9's new DSL
# ("LibraryExtensionImpl cannot be cast to BaseExtension"), so opting out of
# built-in Kotlin means opting out of the new DSL as well.
android.newDsl=false

# `android.suppressUnsupportedCompileSdk` is deliberately absent (#3440): the
# harness now pins AGP 9.4.0, which supports compileSdk 37 officially, so the
# "unsupported compile SDK" warning is a real signal again.
