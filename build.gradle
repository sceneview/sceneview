plugins {
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.compose.multiplatform) apply false
    alias(libs.plugins.dokka) apply false
    alias(libs.plugins.publish) apply false
    alias(libs.plugins.detekt) apply false
    // Public-API surface tracking (#2723). Applied (NOT `apply false`): the
    // binary-compatibility-validator is a root-project plugin that registers
    // the `apiDump` / `apiCheck` tasks and configures every non-ignored
    // subproject from here.
    alias(libs.plugins.binary.compatibility.validator)
}

// ── Public-API surface tracking (binary-compatibility-validator, #2723) ──────
// Dumps the public ABI of the published library modules to committed `.api`
// files. `./gradlew apiDump` regenerates them; `./gradlew apiCheck` (blocking
// in ci.yml, same tier as the unit tests) fails a PR whose compiled public
// surface no longer matches its committed dump — so a public signature change
// is an intentional, reviewable diff. For the AI-first SDK this guards the
// exact signatures that `llms.txt` promises against silent drift.
apiValidation {
    // Validate ONLY the three published library modules: sceneview,
    // arsceneview (Android libraries) and sceneview-core (KMP). Everything
    // else is ignored by project name:
    ignoredProjects += [
        // Samples / demo apps — not published, no API contract.
        "common",
        "android-demo",
        "android-tv-demo",
        "desktop-demo",
        // sceneview-web is a JS-only KMP module published to npm, not Maven.
        // Its single `js(IR)` target has no JVM/bytecode surface for the
        // (JVM-based) validator to dump, and klib ABI validation is left
        // disabled (see below). Its public API is only documented by the
        // hand-written sceneview-web.d.ts — no automated JS ABI gate exists
        // yet (shortlist #2642 item 12), so web API drift is NOT caught here.
        "sceneview-web",
        // Doc-snippet compile guard (#2759) — generated sources, never
        // published, no API contract of its own.
        "snippets-check",
    ]

    // Klib (Kotlin/Native + JS) ABI validation stays DISABLED (the default).
    // It is still experimental and, crucially, the iOS native klibs cannot be
    // built on the ubuntu-latest CI runner that hosts `apiCheck`. sceneview-core
    // is a KMP module, but its `jvm("android")` target dump already captures the
    // whole shared commonMain public API, so the common surface is covered.
    // Enabling klib validation is tracked as a follow-up once it stabilises and
    // a macOS CI leg hosts it. (Equivalent: `klib { enabled = false }`.)
}

// Force patched versions of transitive npm dependencies (Dependabot security alerts)
plugins.withType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnPlugin) {
    extensions.getByType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnRootExtension).tap {
        resolution("serialize-javascript", ">=7.0.3")
        // webpack 5.107.0 moved `lib/ModuleNotFoundError.js` →
        // `lib/errors/ModuleNotFoundError.js`. `kotlin-web-helpers` (bundled
        // with the Kotlin/JS Gradle plugin) still does:
        //   require("webpack/lib/ModuleNotFoundError")
        // in `dist/tc-log-error-webpack.js`, so every webpack-driven task
        // crashes with `Cannot find module 'webpack/lib/ModuleNotFoundError'`
        // — and karma surfaces it as a confusing top-of-stack `karma/bin/karma`
        // line (see #1785). Covers:
        //   • :sceneview-web:jsBrowserProductionWebpack (sceneview-web npm
        //     publish — original repro that motivated #1791)
        //   • :sceneview-web:jsBrowserDistribution
        //   • :sceneview-web:jsTest (karma → webpack preprocessor)
        // Cap at <5.107.0 until kotlin-web-helpers ships a fix.
        resolution("webpack", ">=5.104.1 <5.107.0")
        resolution("webpack-dev-server", ">=5.2.1")
        resolution("path-to-regexp", ">=0.2.2")
        resolution("brace-expansion", ">=1.1.13")
    }
}

subprojects {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            publishToMavenCentral()
            signAllPublications()
        }
    }

    // Apply detekt to all subprojects that use Kotlin.
    //
    // NOTE: we use `pluginManager.apply("dev.detekt")` instead of the legacy
    // `apply plugin: "dev.detekt"` form. The legacy form silently fails to
    // register the plugin on Gradle 8.14.x in a subprojects {} block when the
    // plugin is declared in the root `plugins {}` with `apply false` — the
    // ScriptHandler can't find the dev.detekt META-INF descriptor through the
    // subproject's classpath. `pluginManager.apply(id)` resolves through the
    // root project's plugin classpath where the alias is declared, which works.
    plugins.withId("org.jetbrains.kotlin.android") {
        pluginManager.apply("dev.detekt")
    }
    plugins.withId("org.jetbrains.kotlin.multiplatform") {
        pluginManager.apply("dev.detekt")
    }
    plugins.withId("dev.detekt") {
        detekt {
            buildUponDefaultConfig = true
            config.setFrom(rootProject.files("buildSrc/config/detekt/detekt.yml"))
            parallel = true
            // Per-module baselines (generated by ./gradlew detektBaseline) live
            // next to the shared detekt.yml config and are committed to
            // grandfather pre-existing violations. New violations still fail.
            // For KMP modules detekt 2.x writes per-source-set baselines
            // (baseline-<module>-<sourceSet>SourceSet.xml) and the `baseline`
            // property is ignored; only the Android/JVM modules use the single
            // baseline-<module>.xml file.
            baseline = rootProject.file("buildSrc/config/detekt/baseline-${project.name}.xml")
        }

        // For KMP modules the bare `detekt` task is NO-SOURCE because detekt
        // 2.x scopes source-file analysis to the per-source-set tasks
        // (detektCommonMainSourceSet, detektAndroidMainSourceSet, ...). Wire
        // the plain `detekt` task to depend on every detekt*SourceSet task so
        // that `./gradlew :<module>:detekt` actually analyzes all source sets,
        // matching the Android/JVM module behavior.
        plugins.withId("org.jetbrains.kotlin.multiplatform") {
            tasks.named("detekt") {
                dependsOn(tasks.matching { it.name.startsWith("detekt") && it.name.endsWith("SourceSet") && !it.name.contains("Baseline") })
            }
        }
    }

    // ── CI hang diagnostics + fail-fast for JVM unit tests (#2692) ────────────
    // The `Unit tests` CI job intermittently hung >30 min with ZERO output and
    // was force-cancelled at its job timeout, naming NO culprit test — the log
    // went silent the moment `testDebugUnitTest` started, so every hang was
    // unattributable. Two safeguards convert that silent 30-min kill into a
    // named, thread-dumped failure:
    //
    //   1. `testLogging` emits a `started` event per test method, so the CI log
    //      always names the test currently running. The NEXT hang points at the
    //      exact test instead of going dark. (`passed` is deliberately omitted —
    //      `started` already names the culprit and a line-per-pass is noise.)
    //   2. A per-task `timeout` fires at 15 min — comfortably above the whole
    //      suite's normal <20-min wall time yet well under the job's 30-min
    //      ceiling — so a genuinely hung test task self-cancels with a Gradle
    //      thread dump (stack trace of the stuck thread) instead of silently
    //      eating the job. `--stacktrace` on the CI step then attributes it.
    //
    // Scoped to JVM `Test` tasks only: KMP `jsTest` / native test tasks are a
    // different task type and are unaffected, and instrumented
    // `connectedAndroidTest` tasks are `DeviceProviderInstrumentTestTask`, not
    // `Test`, so they are never timeout-killed by this convention.
    tasks.withType(Test).configureEach {
        testLogging {
            events "started", "skipped", "failed"
            exceptionFormat = "full"
        }
        timeout.set(java.time.Duration.ofMinutes(15))
    }
}
