plugins {
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.compose.compiler) apply false
    alias(libs.plugins.compose.multiplatform) apply false
    alias(libs.plugins.dokka) apply false
    alias(libs.plugins.publish) apply false
    alias(libs.plugins.detekt) apply false
}

// Force patched versions of transitive npm dependencies (Dependabot security alerts)
plugins.withType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnPlugin) {
    extensions.getByType(org.jetbrains.kotlin.gradle.targets.js.yarn.YarnRootExtension).tap {
        resolution("serialize-javascript", ">=7.0.3")
        // webpack 5.107.0 moved `lib/ModuleNotFoundError.js` →
        // `lib/errors/ModuleNotFoundError.js`. `kotlin-web-helpers` (bundled
        // with the Kotlin/JS Gradle plugin) still does:
        //   require("webpack/lib/ModuleNotFoundError")
        // in `dist/tc-log-error-webpack.js`, so every webpack-driven task
        // crashes with `Cannot find module 'webpack/lib/ModuleNotFoundError'`
        // — and karma surfaces it as a confusing top-of-stack `karma/bin/karma`
        // line (see #1785). Covers:
        //   • :sceneview-web:jsBrowserProductionWebpack (sceneview-web npm
        //     publish — original repro that motivated #1791)
        //   • :sceneview-web:jsBrowserDistribution
        //   • :sceneview-web:jsTest (karma → webpack preprocessor)
        // Cap at <5.107.0 until kotlin-web-helpers ships a fix.
        resolution("webpack", ">=5.104.1 <5.107.0")
        resolution("webpack-dev-server", ">=5.2.1")
        resolution("path-to-regexp", ">=0.2.2")
        resolution("brace-expansion", ">=1.1.13")
    }
}

subprojects {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            publishToMavenCentral()
            signAllPublications()
        }
    }

    // Apply detekt to all subprojects that use Kotlin.
    //
    // NOTE: we use `pluginManager.apply("dev.detekt")` instead of the legacy
    // `apply plugin: "dev.detekt"` form. The legacy form silently fails to
    // register the plugin on Gradle 8.14.x in a subprojects {} block when the
    // plugin is declared in the root `plugins {}` with `apply false` — the
    // ScriptHandler can't find the dev.detekt META-INF descriptor through the
    // subproject's classpath. `pluginManager.apply(id)` resolves through the
    // root project's plugin classpath where the alias is declared, which works.
    plugins.withId("org.jetbrains.kotlin.android") {
        pluginManager.apply("dev.detekt")
    }
    plugins.withId("org.jetbrains.kotlin.multiplatform") {
        pluginManager.apply("dev.detekt")
    }
    plugins.withId("dev.detekt") {
        detekt {
            buildUponDefaultConfig = true
            config.setFrom(rootProject.files("buildSrc/config/detekt/detekt.yml"))
            parallel = true
            // Per-module baselines (generated by ./gradlew detektBaseline) live
            // next to the shared detekt.yml config and are committed to
            // grandfather pre-existing violations. New violations still fail.
            // For KMP modules detekt 2.x writes per-source-set baselines
            // (baseline-<module>-<sourceSet>SourceSet.xml) and the `baseline`
            // property is ignored; only the Android/JVM modules use the single
            // baseline-<module>.xml file.
            baseline = rootProject.file("buildSrc/config/detekt/baseline-${project.name}.xml")
        }

        // For KMP modules the bare `detekt` task is NO-SOURCE because detekt
        // 2.x scopes source-file analysis to the per-source-set tasks
        // (detektCommonMainSourceSet, detektAndroidMainSourceSet, ...). Wire
        // the plain `detekt` task to depend on every detekt*SourceSet task so
        // that `./gradlew :<module>:detekt` actually analyzes all source sets,
        // matching the Android/JVM module behavior.
        plugins.withId("org.jetbrains.kotlin.multiplatform") {
            tasks.named("detekt") {
                dependsOn(tasks.matching { it.name.startsWith("detekt") && it.name.endsWith("SourceSet") && !it.name.contains("Baseline") })
            }
        }
    }
}
