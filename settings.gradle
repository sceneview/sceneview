pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT allows Kotlin/JS plugin to add Node.js and Yarn repositories
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
}
rootProject.name = "SceneView"
include ":sceneview-core"
include ":sceneview"
include ":arsceneview"
include ":sceneview-web"

// Doc-snippet compile guard (#2759) — generated sources only, never published.
include ":snippets-check"
project(":snippets-check").projectDir = file("tools/snippets-check")

// Samples — one unified showcase per platform ({platform}-demo)
include ":samples:common"
include ":samples:android-demo"         // Android (Play Store)
include ":samples:android-tv-demo"      // Android TV
include ":samples:desktop-demo"         // Desktop (Windows/macOS/Linux)
// Web demo: samples/web-demo/ — plain static-site (HTML + inline JS +
//   self-hosted sceneview.js); NOT a Gradle module. Its dead Kotlin/JS
//   source set was removed in #1946 — the inline JS is the single runtime.
//   Built by a verbatim file copy (docs.yml) and tested with Playwright.
// Flutter demo: samples/flutter-demo/ (Dart, not Gradle)
// React Native demo: samples/react-native-demo/ (JS, not Gradle)
// iOS demo: samples/ios-demo/ (Xcode, not Gradle)
