plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace = "io.github.sceneview.sample.tv"

    compileSdk 37

    defaultConfig {
        applicationId "io.github.sceneview.sample.tv"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // The debug APK attached to GitHub Releases (build-apks.yml) is signed
        // with one stable key, registered for Android developer verification,
        // instead of the runner's throwaway debug key. Only that workflow sets
        // SCENEVIEW_GITHUB_KEYSTORE_FILE: local and PR builds keep the debug key.
        githubApk {
            def keystoreFile = System.getenv("SCENEVIEW_GITHUB_KEYSTORE_FILE")
            def keystorePass = System.getenv("SCENEVIEW_GITHUB_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("SCENEVIEW_GITHUB_KEY_ALIAS")
            def keyPass = System.getenv("SCENEVIEW_GITHUB_KEY_PASSWORD")

            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("SCENEVIEW_GITHUB_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.githubApk
            }
        }
        release {
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
    }
    androidResources {
        // en-US only, like the phone demo: no translated `values-<locale>/`
        // folders here, and library translations are dropped too.
        localeFilters += ['en-rUS']
        noCompress 'filamat', 'ktx'
    }
    // Asset folders: TV demo's own assets (src/main/assets) hold the TV-only
    // models (nike_air_jordan, toon_cat, khronos_duck). The shared models +
    // environments live in the phone demo's folder and are picked up at
    // build time via sourceSets so the TV demo can reference them by their
    // existing `models/...` paths without copying or symlinking. This split
    // keeps the phone APK from carrying the TV-only models — see issue #879.
    //
    // A model may live in exactly ONE of the two folders: this is a source-set
    // MERGE, so the same `models/x.glb` in both is `Error: Duplicate resources`
    // at `mergeAssets`, not a silent last-one-wins. The sheen chair, velvet sofa
    // and iridescent dish were TV-only until #3324 gave them to the phone
    // picker; they moved to the phone folder rather than being copied, and the
    // TV demo still reaches them at the same `models/...` paths through this
    // line. `TvModelListTest` searches both folders, which is what makes such a
    // move a no-op for the TV demo.
    sourceSets.main.assets.srcDirs += '../android-demo/src/main/assets'
    // Allow TvModelListTest to read src/main/assets/ from its test source set
    // via a relative path (test working dir is this module's root).
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// AGP 9 ships built-in Kotlin support, so `org.jetbrains.kotlin.android` is gone
// and with it the `android { kotlinOptions { } }` block. The Kotlin JVM target
// now lives in the top-level `kotlin { }` extension AGP registers itself.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    // Compose BOM
    implementation platform(libs.androidx.compose.bom)

    implementation project(":samples:common")

    // SceneView
    implementation project(":sceneview")

    // TV Compose (Leanback)
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material

    // Unit tests — verify every bundled model referenced by TvModelViewerActivity
    // actually exists in src/main/assets/. Prevents regressing the session-34 fix.
    testImplementation "junit:junit:4.13.2"
}

// ─── Binary 3D assets (assets/manifest.json) ─────────────────────────────
//
// The TV demo's models are not in git: they live on the `assets-v1` GitHub
// Release and `tools/fetch-assets.sh` materialises them under src/main/assets/.
// preBuild (every variant) and the unit tests, which read those files from the
// source tree, depend on this task, so a build never packages an APK without
// its models. No outputs declared on purpose: it always runs, and the script is
// a hash check once the shared cache (~/.cache/sceneview-assets) is warm.
def fetchAssets = tasks.register("fetchAssets", Exec) {
    description = "Materialises the TV demo's binary assets listed in assets/manifest.json."
    group = "build"
    workingDir rootProject.projectDir
    // The TV app also packages ../android-demo/src/main/assets (`sourceSets`
    // above), so it needs the android scope too.
    commandLine "bash", rootProject.file("tools/fetch-assets.sh").absolutePath, "--scope", "tv", "--scope", "android"
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(fetchAssets)
}
tasks.withType(Test).configureEach {
    dependsOn(fetchAssets)
}
