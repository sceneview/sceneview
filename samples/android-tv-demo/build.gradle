plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.compose.compiler)
}

android {
    namespace = "io.github.sceneview.sample.tv"

    compileSdk 37

    defaultConfig {
        applicationId "io.github.sceneview.sample.tv"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
    }
    androidResources {
        noCompress 'filamat', 'ktx'
    }
    // Asset folders: TV demo's own assets (src/main/assets) hold the TV-only
    // models (nike_air_jordan, toon_cat, khronos_duck). The shared models +
    // environments live in the phone demo's folder and are picked up at
    // build time via sourceSets so the TV demo can reference them by their
    // existing `models/...` paths without copying or symlinking. This split
    // keeps the phone APK from carrying the TV-only models — see issue #879.
    //
    // A model may live in exactly ONE of the two folders: this is a source-set
    // MERGE, so the same `models/x.glb` in both is `Error: Duplicate resources`
    // at `mergeAssets`, not a silent last-one-wins. The sheen chair, velvet sofa
    // and iridescent dish were TV-only until #3324 gave them to the phone
    // picker; they moved to the phone folder rather than being copied, and the
    // TV demo still reaches them at the same `models/...` paths through this
    // line. `TvModelListTest` searches both folders, which is what makes such a
    // move a no-op for the TV demo.
    sourceSets.main.assets.srcDirs += '../android-demo/src/main/assets'
    // Allow TvModelListTest to read src/main/assets/ from its test source set
    // via a relative path (test working dir is this module's root).
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// AGP 9 ships built-in Kotlin support, so `org.jetbrains.kotlin.android` is gone
// and with it the `android { kotlinOptions { } }` block. The Kotlin JVM target
// now lives in the top-level `kotlin { }` extension AGP registers itself.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    // Compose BOM
    implementation platform(libs.androidx.compose.bom)

    implementation project(":samples:common")

    // SceneView
    implementation project(":sceneview")

    // TV Compose (Leanback)
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material

    // Unit tests — verify every bundled model referenced by TvModelViewerActivity
    // actually exists in src/main/assets/. Prevents regressing the session-34 fix.
    testImplementation "junit:junit:4.13.2"
}
