org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `android.suppressUnsupportedCompileSdk` is gone (#3440): this build now pins
# AGP 9.4.0, which supports compileSdk 37 officially.

# AGP 9's built-in Kotlin support is opted OUT of here, exactly as in the repo
# root's gradle.properties (see the long note there). The reason is different and
# stronger, though: the `flutter_sceneview` plugin module included in this build
# is PUBLISHED to pub.dev and compiled inside end-user Flutter apps, whose Android
# template still supplies AGP 8.x. It must therefore keep applying
# `kotlin-android` and using `kotlinOptions`, which AGP 9 only tolerates with
# these two flags.
# Remove both when Flutter's Android template ships AGP 9.1+ and the plugin module
# can move to built-in Kotlin without breaking the apps that consume it.
android.builtInKotlin=false
android.newDsl=false
