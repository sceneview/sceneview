// Resolve store secrets once, at android-block scope, so both `defaultConfig`
// (which injects them into the manifest / BuildConfig) and the release secret
// guard below (#1915) can see the same resolved values.
//
// Each key is read from one of:
//   1. its environment variable (CI / store-bound builds)
//   2. repo-root local.properties (developer machines)
//   3. fallback empty string (the feature stays disabled at runtime — and the
//      #1915 release guard refuses to ship a store APK in that state)
def loadFromLocalProperties = { String propertyName ->
    def localPropsFile = rootProject.file("local.properties")
    if (!localPropsFile.exists()) {
        return ""
    }
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    return localProps.getProperty(propertyName, "")
}

// ARCORE_API_KEY env var -> local.properties `ARCORE_API_KEY`. Injected into
// AndroidManifest.xml as the `arcoreApiKey` placeholder. Empty => Streetscape /
// Geospatial / Cloud Anchors stay disabled via the demo's `hasArcoreApiKey`
// check. See samples/android-demo/ARCORE_CLOUD_SETUP.md to provision your own key.
def arcoreApiKey = System.getenv("ARCORE_API_KEY") ?: ""
if (arcoreApiKey.isEmpty()) {
    arcoreApiKey = loadFromLocalProperties("ARCORE_API_KEY")
}

// SKETCHFAB_API_KEY env var -> local.properties `sketchfab.api.key`. Injected
// into BuildConfig so SketchfabService can authenticate against
// api.sketchfab.com. Empty => Sketchfab features stay disabled
// (SketchfabConfig.apiKey returns null, the service throws MissingApiKey).
// TODO V1.1: route requests via the mcp-gateway proxy so end-users never see
// the master key in the APK. See SketchfabConfig.kt.
def sketchfabApiKey = System.getenv("SKETCHFAB_API_KEY") ?: ""
if (sketchfabApiKey.isEmpty()) {
    sketchfabApiKey = loadFromLocalProperties("sketchfab.api.key")
}

// FEEDBACK_WORKER_URL — base URL of the in-app-feedback Cloudflare worker
// (feedback-worker/, see #1934). The Android flow POSTs multipart submissions
// to `<base>/v1/feedback`. Resolution order: env var -> local.properties
// `feedback.worker.url` -> the default constant below.
//
// ⚠️ MAINTAINER: the worker is not deployed yet. The default below is the
// PLANNED workers.dev subdomain — once the worker is published, set the real
// URL here (or via the env var / local.properties) so released APKs hit it.
def feedbackWorkerUrl = System.getenv("FEEDBACK_WORKER_URL") ?: ""
if (feedbackWorkerUrl.isEmpty()) {
    feedbackWorkerUrl = loadFromLocalProperties("feedback.worker.url")
}
if (feedbackWorkerUrl.isEmpty()) {
    feedbackWorkerUrl = "https://sceneview-feedback.mcp-tools-lab.workers.dev"
}

android {
    namespace = "io.github.sceneview.demo"

    compileSdk 36


    defaultConfig {
        applicationId "io.github.sceneview.demo"
        minSdk 28
        targetSdk 36
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 350
        versionName "4.9.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The key MUST NEVER be committed — see the resolution block above.
        manifestPlaceholders["arcoreApiKey"] = arcoreApiKey
        buildConfigField "String", "SKETCHFAB_API_KEY", "\"${sketchfabApiKey}\""
        // Single source of truth for the feedback-worker base URL (#1934).
        buildConfigField "String", "FEEDBACK_WORKER_URL", "\"${feedbackWorkerUrl}\""
    }

    signingConfigs {
        release {
            // Populated from environment variables or local.properties
            def keystoreFile = System.getenv("SCENEVIEW_DEMO_KEYSTORE_FILE")
            def keystorePass = System.getenv("SCENEVIEW_DEMO_KEYSTORE_PASSWORD")
            def ksAlias = System.getenv("SCENEVIEW_DEMO_KEY_ALIAS")
            def keyPass = System.getenv("SCENEVIEW_DEMO_KEY_PASSWORD")

            if (keystoreFile != null) {
                storeFile file(keystoreFile)
                storePassword keystorePass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = System.getenv("SCENEVIEW_DEMO_KEYSTORE_FILE")
            if (keystoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Build-time fail-loud guard for store secrets (#1915).
    //
    // An empty SKETCHFAB_API_KEY / ARCORE_API_KEY compiles silently — Gradle is
    // happy with `""` — and ships a store APK whose Sketchfab carousels are
    // invisible and whose Streetscape / Geospatial / Cloud Anchor demos are
    // disabled, with nothing surfacing the cause. That is the exact silent-fail
    // class that caused #1909 (empty carousels on Play Store for weeks).
    //
    // Refuse to assemble a RELEASE variant when either secret is empty. Debug
    // builds stay permissive — developers without the keys still need to compile.
    // Forks / PRs from forks (no access to org secrets) opt out by setting
    // `SV_ALLOW_MISSING_SECRETS=1` in the environment, or pass
    // `-PSV_ALLOW_MISSING_SECRETS=1` on the Gradle command line.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name != "release") {
            return
        }
        def allowMissing = System.getenv("SV_ALLOW_MISSING_SECRETS") == "1" ||
                (project.hasProperty("SV_ALLOW_MISSING_SECRETS") &&
                        project.property("SV_ALLOW_MISSING_SECRETS").toString() == "1")
        variant.assembleProvider.configure { assembleTask ->
            assembleTask.doFirst {
                if (allowMissing) {
                    logger.warn("⚠️  SV_ALLOW_MISSING_SECRETS=1 — skipping release secret guard (#1915).")
                    return
                }
                def missing = []
                if (sketchfabApiKey == null || sketchfabApiKey.trim().isEmpty()) {
                    missing << "SKETCHFAB_API_KEY"
                }
                if (arcoreApiKey == null || arcoreApiKey.trim().isEmpty()) {
                    missing << "ARCORE_API_KEY"
                }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "Release build refusing to ship without store secrets: " +
                            "${missing.join(', ')}.\n" +
                            "  An empty key compiles silently and ships a store APK with\n" +
                            "  invisible Sketchfab carousels / disabled AR Geospatial demos\n" +
                            "  (the #1909 silent-fail class).\n" +
                            "  Fix: set the missing secret(s) as environment variables\n" +
                            "  (CI: GitHub Secrets), or in the repo-root local.properties\n" +
                            "  (SKETCHFAB_API_KEY -> sketchfab.api.key, ARCORE_API_KEY -> ARCORE_API_KEY).\n" +
                            "  Forks without org secrets: pass -PSV_ALLOW_MISSING_SECRETS=1\n" +
                            "  or export SV_ALLOW_MISSING_SECRETS=1 to override.")
                }
                logger.lifecycle("✅ Release secret guard (#1915): SKETCHFAB_API_KEY + ARCORE_API_KEY present.")
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    androidResources {
        // `.filamat` and `.ktx` are already compressed payloads — re-zipping
        // them in the APK only wastes CPU. `.glb` and `.hdr` stay compressible:
        // the demo GLBs are Draco + WebP packed and the HDRs are RGBE, both of
        // which the APK zip stage still shrinks meaningfully.
        noCompress 'filamat', 'ktx'
    }
    packaging {
        resources {
            // Drop duplicate transitive licence / metadata files that several
            // AndroidX artifacts each ship — pure dead weight in the APK.
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/androidx/**',
                'META-INF/{AL2.0,LGPL2.1}',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'kotlin/**',
                'DebugProbesKt.bin',
            ]
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.logging.enabled', 'true'
            }
        }
    }
}

dependencies {
    // Compose BOM
    implementation platform(libs.androidx.compose.bom)

    implementation project(":samples:common")

    // Compose (extras beyond what :samples:common provides)
    implementation libs.androidx.compose.material.icons.extended
    // Material 3 Expressive APIs (alpha, newer than BOM's stable release)
    implementation libs.androidx.compose.material3.expressive

    // Compose @Preview annotation — needed at compile time so the AS preview pane and
    // Roborazzi snapshot tests can discover @Preview functions on the demos.
    implementation libs.androidx.compose.ui.tooling.preview
    // ui-tooling provides the runtime that renders @Preview functions in the AS pane;
    // shipping it in debug only avoids bundling the inspector into release APKs.
    debugImplementation libs.androidx.compose.ui.tooling

    // SceneView — 3D + AR
    implementation project(":sceneview")
    implementation project(":arsceneview")

    // Google Play In-App Updates — Play Core deps come via :samples:common
    // (`api libs.play.app.update*`). Manager + banner live in
    // `io.github.sceneview.sample.common.update.*`.

    // Sketchfab API client — OkHttp for network, kotlinx-serialization for JSON.
    // Used by io.github.sceneview.demo.sketchfab.SketchfabService to stream
    // models from api.sketchfab.com instead of bundling GLBs in the APK.
    implementation libs.okhttp
    implementation libs.kotlinx.serialization.json

    // Google Fused Location Provider — required by ARCore Geospatial mode
    // (Config.GeospatialMode.ENABLED) used by ARStreetscapeDemo. Without this
    // dependency on the classpath, Session.configure() throws an
    // IllegalStateException complaining about missing FLP classes and the
    // Streetscape demo renders a black screen.
    implementation libs.play.services.location

    // ML Kit Object Detection — bundled model so ARMLObjectLabelDemo works
    // offline. The default options classify generic categories (Home good,
    // Fashion good, Food, Place, Plant). For finer labels callers can plug
    // in a custom TFLite model via ObjectDetectorOptions / CustomObjectDetectorOptions.
    // See ARMLObjectLabelDemo (#1737).
    implementation libs.mlkit.object.detection

    // MediaPipe Tasks Vision — on-device Pose Landmarker for the AR Body Tracker demo.
    // ARCore has no native body-tracking API, so the demo feeds the AR CPU camera image
    // to MediaPipe and projects the 33 image-space landmarks onto SceneView's 17
    // ARKit-parity Joint enum. The .task model is bundled in src/main/assets. Demo-only
    // dependency — the published arsceneview artifact carries no MediaPipe code, just the
    // renderer-agnostic BodyPose / Joint value types. See ARBodyTrackerDemo (#1763).
    implementation libs.mediapipe.tasks.vision

    // Screenshot testing (Roborazzi — JVM, no emulator needed)
    testImplementation libs.robolectric
    testImplementation libs.roborazzi
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.rule
    testImplementation libs.androidx.test.junit
    testImplementation platform(libs.androidx.compose.bom)
    testImplementation libs.androidx.compose.ui

    // UiAutomator-based interaction tests. Drives the real demo app process through
    // DemoHostActivity (debug flavour) — no ComposeTestRule, no Filament thread-adoption
    // races. Screenshots grabbed via UiDevice cover the full framebuffer including the
    // SurfaceView that Compose's captureToImage() cannot see.
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.uiautomator
}

// ─── Generated demo registry (issue #1976) ───────────────────────────────
//
// `GeneratedDemos.kt` is the collated output of the append-only DemoRegistry
// fragments (#1797). It used to be committed, which guaranteed a merge conflict
// on every parallel demo-adding PR. It is now `.gitignore`d and regenerated at
// build time by this task — the same treatment #1928 applied to the MCP's
// `llms-txt.ts`. A clean checkout with NO `GeneratedDemos.kt` present builds
// `:samples:android-demo` because every Kotlin compilation depends on this task.
//
// `--kt-only` writes ONLY `GeneratedDemos.kt`; the collator's other two outputs
// (root `llms.txt` + `docs/docs/llms.txt`) stay tracked and hand-maintained, so
// the build must never rewrite them.
def collatorScript = rootProject.file("samples/android-demo/scripts/collate-demos.sh")
def fragmentsDir = file("src/main/java/io/github/sceneview/demo/fragments")
def valuesDir = file("src/main/res/values")
def generatedDemosFile = file("src/main/java/io/github/sceneview/demo/fragments/GeneratedDemos.kt")

def generateDemoRegistry = tasks.register("generateDemoRegistry", Exec) {
    description = "Regenerates GeneratedDemos.kt from the per-demo DemoRegistry fragments (#1976)."
    group = "build"

    // Re-run when a fragment is added/removed/edited or a demo string changes —
    // the collator reads fragment metadata and resolves titles from values/*.xml.
    inputs.dir(fragmentsDir).withPropertyName("fragments")
    inputs.dir(valuesDir).withPropertyName("demoStrings")
    inputs.file(collatorScript).withPropertyName("collator")
    outputs.file(generatedDemosFile).withPropertyName("generatedDemos")

    workingDir rootProject.projectDir
    commandLine "bash", collatorScript.absolutePath, "--kt-only"
}

// Make every Kotlin compilation (debug/release, app + unit tests) depend on the
// generator so a fresh checkout always has GeneratedDemos.kt before kotlinc runs.
tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }.configureEach {
    dependsOn(generateDemoRegistry)
}
tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn(generateDemoRegistry)
}
